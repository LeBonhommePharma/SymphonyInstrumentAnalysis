name: Fix www HTTPS (GoDaddy)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply www CNAME via GoDaddy
        env:
          GODADDY_API_KEY: ${{ secrets.GODADDY_API_KEY }}
          GODADDY_API_SECRET: ${{ secrets.GODADDY_API_SECRET }}
          GODADDY_PAT: ${{ secrets.GODADDY_PAT }}
        run: python3 scripts/https_cert.py --apply-dns
