<!DOCTYPE html>
<html lang="fr" data-theme="stealth" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <style>html,body{background:#121214;color-scheme:dark}
    .pages-crumb {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 0.78rem;
      font-weight: 650;
      color: var(--muted);
    }
    .pages-crumb a { color: var(--muted); text-decoration: none; }
    .pages-crumb a:hover { color: var(--ink); }
  </style>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("crayon-theme");
      var mode = localStorage.getItem("crayon-theme-mode");
      var ok = { day: 1, light: 1, dark: 1, night: 1, stealth: 1 };
      if (mode !== "manual" || !t || !ok[t]) {
        var h = new Date().getHours();
        var light = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
        if (h >= 21 || h < 6) t = light ? "night" : "stealth";
        else if (h >= 17) t = light ? "light" : "night";
        else t = light ? "day" : "light";
      }
      var light = t === "day" || t === "light";
      var bg = { day: "#f6ead4", light: "#eef1f5", dark: "#1c1e24", night: "#0d1220", stealth: "#121214" }[t];
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-scheme", light ? "light" : "dark");
      document.documentElement.style.colorScheme = light ? "light" : "dark";
      document.documentElement.style.background = bg;
      document.documentElement.style.backgroundColor = bg;
    } catch (e) {}
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Piano-crayon">
  <title>Piano-crayon</title>
  <style>
    :root,
    html[data-theme="stealth"] {
      --bg: #121214;
      --ink: #9a9aa2;
      --muted: #6e6e76;
      --paper: #18181c;
      --paper-ink: #9a9aa2;
      --hairline: #333338;
      --hairline-strong: #3a3a42;
      --key-white: #2a2a2e;
      --key-white-edge: #333338;
      --key-black: #1a1a1c;
      --key-black-edge: #161618;
      --live: rgb(111, 153, 72);
      --stop: rgb(153, 72, 73);
      --replay: rgb(72, 72, 153);
      --replay-on: rgb(72, 126, 153);
      --tap: color-mix(in srgb, #9a9aa2 18%, transparent);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dt: 150ms;
      --glow: 8%;
      --wave-bed: #16161a;
      --wave-grid: rgba(255,255,255,0.03);
      --btn-face: #1c1c20;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }
    html[data-theme="day"] {
      --bg: #f6ead4;
      --ink: #2a2218;
      --muted: #6a5e50;
      --paper: #fff6e8;
      --paper-ink: #2a2218;
      --hairline: #e2d4bc;
      --hairline-strong: #c9b89a;
      --key-white: #fffaf0;
      --key-white-edge: #e2d4bc;
      --key-black: #3f3328;
      --key-black-edge: #2c241c;
      --live: rgb(121, 176, 69);
      --stop: rgb(196, 59, 61);
      --replay: rgb(69, 69, 186);
      --replay-on: rgb(76, 151, 189);
      --tap: color-mix(in srgb, var(--ink) 14%, transparent);
      --glow: 32%;
      --wave-bed: #ebe0cc;
      --wave-grid: rgba(40,32,24,0.08);
      --btn-face: #fff6e8;
    }
    html[data-theme="light"] {
      --bg: #eef1f5;
      --ink: #1a2028;
      --muted: #5c6672;
      --paper: #ffffff;
      --paper-ink: #1a2028;
      --hairline: #d5dbe3;
      --hairline-strong: #b7c0cc;
      --key-white: #f7f8fa;
      --key-white-edge: #d5dbe3;
      --key-black: #2c3340;
      --key-black-edge: #1c222c;
      --live: rgb(52, 168, 88);
      --stop: rgb(196, 59, 61);
      --replay: rgb(69, 69, 186);
      --replay-on: rgb(56, 140, 184);
      --tap: color-mix(in srgb, var(--ink) 12%, transparent);
      --glow: 28%;
      --wave-bed: #e4e9f0;
      --wave-grid: rgba(28,34,44,0.08);
      --btn-face: #ffffff;
    }
    html[data-theme="dark"] {
      --bg: #1c1e24;
      --ink: #d2d4dc;
      --muted: #8b8e98;
      --paper: #262830;
      --paper-ink: #d2d4dc;
      --hairline: #3a3c46;
      --hairline-strong: #4a4d58;
      --key-white: #343848;
      --key-white-edge: #3a3c46;
      --key-black: #161820;
      --key-black-edge: #101218;
      --live: rgb(121, 176, 69);
      --stop: rgb(196, 90, 92);
      --replay: rgb(110, 110, 196);
      --replay-on: rgb(86, 160, 196);
      --tap: color-mix(in srgb, #d2d4dc 16%, transparent);
      --glow: 34%;
      --wave-bed: #1a1c22;
      --wave-grid: rgba(255,255,255,0.05);
      --btn-face: #262830;
    }
    html[data-theme="night"] {
      --bg: #0d1220;
      --ink: #c8d0e4;
      --muted: #7a849c;
      --paper: #151b2c;
      --paper-ink: #c8d0e4;
      --hairline: #2a3348;
      --hairline-strong: #3a4660;
      --key-white: #243044;
      --key-white-edge: #2a3348;
      --key-black: #0e1422;
      --key-black-edge: #0a0e18;
      --live: rgb(121, 176, 69);
      --stop: rgb(196, 90, 92);
      --replay: rgb(120, 130, 210);
      --replay-on: rgb(90, 170, 210);
      --tap: color-mix(in srgb, #c8d0e4 16%, transparent);
      --glow: 38%;
      --wave-bed: #101628;
      --wave-grid: rgba(200,208,228,0.06);
      --btn-face: #151b2c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      overscroll-behavior: none;
    }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); color-scheme: dark; }
    html[data-scheme="light"] { background: var(--bg); color-scheme: light; }
    body {
      font-family: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif;
      font-optical-sizing: auto;
      background: var(--bg);
      color: var(--ink);
      transition: background-color var(--dt) var(--ease), color var(--dt) var(--ease);
      padding:
        max(14px, var(--safe-t))
        max(16px, var(--safe-r))
        max(18px, var(--safe-b))
        max(16px, var(--safe-l));
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .scenes {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 999px;
      background: var(--paper);
      border: 1px solid var(--hairline);
    }
    .scene {
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.22);
      background: var(--swatch);
    }
    .scene[data-theme-set="day"] { --swatch: #f6ead4; box-shadow: inset 0 0 0 1px #b89f78; }
    .scene[data-theme-set="light"] { --swatch: #eef1f5; box-shadow: inset 0 0 0 1px #8a97a8; }
    .scene[data-theme-set="dark"] { --swatch: #1c1e24; box-shadow: inset 0 0 0 1px #6a6e7c; }
    .scene[data-theme-set="night"] { --swatch: #0d1220; box-shadow: inset 0 0 0 1px #5a6a90; }
    .scene[data-theme-set="stealth"] { --swatch: #121214; box-shadow: inset 0 0 0 1px #6e6e76; }
    .scene-auto {
      font: 700 0.68rem/1 "SF Pro Text", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px var(--hairline);
    }
    .scene-auto[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    .scene[aria-pressed="true"] {
      box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 1px rgba(0,0,0,0.35);
    }
    .scene:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    h1 {
      margin: 0 0 2px;
      font-size: clamp(1.12rem, 2.2vw, 1.48rem);
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .work {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 38vw);
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }
    .spec-panel h3 {
      margin: 0 0 6px;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #spec {
      width: 100%;
      height: 220px;
      display: block;
      border-radius: 10px;
      background: var(--wave-bed);
    }
    @media (max-width: 820px) {
      .work { grid-template-columns: 1fr; }
    }
    button, input, select {
      font: inherit;
      font-size: 1rem;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      align-items: center;
      margin-bottom: 12px;
    }
    .transport,
    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .act,
    .tog {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 36px;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font: 650 0.8rem/1 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: var(--tap);
      position: relative;
    }
    .act .lab,
    .tog .lab {
      white-space: nowrap;
    }
    .act:focus-visible,
    .tog:focus-within {
      outline: 1px solid var(--ink);
      outline-offset: 2px;
    }
    .act.playing,
    .act.live,
    .tog:has(input:checked) {
      background: color-mix(in srgb, var(--ink) 12%, var(--paper));
      border-color: var(--hairline-strong);
    }
    .act.loading { opacity: 0.7; }
    .act .glyph {
      flex: 0 0 auto;
      width: 8px;
      height: 8px;
      background: currentColor;
      border-radius: 1px;
    }
    .act .glyph.play {
      width: 0;
      height: 0;
      background: none;
      border-style: solid;
      border-width: 5px 0 5px 8px;
      border-color: transparent transparent transparent currentColor;
    }
    .act.playing .glyph.play,
    .act.live .glyph.listen {
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 1px;
      background: currentColor;
    }
    .act .glyph.listen {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }
    .tog input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .scrub {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 12px;
      align-items: end;
      margin: 0 0 10px;
    }
    .arrange {
      min-width: 0;
      outline: none;
      touch-action: none;
    }
    .arrange-ruler {
      height: 18px;
      position: relative;
      color: var(--muted);
      font-size: 0.62rem;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .arrange-ruler span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
    }
    .arrange-ruler span:first-child { transform: none; }
    .arrange-stack {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      min-height: 64px;
      max-height: 280px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      overflow: hidden;
      background: var(--wave-bed);
    }
    .arrange-heads {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border-right: 1px solid var(--hairline);
      overflow: auto;
    }
    .arrange-head {
      flex: 1 1 0;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--hairline);
      cursor: pointer;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
    }
    .arrange-head:last-child { border-bottom: 0; }
    .arrange-head.dim { opacity: 0.38; }
    .arrange-head[aria-pressed="true"] {
      outline: 1px solid var(--ink);
      outline-offset: -2px;
    }
    .arrange-swatch {
      width: 28px;
      height: 8px;
      border-radius: 1px;
      background: var(--crayon, var(--replay));
      flex: 0 0 auto;
    }
    .arrange-head .nm {
      font-size: 0.62rem;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .arrange-lane {
      position: relative;
      min-height: 64px;
      cursor: ew-resize;
      touch-action: none;
      contain: layout style;
    }
    .arrange-lane canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      margin-left: -1px;
      background: #e8e8ee;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }
    .playhead::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 7px solid #e8e8ee;
    }
    .scrub .clock {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-weight: 650;
      color: var(--ink);
      font-size: 0.82rem;
      min-width: 4.8rem;
      padding-bottom: 6px;
    }
    .tracks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: stretch;
      margin: 0 0 8px;
      min-height: 44px;
    }
    .track-count {
      width: 28px;
      min-width: 28px;
      height: 44px;
      display: grid;
      place-items: center;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-weight: 650;
      font-size: 0.82rem;
      color: var(--muted);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      background: color-mix(in srgb, var(--ink) 6%, var(--bg));
      cursor: pointer;
      padding: 0;
    }
    .track-count:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    .track-btn.off {
      opacity: 0.28;
    }
    .track-btn {
      position: relative;
      overflow: hidden;
      font-size: 0.68rem;
      font-weight: 650;
      padding: 0 8px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      line-height: 1.1;
      text-align: center;
      color: var(--lab, var(--ink));
      background: color-mix(in srgb, var(--crayon, var(--ink)) 12%, var(--bg));
      opacity: 0.38;
      touch-action: manipulation;
      -webkit-tap-highlight-color: var(--tap);
    }
    .track-btn .fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 100%;
      transform: scaleY(var(--e, 0));
      transform-origin: 50% 100%;
      background: var(--crayon);
      pointer-events: none;
    }
    .track-btn .hz {
      position: relative;
      z-index: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .track-btn.hot {
      opacity: 1;
      border-color: color-mix(in srgb, var(--crayon) 55%, var(--hairline));
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .track-btn.dim {
      opacity: 0.28;
      min-width: 44px;
      background: color-mix(in srgb, var(--ink) 8%, var(--bg));
      border-color: var(--hairline);
      cursor: default;
    }
    .track-btn[aria-pressed="true"] {
      outline: 1px solid var(--ink);
      outline-offset: 1px;
    }
    .track-btn:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    .tune-line {
      font-weight: 650;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      color: #7a8a94;
      margin: 0 0 8px;
    }
    .tune-line .muted { color: var(--muted); font-weight: 600; }
    .chroma {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2px;
      height: 56px;
      margin: 8px 0 8px;
      padding: 4px;
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 4px;
    }
    .chroma .bar {
      position: relative;
      background: color-mix(in srgb, var(--ink) 6%, var(--paper));
      border-radius: 2px 2px 1px 1px;
      overflow: hidden;
      border: 1px solid var(--hairline);
    }
    .chroma .fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 100%;
      transform: scaleY(0);
      transform-origin: 50% 100%;
      background: var(--crayon);
      transition: transform var(--dt) var(--ease);
    }
    .chroma .bar.on .fill {
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .chroma .lab {
      position: absolute;
      left: 0; right: 0; bottom: 3px;
      text-align: center;
      font-size: 0.58rem;
      font-weight: 650;
      color: var(--ink);
      z-index: 1;
      pointer-events: none;
      opacity: 0.72;
    }
    .chroma .bar.on .lab { opacity: 1; color: var(--lab, var(--ink)); }
    .chips {
      min-height: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 4px;
      font-weight: 650;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      border: 1px solid color-mix(in srgb, var(--ink) 16%, var(--crayon));
      background: var(--crayon);
      color: var(--lab, var(--ink));
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .hz-live {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .type-well {
      margin: 0 0 12px;
    }
    .type-head {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      grid-template-areas:
        "clear out meta"
        "picker picker picker";
      gap: 8px;
      align-items: stretch;
      margin-bottom: 8px;
    }
    @media (min-width: 760px) {
      .type-head {
        grid-template-columns: 44px minmax(0, 1fr) auto auto;
        grid-template-areas: "clear out meta picker";
      }
    }
    .type-clear { grid-area: clear; }
    .type-out { grid-area: out; }
    .kb-meta { grid-area: meta; }
    .kb-picker { grid-area: picker; }
    .type-clear {
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }
    .type-out {
      margin: 0;
      min-height: 44px;
      max-height: 88px;
      overflow: auto;
      padding: 8px 10px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font: 650 0.92rem/1.35 ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .type-out:empty::before {
      content: attr(data-hint);
      color: var(--muted);
      font-weight: 600;
    }
    .kb-picker {
      display: inline-flex;
      align-items: stretch;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      overflow: hidden;
      background: var(--paper);
      min-height: 44px;
    }
    .kb-picker button {
      border: 0;
      margin: 0;
      padding: 8px 12px;
      background: transparent;
      color: var(--muted);
      font: 650 0.78rem/1.2 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }
    .kb-picker button + button {

        if (!t.label) {
          const h = heuristicName(t);
          if (h) {
            t.label = h;
            t.labelSource = "heuristic";
          }
        }
      });
      syncTrackUi();
    }
    if (fmAvailable === false || !canUseLocalLabeler()) {
      applyHeuristic();
      return;
    }
    labelBusy = true;
    const payload = liveTracks.map(function (t) {
      return {
        id: t.id,
        f0: Math.round(t.f0 * 10) / 10,
        bandwidth: 0,
        harmonicity: Math.round(t.harm * 100) / 100,
        duration: (now - t.born) / 1000,
        mag: t.db
      };
    });
    try {
      const r = await fetch(LABEL_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tracks: payload }),
        signal: abortAfter(2500)
      });
      if (!r.ok) throw new Error("label http");
      const j = await r.json();
      fmAvailable = Boolean(j.fm);
      (j.labels || []).forEach(function (row) {
        const t = liveTracks.find(function (x) { return x.id === row.id; });
        if (!t || !row.name) return;
        if (row.source === "fm") {
          t.label = String(row.name).slice(0, 16);
          t.labelSource = "fm";
        } else if (!t.label) {
          t.label = String(row.name).slice(0, 16);
          t.labelSource = "heuristic";
        }
      });
      if (!fmAvailable) applyHeuristic();
      else syncTrackUi();
    } catch (_) {
      fmAvailable = false;
      applyHeuristic();
    } finally {
      labelBusy = false;
    }
  }

  function scanTunePeaks(specArr, binHz) {
    const i0 = Math.max(2, Math.floor(TUNE_LO_HZ / binHz));
    const i1 = Math.min(specArr.length - 2, Math.ceil(TUNE_HI_HZ / binHz));
    const floor = bandNoiseFloor(specArr, i0, i1);
    const minDb = Math.max(-72, floor + 8);
    const peaks = [];
    for (let i = i0; i <= i1; i++) {
      const db = specArr[i];
      if (db < minDb) continue;
      if (db > specArr[i - 1] && db >= specArr[i + 1] && db > specArr[i - 2] && db >= specArr[i + 2]) {
        const denom = specArr[i - 1] - 2 * specArr[i] + specArr[i + 1];
        const delta = denom ? 0.5 * (specArr[i - 1] - specArr[i + 1]) / denom : 0;
        const freq = (i + delta) * binHz;
        if (freq >= TUNE_LO_HZ && freq <= TUNE_HI_HZ) peaks.push({ freq: freq, db: db });
      }
    }
    peaks.sort(function (a, b) { return b.db - a.db; });
    return peaks.slice(0, 16);
  }

  function groupHarmonics(peaks) {
    const byFreq = peaks.slice().sort(function (a, b) { return a.freq - b.freq; });
    const funds = [];
    byFreq.forEach(function (p) {
      let harmonic = false;
      for (let k = 0; k < funds.length; k++) {
        const f0 = funds[k].freq;
        const n = Math.round(p.freq / f0);
        if (n < 2 || n > 8) continue;
        const cents = 1200 * Math.log2(p.freq / (n * f0));
        if (Math.abs(cents) < 35) {
          harmonic = true;
          break;
        }
      }
      if (!harmonic) funds.push(p);
    });
    return funds;
  }

  function syncTuneUi() {
    const cents = 1200 * Math.log2(aEst / A4_REF);
    if (!$autotune.checked) {
      $tuneLine.textContent = "440";
      return;
    }
    if (mode === "idle") {
      $tuneLine.textContent = "440";
      return;
    }
    if (!tuneReady) {
      $tuneLine.textContent = "440";
      return;
    }
    $tuneLine.textContent = String(Math.round(aEst));
  }

  function resetTune() {
    aEst = A4_REF;
    tuneReady = false;
    centsWindow.length = 0;
    syncTuneUi();
  }

  function updateConcertPitch(specArr, binHz) {
    const peaks = scanTunePeaks(specArr, binHz);
    const funds = groupHarmonics(peaks);
    const votes = [];
    funds.forEach(function (p) {
      const midi = Math.round(hzToMidiRef(p.freq, A4_REF));
      const expected = midiToHzRef(midi, A4_REF);
      if (expected <= 0) return;
      const cents = 1200 * Math.log2(p.freq / expected);
      // Nearest 440-Hz MIDI note only unambiguously measures ±50 cents.
      // Wider ranges wrap (e.g. +60 → −40) and pull A the wrong way.
      if (!isFinite(cents) || Math.abs(cents) >= 50) return;
      votes.push(cents);
    });
    if (votes.length >= 1 && audioCtx) {
      const now = audioCtx.currentTime;
      centsWindow.push({ t: now, cents: medianNums(votes) });
      const cut = now - TUNE_WINDOW_S;
      while (centsWindow.length && centsWindow[0].t < cut) centsWindow.shift();
    }
    if (centsWindow.length >= 8) {
      const med = medianNums(centsWindow.map(function (v) { return v.cents; }));
      const clamped = Math.max(-50, Math.min(50, med));
      const target = A4_REF * Math.pow(2, clamped / 1200);
      const alpha = centsWindow.length >= 24 ? 0.12 : 0.05;
      aEst = aEst + alpha * (target - aEst);
      aEst = Math.max(A4_MIN, Math.min(A4_MAX, aEst));
      tuneReady = true;
    }
    syncTuneUi();
  }

  function buildTracks() {
    syncTrackUi();
  }

  function displayTracks() {
    return liveTracks;
  }

  function laneHeight() {
    const n = Math.max(1, displayTracks().length);
    return Math.max(28, Math.min(48, Math.floor(220 / n)));
  }

  function pushTrackHist(now) {
    const cols = Math.max(64, waveCssW || 320);
    const secPerCol = WAVE_WINDOW_SEC / cols;
    const t = now || performance.now();
    if (!histClock) histClock = t;
    liveTracks.forEach(function (tr) {
      if (!tr.hist || tr.hist.length !== cols) {
        const next = new Float32Array(cols);
        if (tr.hist && tr.hist.length) {
          const n = Math.min(tr.hist.length, cols);
          next.set(tr.hist.subarray(tr.hist.length - n), cols - n);
        }
        tr.hist = next;
      }
    });
    const elapsed = (t - histClock) / 1000;
    let shifts = Math.floor(elapsed / secPerCol);
    if (shifts < 1) {
      liveTracks.forEach(function (tr) {
        if (tr.hist && tr.hist.length) tr.hist[tr.hist.length - 1] = tr.energy;
      });
      return;
    }
    if (shifts > cols) shifts = cols;
    histClock += shifts * secPerCol * 1000;
    liveTracks.forEach(function (tr) {
      const hist = tr.hist;
      if (!hist) return;
      if (shifts >= cols) hist.fill(tr.energy);
      else {
        hist.copyWithin(0, shifts);
        for (let i = cols - shifts; i < cols; i++) hist[i] = tr.energy;
      }
    });
  }

  function syncArrangeHeads() {
    if (!$arrangeHeads) return;
    const rows = displayTracks();
    const ids = rows.map(function (t) { return String(t.id); }).join(",");
    if ($arrangeHeads.dataset.ids !== ids) {
      $arrangeHeads.dataset.ids = ids;
      $arrangeHeads.innerHTML = "";
      if (!rows.length) {
        const head = document.createElement("div");
        head.className = "arrange-head";
        head.innerHTML = '<span class="arrange-swatch"></span>';
        $arrangeHeads.appendChild(head);
      } else {
        rows.forEach(function (t) {
          const head = document.createElement("button");
          head.type = "button";
          head.className = "arrange-head";
          head.dataset.track = String(t.id);
          const sw = document.createElement("span");
          sw.className = "arrange-swatch";
          head.appendChild(sw);
          const nm = document.createElement("span");
          nm.className = "nm";
          head.appendChild(nm);
          head.addEventListener("click", function () { onTrackClick(t.id); });
          $arrangeHeads.appendChild(head);
        });
      }
    }
    const h = laneHeight();
    const n = Math.max(1, rows.length);
    if ($arrangeLane) $arrangeLane.style.height = (n * h) + "px";
    rows.forEach(function (t) {
      const head = $arrangeHeads.querySelector('[data-track="' + t.id + '"]');
      if (!head) return;
      paintEl(head, CRAYONS[t.pc] || CRAYONS.A);
      head.setAttribute("aria-pressed", String(trackIsOn(t.id)));
      head.classList.toggle("dim", !trackIsOn(t.id));
      const nm = head.querySelector(".nm");
      if (nm) nm.textContent = trackCaption(t);
    });
  }

  function keyLabel(key) {
    if (key.kind === "space") return "";
    if (key.kind !== "char") return key.base;
    return key.base;
  }

  function buildOneBoard(layout) {
    const wrap = document.createElement("div");
    wrap.className = "kb-wrap";
    const title = document.createElement("div");
    title.className = "kb-title";
    title.textContent = layout.id === "us" ? "US" : "Canadien français · CSA";
    wrap.appendChild(title);
    const board = document.createElement("div");
    board.className = "kb-board";
    board.dataset.board = layout.id;
    board.setAttribute("role", "group");
    board.setAttribute("aria-label", layout.nameFr || layout.name);
    layout.keys.forEach(function (key) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "kb-key" + (key.kind !== "char" && key.kind !== "space" ? " mod" : "");
      el.dataset.board = layout.id;
      el.dataset.kid = key.kid;
      el.style.left = (key.col / 15 * 100) + "%";
      el.style.width = (key.w / 15 * 100) + "%";
      el.style.top = (key.row / 5 * 100) + "%";
      el.style.height = (key.h / 5 * 100) + "%";
      el.style.zIndex = key.h > 1 ? "0" : "1";
      const main = document.createElement("span");
      main.textContent = keyLabel(key) || (key.kind === "space" ? "" : key.base);
      el.appendChild(main);
      const midi = DUAL.midiForKid(key.kid);
      if (midi != null) {
        el.classList.add("mapped");
        el.dataset.midi = String(midi);
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = DUAL.noteLabelFr(midi);
        el.appendChild(note);
        paintEl(el, crayonOf(midi));
        el.setAttribute("aria-label", (key.base || key.kind) + " " + DUAL.noteLabelFr(midi) + " " + layout.id);
      } else {
        if (key.kind === "char" && key.shift && key.shift !== key.base.toUpperCase()) {
          const sub = document.createElement("span");
          sub.className = "sub";
          sub.textContent = key.shift;
          el.appendChild(sub);
        }
        el.setAttribute("aria-label", (key.base || key.kind) + " " + layout.id);
      }
      el.addEventListener("pointerdown", onKbPointerDown);
      board.appendChild(el);
      keyEls.set(layout.id + ":" + key.kid, el);
    });
    wrap.appendChild(board);
    return wrap;
  }

  function readStoredLayout() {
    try {
      const saved = localStorage.getItem("crayon-kb-layout");
      if (saved === "csa" || saved === "us") return saved;
    } catch (e) { /* private mode */ }
    return "us";
  }

  function selectedLayout() {
    return DUAL.LAYOUTS[activeBoard] || DUAL.US;
  }

  function layoutHint(id) {
    return id === "csa"
      ? "Canadien français · Z=Do3 · D=Do4 · Q=La4"
      : "US · Z=Do3 · D=Do4 · Q=La4";
  }

  function syncLayoutPicker() {
    if ($kbLayout) {
      Array.prototype.forEach.call($kbLayout.querySelectorAll("[data-layout]"), function (btn) {
        btn.setAttribute("aria-pressed", String(btn.dataset.layout === activeBoard));
      });
    }
    if ($typeOut) $typeOut.setAttribute("data-hint", layoutHint(activeBoard));
    if ($dualBoards) $dualBoards.dataset.layout = activeBoard;
    document.documentElement.dataset.kbLayout = activeBoard;
  }

  function rebuildBoard() {
    if (!$dualBoards) return;
    $dualBoards.innerHTML = "";
    keyEls.clear();
    $dualBoards.appendChild(buildOneBoard(selectedLayout()));
  }

  function setLayout(id) {
    const next = id === "csa" ? "csa" : "us";
    if (next !== activeBoard) {
      releaseTypedHolds();
      activeBoard = next;
      try { localStorage.setItem(LAYOUT_STORE, next); } catch (e) { /* private mode */ }
      rebuildBoard();
      syncPianoBinds();
    }
    syncLayoutPicker();
    renderKbMeta();
  }

  function wireKeyboard() {
    if (kbWired) return;
    kbWired = true;
    window.addEventListener("pointerup", onKbPointerUp);
    window.addEventListener("pointercancel", onKbPointerUp);
    window.addEventListener("keydown", onHwKeyDown, true);
    window.addEventListener("keyup", onHwKeyUp, true);
    window.addEventListener("blur", releaseStuckHolds);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) releaseStuckHolds();
    });
    if ($kbLayout) {
      $kbLayout.addEventListener("click", function (ev) {
        const btn = ev.target.closest("[data-layout]");
        if (!btn) return;
        setLayout(btn.dataset.layout);
      });
    }
    if ($typeClear) {
      $typeClear.addEventListener("click", function () {
        typeState.text = "";
        typeState.dead = "";
        renderTypeOut();
      });
    }
  }

  function initKeyboard() {
    rebuildBoard();
    wireKeyboard();
    syncLayoutPicker();
    syncPianoBinds();
    window.__CRAYON_SET_LAYOUT = setLayout;
    window.__CRAYON_LAYOUT = function () { return activeBoard; };
    window.__CRAYON_TYPED = function () { return typeState.text; };
    window.__CRAYON_MIDI_FOR_KID = DUAL.midiForKid;
    window.__CRAYON_KID_FOR_MIDI = DUAL.kidForMidi;
    window.__CRAYON_NOTE_LABEL = DUAL.noteLabelFr;
  }

  function renderTypeOut() {
    if ($typeOut) $typeOut.textContent = typeState.text;
  }

  function crayonForCluster(index) {
    return CRAYONS[NOTE_NAMES[((index % 12) + 12) % 12]];
  }

  function syncSpatialTracks() {
    const groups = fingerGate.clusters();
    const now = performance.now();
    const next = [];
    groups.forEach(function (members, i) {
      const pts = members.map(function (h) {
        return DUAL.center(DUAL.LAYOUTS[h.board], DUAL.keyById(DUAL.LAYOUTS[h.board], h.kid));
      });
      const cx = pts.reduce(function (s, p) { return s + p[0]; }, 0) / pts.length;
      const glyphs = members.map(function (h) {
        const key = DUAL.keyById(DUAL.LAYOUTS[h.board], h.kid);
        return key ? (key.base || key.kind) : "";
      }).join("");
      const midis = members.map(function (h) { return DUAL.midiForKid(h.kid); }).filter(function (m) {
        return m != null;
      });
      const midi0 = midis.length ? Math.min.apply(null, midis) : null;
      const f0 = midi0 != null ? midiToHz(midi0) : 110 * Math.pow(2, (cx % 12) / 12);
      const pc = midi0 != null ? pcOf(midi0) : NOTE_NAMES[i % 12];
      const label = (midi0 != null ? DUAL.noteLabelFr(midi0) + " · " : "") + glyphs;
      let found = liveTracks.find(function (t) {
        return t.spatial && Math.abs(t.cx - cx) < 1.4;
      });
      if (!found) {
        found = {
          id: nextTrackId++,
          f0: f0,
          db: -12,
          harm: 0.4,
          energy: 1,
          lastSeen: now,
          born: now,
          pc: pc,
          label: label,
          labelSource: "keys",
          hist: null,
          spatial: true,
          cx: cx
        };
      } else {
        found.cx = found.cx * 0.5 + cx * 0.5;
        found.f0 = f0;
        found.energy = 1;
        found.lastSeen = now;
        found.label = label;
        found.pc = pc;
      }
      next.push(found);
    });
    if (mode === "idle") {
      liveTracks = next;
      selectedTrackIds.forEach(function (id) {
        if (!liveTracks.some(function (t) { return t.id === id; })) selectedTrackIds.delete(id);
      });
      syncTrackUi();
    }
    paintDualKeys();
  }

  function paintDualKeys() {
    const groups = fingerGate.clusters();
    const heldAt = new Map();
    groups.forEach(function (members, i) {
      members.forEach(function (h) {
        heldAt.set(h.board + ":" + h.kid, i);
      });
    });
    keyEls.forEach(function (el, id) {
      const kid = el.dataset.kid;
      const midi = kid ? DUAL.midiForKid(kid) : null;
      const on = heldAt.has(id) || (midi != null && midiHolders.has(midi) && midiHolders.get(midi).size > 0);
      el.classList.toggle("on", on);
      if (midi != null) {
        paintEl(el, crayonOf(midi));
        const track = liveTracks[heldAt.get(id)];
        el.classList.toggle("off", track ? !trackIsOn(track.id) : false);
      } else if (on) {
        const crayon = crayonForCluster(heldAt.get(id) || 0);
        paintEl(el, crayon);
      } else {
        el.style.removeProperty("--crayon");
      }
    });
    paintHighlights();
  }

  function renderKbMeta() {
    if (!$kbMeta) return;
    const n = fingerGate.held().length;
    const g = fingerGate.clusters().length;
    const nt = n <= 1 ? n + " touche" : n + " touches";
    const ng = g <= 1 ? g + " groupe" : g + " groupes";
    $kbMeta.textContent = nt + " · " + ng;
  }

  function applyTyped(board, kid) {
    const layout = DUAL.LAYOUTS[board];
    const key = DUAL.keyById(layout, kid);
    if (!key) return;
    typeState.apply(key);
    renderTypeOut();
  }

  function releaseTyped(board, kid) {
    const layout = DUAL.LAYOUTS[board];
    const key = DUAL.keyById(layout, kid);
    if (!key) return;
    typeState.release(key);
  }

  function midiHolderId(key) {
    return "k-" + key.board + ":" + key.kid;
  }

  function holdMidi(holder, midi) {
    if (midi == null) return;
    let set = midiHolders.get(midi);
    if (!set) {
      set = new Set();
      midiHolders.set(midi, set);
    }
    const first = set.size === 0;
    set.add(holder);
    if (first) startHeldKey(midi);
    paintHeldPiano();
    paintDualKeys();
  }

  function releaseMidi(holder, midi) {
    if (midi == null) return;
    const set = midiHolders.get(midi);
    if (!set) return;
    set.delete(holder);
    if (set.size === 0) {
      midiHolders.delete(midi);
      stopHeldKey(midi);
    }
    paintHeldPiano();
    paintDualKeys();
  }

  function keyStillHeld(key) {
    return fingerGate.held().some(function (h) { return DUAL.sameHeld(h, key); });
  }

  function paintHeldPiano() {
    const held = new Set(midiHolders.keys());
    const analysing = !!(analyser && spec && audioCtx && (mode !== "idle" || heldVoices.size > 0));
    keys.forEach(function (el, midi) {
      if (held.has(midi)) {
        el.classList.add("on");
        el.classList.remove("harm");
        paintEl(el, crayonOf(midi));
        const lab = el.querySelector(".name");
        if (lab) lab.textContent = crayonOf(midi).fr + octaveOf(midi);
      } else if (mode === "idle" && !analysing) {
        el.classList.remove("on", "harm");
        restoreIdleLabel(el);
      }
    });
    if (mode === "idle" && !analysing) {
      const chips = Array.from(held).sort(function (a, b) { return a - b; });
      const chipKey = chips.join(",");
      if (chipKey !== lastChipKey) {
        lastChipKey = chipKey;
        $chips.innerHTML = "";
        chips.forEach(function (midi) {
          const info = crayonOf(midi);
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.dataset.pc = pcOf(midi);
          paintEl(chip, info);
          chip.textContent = info.fr + octaveOf(midi);
          $chips.appendChild(chip);
        });
        $chips.appendChild($hzLive);
      }
      if (chips.length) $hzLive.textContent = String(Math.round(midiToHz(chips[0])));
      else $hzLive.textContent = "";
    }
  }

  function syncPianoBinds() {
    const layout = selectedLayout();
    keys.forEach(function (el, midi) {
      const bind = el.querySelector(".bind");
      if (!bind) return;
      const kid = DUAL.kidForMidi(midi);
      if (!kid || (kid === "IntlBackslash" && layout.id !== "csa")) {
        bind.textContent = "";
        el.classList.remove("bound");
        return;
      }
      const key = DUAL.keyById(layout, kid);
      bind.textContent = key && key.kind === "char" ? key.base : "";
      el.classList.toggle("bound", !!bind.textContent);
    });
  }

  function onKbPointerDown(ev) {
    ev.preventDefault();
    const el = ev.currentTarget;
    try { el.setPointerCapture(ev.pointerId); } catch (e) { /* extra synthetic pointers */ }
    activeBoard = el.dataset.board;
    const key = { board: el.dataset.board, kid: el.dataset.kid };
    const already = keyStillHeld(key);
    const ok = fingerGate.down(ev.pointerId, key);
    el.classList.toggle("blocked", !ok);
    if (!ok) return;
    if (!already) applyTyped(key.board, key.kid);
    holdMidi(midiHolderId(key), DUAL.midiForKid(key.kid));
    syncSpatialTracks();
    renderKbMeta();
    startLoop();
  }

  function onKbPointerUp(ev) {
    const prev = fingerGate.at(ev.pointerId);
    if (prev) releaseTyped(prev.board, prev.kid);
    fingerGate.up(ev.pointerId);
    if (prev && !keyStillHeld(prev)) {
      releaseMidi(midiHolderId(prev), DUAL.midiForKid(prev.kid));
    }
    syncSpatialTracks();
    renderKbMeta();
  }

  function onHwKeyDown(ev) {
    if (ev.repeat) return;
    if (ev.metaKey) return;
    const isCtrlKey = ev.code === "ControlLeft" || ev.code === "ControlRight";
    if (ev.ctrlKey && !ev.altKey && !isCtrlKey) return;
    const layout = DUAL.LAYOUTS[activeBoard] || DUAL.US;
    const key = DUAL.keyByCode(layout, ev.code);
    if (!key) return;
    ev.preventDefault();
    const held = { board: layout.id, kid: key.kid };
    const already = keyStillHeld(held);
    if (!fingerGate.down("hw-" + ev.code, held)) return;
    if (!already) applyTyped(layout.id, key.kid);
    holdMidi(midiHolderId(held), DUAL.midiForKid(key.kid));
    syncSpatialTracks();
    renderKbMeta();
    startLoop();
  }

  function onHwKeyUp(ev) {
    const layout = DUAL.LAYOUTS[activeBoard] || DUAL.US;
    const key = DUAL.keyByCode(layout, ev.code);
    const held = key ? { board: layout.id, kid: key.kid } : null;
    if (key) releaseTyped(layout.id, key.kid);
    fingerGate.up("hw-" + ev.code);
    if (held && !keyStillHeld(held)) {
      releaseMidi(midiHolderId(held), DUAL.midiForKid(held.kid));
    }
    syncSpatialTracks();
    renderKbMeta();
  }

  function releaseComputerMidi() {
    const drop = [];
    midiHolders.forEach(function (set, midi) {
      Array.from(set).forEach(function (id) {
        if (id.indexOf("k-") === 0) {
          set.delete(id);
          drop.push(midi);
        }
      });
      if (set.size === 0) midiHolders.delete(midi);
    });
    drop.forEach(function (midi) {
      if (!midiHolders.has(midi)) stopHeldKey(midi);
    });
    paintHeldPiano();
    paintDualKeys();
  }

  function releaseTypedHolds() {
    fingerGate.held().forEach(function (prev) {
      releaseTyped(prev.board, prev.kid);
    });
    fingerGate.clear();
    releaseComputerMidi();
    syncSpatialTracks();
    renderKbMeta();
  }

  function releaseStuckHolds() {
    releaseTypedHolds();
    midiHolders.clear();
    Array.from(heldVoices.keys()).forEach(stopHeldKey);
    keys.forEach(function (el) {
      if (mode === "idle") {
        el.classList.remove("on", "harm");
        restoreIdleLabel(el);
      }
    });
    paintDualKeys();
    syncSpatialTracks();
    renderKbMeta();
  }

  function buildLegend() {
    NOTE_NAMES.forEach(function (name) {
      const c = CRAYONS[name];
      const el = document.createElement("div");
      el.className = "pencil";
      el.dataset.pc = name;
      el.dataset.rgb = c.rgb.join(",");
      el.title = c.fr + " · " + c.pencil;
      paintEl(el, c);
      el.innerHTML = '<div class="fr">' + c.fr + "</div>";
      $pencils.appendChild(el);

      const bar = document.createElement("div");
      bar.className = "bar";
      bar.dataset.pc = name;
      bar.dataset.i = String(NOTE_NAMES.indexOf(name));
      paintEl(bar, c);
      bar.innerHTML = '<div class="fill"></div><div class="lab">' + c.fr + "</div>";
      $chroma.appendChild(bar);
    });
    chromaBars = Array.prototype.slice.call($chroma.children);
  }

  function buildKeyboard() {
    let whiteCount = 0;
    for (let m = MIDI_LO; m <= MIDI_HI; m++) {
      if (!BLACK[m % 12]) whiteCount++;
    }
    let wi = 0;
    for (let m = MIDI_LO; m <= MIDI_HI; m++) {
      const pc = m % 12;
      const info = crayonOf(m);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "key " + (BLACK[pc] ? "black" : "white");
      el.dataset.midi = String(m);
      el.setAttribute("aria-label", info.fr + octaveOf(m) + " / " + pcOf(m) + octaveOf(m));
      const lab = document.createElement("span");
      lab.className = "name";
      if (BLACK[pc]) {
        lab.textContent = "♯";
        el.dataset.after = String(wi - 1);
      } else {
        lab.textContent = pc === 0 ? info.fr + octaveOf(m) : info.fr;
        el.dataset.whiteIndex = String(wi);
        wi += 1;
      }
      el.appendChild(lab);
      el.dataset.idleName = lab.textContent;
      const bind = document.createElement("span");
      bind.className = "bind";
      el.appendChild(bind);
      function releasePianoPointer(ev) {
        releaseMidi("p-" + ev.pointerId, m);
      }
      el.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        try { el.setPointerCapture(ev.pointerId); } catch (e) { /* extra synthetic pointers */ }
        holdMidi("p-" + ev.pointerId, m);
        startLoop();
      });
      el.addEventListener("pointerup", releasePianoPointer);
      el.addEventListener("pointercancel", releasePianoPointer);
      $board.appendChild(el);
      keys.set(m, el);
    }
    layoutBlackKeys();
  }

  function layoutBlackKeys() {
    const whites = $board.querySelectorAll(".white");
    if (!whites.length) return;
    const totalWhite = whites.length;
    whites.forEach(function (el, i) {
      el.style.left = (i * 100 / totalWhite) + "%";
      el.style.width = (100 / totalWhite) + "%";
    });
    const boardW = $board.getBoundingClientRect().width;
    if (!boardW) return;
    const w = boardW / totalWhite;
    const blackW = w * 0.62;
    $board.querySelectorAll(".black").forEach(function (el) {
      const after = Number(el.dataset.after);
      if (after < 0 || after >= totalWhite) return;
      const left = (after + 1) * w - blackW / 2;
      el.style.left = left + "px";
      el.style.width = blackW + "px";
    });
  }

  let studyMidi = null;
  function previewKey(midi) {
    if (studyMidi !== null && keys.get(studyMidi)) {
      keys.get(studyMidi).classList.remove("study");
    }
    studyMidi = midi;
    const el = keys.get(midi);
    const c = crayonOf(midi);
    el.classList.add("study", "on");
    paintEl(el, c);
    const nameEl = el.querySelector(".name");
    if (nameEl) nameEl.textContent = c.fr + octaveOf(midi);
    $hzLive.textContent = String(Math.round(midiToHz(midi)));
    setTimeout(function () {
      if (mode === "idle") {
        el.classList.remove("on");
        const lab = el.querySelector(".name");
        if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
      }
    }, 700);
  }

  function showErr(msg) {
    $err.hidden = !msg;
    $err.textContent = msg || "";
  }

  function stripDefaultPrefix(label) {
    return String(label || "")
      .replace(/^(Default|Par défaut|Défaut)\s*[-–:]\s*/i, "")
      .trim();
  }

  async function listInputs() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(function (d) { return d.kind === "audioinput"; });
  }

  function pickOsDefault(inputs) {
    return inputs.find(function (d) { return d.deviceId === "default"; })
      || inputs.find(function (d) { return /default|par défaut|défaut/i.test(d.label); })
      || null;
  }

  function fillMicList(inputs) {
    const keep = micOverrideId || "os";
    $micAlt.innerHTML = "";
    const osOpt = document.createElement("option");
    osOpt.value = "os";
    const def = pickOsDefault(inputs);
    osOpt.textContent = def && def.label
      ? "OS — " + stripDefaultPrefix(def.label)
      : "OS";
    $micAlt.appendChild(osOpt);
    inputs.forEach(function (d) {
      if (d.deviceId === "default") return;
      const opt = document.createElement("option");
      opt.value = d.deviceId;
      opt.textContent = d.label || d.deviceId.slice(0, 8);
      $micAlt.appendChild(opt);
    });
    $micAlt.value = keep === "os" || !keep ? "os" : keep;
    if ($micAlt.value !== keep && keep !== "os") $micAlt.value = "os";
  }

  async function updateMicStatus() {
    const inputs = await listInputs();
    fillMicList(inputs);
  }

  const AUDIO_EXTRAS = {
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false
  };

  async function requestMicStream() {
    if (micOverrideId) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: Object.assign({}, AUDIO_EXTRAS, { deviceId: { exact: micOverrideId } })
        });
      } catch (_) {
        micOverrideId = null;
        $micAlt.value = "os";
      }
    }
    try {
      return await navigator.mediaDevices.getUserMedia({ audio: AUDIO_EXTRAS });
    } catch (_) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: Object.assign({}, AUDIO_EXTRAS, { deviceId: { ideal: "default" } })
        });
      } catch (__) {
        return await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    }
  }

  function stopTracks() {
    if (sourceNode) {
      try { sourceNode.disconnect(); } catch (_) {}
      sourceNode = null;
    }
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
  }

  function ensureAnalyser() {
    if (!audioCtx || audioCtx.state === "closed") {
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    if (!analyser) {
      analyser = audioCtx.createAnalyser();
    }
    if (analyser.fftSize !== FFT_SIZE) {
      analyser.fftSize = FFT_SIZE;
      spec = new Float32Array(analyser.frequencyBinCount);
    }
    analyser.smoothingTimeConstant = 0;
    analyser.minDecibels = -95;
    analyser.maxDecibels = 0;
    if (!spec || spec.length !== analyser.frequencyBinCount) {
      spec = new Float32Array(analyser.frequencyBinCount);
    }
    if (!sampleGain) {
      sampleGain = audioCtx.createGain();
      sampleGain.gain.value = $unmute.checked ? 0.28 : 0;
      sampleGain.connect(audioCtx.destination);
    }
  }

  function setSampleGain(on) {
    if (!sampleGain || !audioCtx) return;
    const dest = on ? 0.28 : 0;
    const g = sampleGain.gain;
    const now = audioCtx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(dest, now + 0.018);
  }

  function resetSmooth() {
    smooth.fill(-120);
  }

  function fmtTime(s) {
    const t = Math.max(0, s || 0);
    const m = Math.floor(t / 60);
    const sec = Math.floor(t - m * 60);
    return m + ":" + String(sec).padStart(2, "0");
  }

  function targetRatio() {
    if (mode === "live" || (mode === "idle" && liveTracks.some(function (t) { return t.spatial; }))) {
      return 0.92;
    }
    const dur = sampleDuration || 0;
    const t = scrubbing ? sampleOffset : sampleNow();
    return dur > 0 ? Math.max(0, Math.min(1, t / dur)) : 0;
  }

  function paintPlayhead(snap, dt) {
    const target = targetRatio();
    if (snap || scrubbing || reduceMotion) playheadShown = target;
    else {
      const follow = 1 - Math.exp(-(dt || 1 / 60) / 0.05);
      playheadShown += (target - playheadShown) * follow;
      if (Math.abs(target - playheadShown) < 0.0005) playheadShown = target;
    }
    $playhead.style.transform = "translate3d(" + (playheadShown * (waveCssW || 1)) + "px,0,0)";
  }

  function restartBuffer(force) {
    if (mode !== "replay" || !sampleBuffer) return;
    const now = performance.now();
    if (!force && now - lastRestartMs < 72) return;
    lastRestartMs = now;
    startBufferAt(sampleOffset);
  }

  function seekFromClientX(clientX, restart) {
    const rect = $arrangeLane.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
    const dur = sampleDuration || 0;
    sampleOffset = dur * x;
    updateScrubUi(true);
    if (restart === "now") restartBuffer(true);
    else if (restart === "drag") restartBuffer(false);
  }

  function drawRuler() {
    const dur = sampleDuration || 0;
    $ruler.innerHTML = "";
    if (dur <= 0) return;
    const step = dur > 60 ? 15 : 10;
    for (let s = 0; s <= dur + 0.01; s += step) {
      const el = document.createElement("span");
      el.textContent = fmtTime(s);
      el.style.left = (100 * s / dur) + "%";
      $ruler.appendChild(el);
    }
  }

  function drawWave(force, opts) {
    const snapPlayhead = !(opts && opts.playhead === false);
    const canvas = $wave;
    const lane = $arrangeLane;
    const rows = displayTracks();
    const n = Math.max(1, rows.length);
    const cssW = Math.max(1, Math.floor(lane.clientWidth || 320));
    const laneH = laneHeight();
    const cssH = n * laneH;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const scheme = document.documentElement.getAttribute("data-scheme") || "dark";
    const themeName = document.documentElement.getAttribute("data-theme") || "stealth";
    const ids = rows.map(function (t) { return t.id; }).join(",");
    const key = cssW + "x" + cssH + "x" + dpr + themeName + ":" + ids + ":" + (wavePeaks ? wavePeaks.length : 0);
    waveCssW = cssW;
    if (!force && key === waveDrawnKey) {
      if (snapPlayhead) paintPlayhead(true);
      return;
    }
    waveDrawnKey = key;
    const pxW = Math.round(cssW * dpr);
    const pxH = Math.round(cssH * dpr);
    if (canvas.width !== pxW) canvas.width = pxW;
    if (canvas.height !== pxH) canvas.height = pxH;
    canvas.style.height = cssH + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bed = getComputedStyle(document.documentElement).getPropertyValue("--wave-bed").trim() || (scheme === "dark" ? "#16161a" : "#ebe4d8");
    ctx.fillStyle = bed;
    ctx.fillRect(0, 0, cssW, cssH);
    if (!rows.length) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--wave-grid").trim() || "rgba(255,255,255,0.04)";
      ctx.fillRect(0, cssH / 2 - 0.5, cssW, 1);
      if (wavePeaks && wavePeaks.length) {
        const mid = cssH / 2;
        const amp = cssH * 0.42;
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--replay").trim() || "rgb(72, 72, 153)";
        for (let x = 0; x < cssW; x++) {
          const i = Math.min(wavePeaks.length - 1, Math.floor(x / cssW * wavePeaks.length));
          const h = Math.max(1, wavePeaks[i] * amp);
          ctx.fillRect(x, mid - h, 1, h * 2);
        }
      }
      if (snapPlayhead) paintPlayhead(true);
      return;
    }
    rows.forEach(function (t, i) {
      const y0 = i * laneH;
      const mid = y0 + laneH / 2;
      const amp = laneH * 0.42;
      const crayon = CRAYONS[t.pc] || CRAYONS.A;
      const dim = !trackIsOn(t.id);
      ctx.fillStyle = dim ? "rgba(128,128,128,0.12)" : "rgba(255,255,255,0.03)";
      ctx.fillRect(0, y0, cssW, laneH);
      ctx.fillStyle = "rgba(128,128,128,0.2)";
      ctx.fillRect(0, mid, cssW, 1);
      const hist = t.hist;
      ctx.fillStyle = "rgba(" + crayon.rgb[0] + "," + crayon.rgb[1] + "," + crayon.rgb[2] + "," + (dim ? "0.28" : "0.9") + ")";
      if (hist && hist.length) {
        for (let x = 0; x < cssW; x++) {
          const hi = Math.min(hist.length - 1, Math.floor(x / cssW * hist.length));
          const h = Math.max(1, hist[hi] * amp);
          ctx.fillRect(x, mid - h, 1, h * 2);
        }
      }
    });
    if (snapPlayhead) paintPlayhead(true);
  }

  function wavPeaks(buf, bins) {
    const v = new DataView(buf);
    if (v.byteLength < 44) return null;
    let o = 12;
    let dataOff = 44;
    let dataLen = v.byteLength - 44;
    let rate = 48000;
    while (o + 8 <= v.byteLength) {
      const id = String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
      const sz = v.getUint32(o + 4, true);
      if (id === "fmt ") rate = v.getUint32(o + 12, true) || rate;
      if (id === "data") {
        dataOff = o + 8;
        dataLen = sz;
        break;
      }
      o += 8 + sz + (sz % 2);
    }
    const samples = Math.floor(dataLen / 2);
    if (samples < 8) return null;
    if (!sampleDuration) sampleDuration = samples / rate;
    const peaks = new Float32Array(bins);
    const step = samples / bins;
    for (let i = 0; i < bins; i++) {
      const a = dataOff + Math.floor(i * step) * 2;
      const b = dataOff + Math.floor((i + 1) * step) * 2;
      let m = 0;
      for (let p = a; p < b; p += 2) {
        if (p + 1 >= dataOff + dataLen) break;
        const s = Math.abs(v.getInt16(p, true)) / 32768;
        if (s > m) m = s;
      }
      peaks[i] = m;
    }
    return peaks;
  }

  function updateScrubUi(snap) {
    paintPlayhead(!!snap);
    const t = scrubbing ? sampleOffset : sampleNow();
    const dur = sampleDuration || 0;
    const text = fmtTime(t);
    if (text !== lastClockText) {
      lastClockText = text;
      $clock.textContent = text;
    }
    const sec = Math.round(t);
    if (snap || sec !== lastAriaSec) {
      lastAriaSec = sec;
      $arrange.setAttribute("aria-valuemax", String(Math.round(dur)));
      $arrange.setAttribute("aria-valuenow", String(sec));
      $arrange.setAttribute("aria-valuetext", text);
    }
  }

  function sizeSpecCanvas() {
    if (!$spec) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = $spec.getBoundingClientRect();
    const w = Math.max(240, Math.floor(rect.width * dpr));
    const h = Math.max(160, Math.floor(rect.height * dpr));
    const key = w + "x" + h;
    if (specSizeKey === key) return;
    specSizeKey = key;
    $spec.width = w;
    $spec.height = h;
  }

  function specXOf(f, padL, plotW) {
    const t = (Math.log2(Math.max(f, SPEC_F_LO)) - Math.log2(SPEC_F_LO)) / (Math.log2(SPEC_F_HI) - Math.log2(SPEC_F_LO));
    return padL + Math.max(0, Math.min(1, t)) * plotW;
  }

  function specYOfDb(db, padT, plotH) {
    const t = (db - SPEC_DB_LO) / (SPEC_DB_HI - SPEC_DB_LO);
    return padT + plotH - Math.max(0, Math.min(1, t)) * plotH;
  }

  function drawSpecPlot(clusters) {
    if (!$spec) return;
    sizeSpecCanvas();
    const ctx = $spec.getContext("2d");
    const width = $spec.width;
    const height = $spec.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--wave-bed").trim() || "#16161a";
    ctx.fillRect(0, 0, width, height);
    const padL = 36 * dpr;
    const padR = 10 * dpr;
    const padT = 20 * dpr;
    const padB = 26 * dpr;
    const plotW = Math.max(8, width - padL - padR);
    const plotH = Math.max(8, height - padT - padB);
    ctx.strokeStyle = "rgba(148,163,184,0.16)";
    ctx.lineWidth = Math.max(1, dpr * 0.5);
    ctx.font = 9 * dpr + "px ui-monospace, Menlo, monospace";
    ctx.fillStyle = "#94a3b8";
    ctx.textBaseline = "middle";
    [-90, -60, -30, 0].forEach(function (db) {
      const y = specYOfDb(db, padT, plotH);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
      ctx.textAlign = "right";
      ctx.fillText(String(db), padL - 4 * dpr, y);
    });
    ctx.textAlign = "center";
    ctx.fillText("dBFS", 16 * dpr, padT - 8 * dpr);
    [
      [27.5, "27.5"], [55, "55"], [110, "110"], [220, "220"],
      [440, "440"], [880, "880"], [1760, "1.76k"], [3520, "3.5k"]
    ].forEach(function (row) {
      const x = specXOf(row[0], padL, plotW);
      const mark = row[0] === 440;
      ctx.beginPath();
      ctx.strokeStyle = mark ? "rgba(248,250,252,0.4)" : "rgba(148,163,184,0.12)";
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
      ctx.fillStyle = mark ? "#e2e8f0" : "#94a3b8";
      ctx.textBaseline = "top";
      ctx.fillText(row[1], x, padT + plotH + 4 * dpr);
    });
    ctx.fillStyle = "#94a3b8";
    ctx.textAlign = "right";
    ctx.fillText("Hz", width - 6 * dpr, padT + plotH + 4 * dpr);

    if (spec && analyser && audioCtx) {
      const binHz = audioCtx.sampleRate / analyser.fftSize;
      const i0 = Math.max(1, Math.floor(SPEC_F_LO / binHz));
      const i1 = Math.min(spec.length - 1, Math.ceil(SPEC_F_HI / binHz));
      if (i1 > i0) {
        ctx.beginPath();
        ctx.moveTo(specXOf(i0 * binHz, padL, plotW), padT + plotH);
        for (let i = i0; i <= i1; i++) {
          ctx.lineTo(specXOf(i * binHz, padL, plotW), specYOfDb(spec[i], padT, plotH));
        }
        ctx.lineTo(specXOf(i1 * binHz, padL, plotW), padT + plotH);
        ctx.closePath();
        ctx.fillStyle = "rgba(45, 212, 191, 0.28)";
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(specXOf(i0 * binHz, padL, plotW), specYOfDb(spec[i0], padT, plotH));
        for (let i = i0; i <= i1; i++) {
          ctx.lineTo(specXOf(i * binHz, padL, plotW), specYOfDb(spec[i], padT, plotH));
        }
        ctx.strokeStyle = "rgba(45, 212, 191, 0.85)";
        ctx.lineWidth = Math.max(1.1, dpr);
        ctx.stroke();
      }
    }

    const marks = clusters || [];
    marks.forEach(function (c) {
      const f = c.f0 || c.f || c.freq;
      if (!f) return;
      const db = typeof c.db === "number" ? c.db : -24;
      const x = specXOf(f, padL, plotW);
      const y = specYOfDb(db, padT, plotH);
      const info = crayonOf(Math.round(69 + 12 * Math.log2(f / 440)));
      ctx.fillStyle = rgbCss(info.rgb);
      ctx.beginPath();
      ctx.arc(x, y, 4.5 * dpr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(248,250,252,0.7)";
      ctx.lineWidth = Math.max(1, dpr * 0.6);
      ctx.stroke();
    });
    heldVoices.forEach(function (_v, midi) {
      const f = midiToHz(midi);
      const x = specXOf(f, padL, plotW);
      const y = specYOfDb(-18, padT, plotH);
      ctx.strokeStyle = rgbCss(crayonOf(midi).rgb);
      ctx.beginPath();
      ctx.moveTo(x, padT + plotH);
      ctx.lineTo(x, y);
      ctx.lineWidth = Math.max(1, dpr);
      ctx.stroke();
    });
    if (marks.length) {
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "600 " + 11 * dpr + "px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const f0 = marks[0].f0 || marks[0].f;
      ctx.fillText(Math.round(f0) + " Hz · " + marks.length, padL + 6 * dpr, 6 * dpr);
    }
  }

  function ensureKeyBus() {
    ensureAnalyser();
    if (!audioCtx) return null;
    if (!window._keyMix) {
      const mix = audioCtx.createGain();
      mix.gain.value = 0.2;
      mix.connect(analyser);
      const hear = audioCtx.createGain();
      hear.gain.value = $unmute.checked ? 0.18 : 0;
      mix.connect(hear);
      hear.connect(audioCtx.destination);
      window._keyMix = mix;
      window._keyHear = hear;
    }
    if (window._keyHear) window._keyHear.gain.value = $unmute.checked ? 0.18 : 0;
    return window._keyMix;
  }

  function startHeldKey(midi) {
    if (heldVoices.has(midi)) return;
    const mix = ensureKeyBus();
    if (!mix) return;
    if (heldVoices.size >= 96) {
      const oldest = heldVoices.keys().next().value;
      stopHeldKey(oldest);
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = midiToHz(midi);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.012);
    osc.connect(gain);
    gain.connect(mix);
    osc.start();
    heldVoices.set(midi, { osc: osc, gain: gain });
    computerHeld.add(midi);
    awardIfNeeded(midi);
    paintHighlights();
    startLoop();
  }

  function stopHeldKey(midi) {

    computerHeld.delete(midi);
    paintHighlights();
    if (!v) return;
    heldVoices.delete(midi);
    const now = audioCtx ? audioCtx.currentTime : 0;
    try {
      v.gain.gain.cancelScheduledValues(now);
      v.gain.gain.setValueAtTime(v.gain.gain.value, now);
      v.gain.gain.linearRampToValueAtTime(0, now + 0.06);
      v.osc.stop(now + 0.07);

  function makeDemoBuffer() {
    ensureAnalyser();
    const sr = audioCtx.sampleRate;
    const dur = 8;
    const n = Math.floor(sr * dur);
    const buf = audioCtx.createBuffer(1, n, sr);
    const data = buf.getChannelData(0);
    const twoPi = 2 * Math.PI;
    function addTone(freq, start, length, amp) {
      const i0 = Math.floor(start * sr);
      const i1 = Math.min(n, Math.floor((start + length) * sr));
      const decay = length * 0.8;
      for (let i = i0; i < i1; i++) {
        const t = i / sr - start;
        const env = (t < 0.05 ? t / 0.05 : 1) * Math.exp(-t / decay);
        const ph = twoPi * freq * t;
        data[i] += amp * env * (Math.sin(ph) + 0.5 * Math.sin(2 * ph) + 0.25 * Math.sin(3 * ph));
      }
    }
    addTone(65.41, 0, 8, 0.35);
    addTone(196.00, 0.5, 3, 0.25);
    addTone(261.63, 3.5, 3, 0.25);
    [[0.5, [329.63, 415.30, 493.88]], [2.5, [349.23, 440.00, 523.25]],
     [4.5, [392.00, 493.88, 587.33]], [6.5, [329.63, 415.30, 493.88]]].forEach(function (row) {
      row[1].forEach(function (hz) { addTone(hz, row[0], 1.8, 0.18); });
    });
    addTone(1046.50, 1.0, 0.3, 0.08);
    addTone(1318.51, 5.0, 0.3, 0.08);
    let peak = 0.0001;
    for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(data[i]));
    const g = 0.9 / peak;
    for (let i = 0; i < n; i++) data[i] *= g;
    return buf;
  }

  function demoPeaks(buf, bins) {
    const data = buf.getChannelData(0);
    const peaks = new Float32Array(bins);
    const step = data.length / bins;
    for (let i = 0; i < bins; i++) {
      let m = 0;
      const a = Math.floor(i * step);
      const b = Math.min(data.length, Math.floor((i + 1) * step));
      for (let j = a; j < b; j++) m = Math.max(m, Math.abs(data[j]));
      peaks[i] = m;
    }
    return peaks;
  }

  function adoptBuffer(buf) {

  async function loadSample() {
    if (sampleBuffer) return sampleBuffer;

      try {
        let arr = waveBuf;

          const res = await fetch(SAMPLE_URL);
          if (!res.ok) throw new Error("missing wav");
          arr = await res.arrayBuffer();
          waveBuf = arr;
        }
        if (!wavePeaks) {
          wavePeaks = wavPeaks(arr, 900);
          drawRuler();
          drawWave();
        }
        ensureAnalyser();
        sampleBuffer = await audioCtx.decodeAudioData(arr.slice(0));
        sampleDuration = sampleBuffer.duration;
        updateScrubUi(true);
        return sampleBuffer;
      } catch (e) {
        return adoptBuffer(makeDemoBuffer());
      }
    })();
    try {
      return await sampleLoad;
    } catch (e) {
      sampleLoad = null;
      throw e;
    }
  }

  function loop(now) {
    raf = 0;
    now = now || performance.now();
    const dt = lastLoopNow ? Math.min(0.05, (now - lastLoopNow) / 1000) : 1 / 60;
    lastLoopNow = now;
    loopFpsFrames += 1;
    if (!loopFpsAt) loopFpsAt = now;
    if (now - loopFpsAt >= 400) {
      loopFps = loopFpsFrames * 1000 / (now - loopFpsAt);
      loopFpsFrames = 0;
      loopFpsAt = now;
      window.__CRAYON_FPS = Math.round(loopFps * 10) / 10;
    }
    window.__CRAYON_LOOP_ON = true;
    const canAnalyse = !!(analyser && spec && audioCtx && (mode !== "idle" || heldVoices.size > 0));
    if (!canAnalyse) {
      paintHeldPiano();
      paintDualKeys();
      pushTrackHist(now);
      drawWave(true, { playhead: false });
      paintClock(dt);
      if (loopWantsFrames()) raf = requestAnimationFrame(loop);
      else {
        loopOn = false;
        window.__CRAYON_LOOP_ON = false;
      }
      return;
    }
    analyser.getFloatFrequencyData(spec);
    const binHz = audioCtx.sampleRate / analyser.fftSize;
    updateConcertPitch(spec, binHz);
    const clustered = densityClusterFunds(groupHarmonicFunds(extractClusterPeaks(spec, binHz)));
    lastSpecClusters = clustered;
    drawSpecPlot(clustered);
    matchLiveTracks(clustered, now);
    syncTrackUi();
    pushTrackHist(now);
    drawWave(true, { playhead: false });
    if (performance.now() - lastLabelAt > LABEL_EVERY_MS) requestLabels(false);
    const mixed = isTous();
    const useBands = !mixed;
    const i0 = Math.max(2, Math.floor(MIXED_LO_HZ / binHz));
    const i1 = Math.min(spec.length - 2, Math.ceil(MIXED_HI_HZ / binHz));
    score.fill(-120);
    scoreHz.fill(0);
    const fold = !mixed;

    const peaks = [];
    for (let i = i0; i <= i1; i++) {
      const freq = i * binHz;
      if (useBands && !freqInActiveBands(freq)) continue;
      const db = spec[i];
      if (db > spec[i - 1] && db >= spec[i + 1] && db > spec[i - 2] && db >= spec[i + 2]) {
        const denom = spec[i - 1] - 2 * spec[i] + spec[i + 1];
        const delta = denom ? 0.5 * (spec[i - 1] - spec[i + 1]) / denom : 0;
        const pf = (i + delta) * binHz;
        if (!useBands || freqInActiveBands(pf)) peaks.push({ freq: pf, db: db });
      }
      const midi = midiFromHz(freq, fold);
      if (midi >= MIDI_LO && midi <= MIDI_HI) {
        const idx = midi - MIDI_LO;
        if (db > score[idx]) {
          score[idx] = db;
          scoreHz[idx] = freq;
        }
      }
    }
    peaks.sort(function (a, b) { return b.db - a.db; });
    for (let p = 0; p < peaks.length; p++) {
      const midi = midiFromHz(peaks[p].freq, fold);
      if (midi < MIDI_LO || midi > MIDI_HI) continue;
      const idx = midi - MIDI_LO;
      if (peaks[p].db + 2 > score[idx]) {
        score[idx] = peaks[p].db + 2;
        scoreHz[idx] = peaks[p].freq;
      }
    }

    let loudest = -120;
    for (let i = 0; i < nKeys; i++) {
      smooth[i] = 0.62 * smooth[i] + 0.38 * score[i];
      if (smooth[i] > loudest) loudest = smooth[i];
    }

    const sens = 0.58;
    const absGate = -48 - sens * 36;
    const relDb = 10 + sens * 18;
    const gate = Math.max(absGate, loudest - relDb);
    const maxN = $chords.checked ? 8 : 1;

    const candidates = [];
    for (let i = 0; i < nKeys; i++) {
      const s = smooth[i];
      if (s < gate) continue;
      const left = i > 0 ? smooth[i - 1] : -999;
      const right = i < nKeys - 1 ? smooth[i + 1] : -999;
      if (s >= left && s >= right) {
        candidates.push({
          midi: i + MIDI_LO,
          s: s,
          freq: scoreHz[i] || midiToHz(i + MIDI_LO)
        });
      }
    }
    candidates.sort(function (a, b) { return b.s - a.s; });
    const lit = candidates.slice(0, maxN);
    setNeededMidis(lit.map(function (c) { return c.midi; }));
    const litSet = {};
    const litPc = {};
    for (let k = 0; k < lit.length; k++) {
      litSet[lit[k].midi] = lit[k];
      litPc[pcOf(lit[k].midi)] = true;
    }
    midiHolders.forEach(function (_set, midi) {
      if (midi < MIDI_LO || midi > MIDI_HI) return;
      if (!litSet[midi]) {
        litSet[midi] = { midi: midi, s: loudest, freq: midiToHz(midi) };
        litPc[pcOf(midi)] = true;
      }
    });

    const ghostSet = {};
    for (let k = 0; k < lit.length; k++) {
      const c = lit[k];
      const ghosts = [c.midi + 12, c.midi - 12, c.midi + 7, c.midi - 7];
      for (let g = 0; g < ghosts.length; g++) {
        const midi = ghosts[g];
        if (midi >= MIDI_LO && midi <= MIDI_HI && !litSet[midi]) ghostSet[midi] = true;
      }
    }

    keys.forEach(function (el, midi) {
      const hit = litSet[midi];
      const on = !!hit;
      const harm = !on && !!ghostSet[midi];
      const wasOn = el.classList.contains("on");
      const wasHarm = el.classList.contains("harm");
      el.classList.toggle("on", on);
      el.classList.toggle("harm", harm);
      const lab = el.firstElementChild;
      if (on) {
        const span = Math.max(6, loudest - gate);
        const vel = Math.max(0.22, Math.min(1, (hit.s - gate) / span));
        el.style.setProperty("--vel", String(vel));
        el.style.setProperty("--pop", Math.round(10 * vel) + "%");
        if (!wasOn) {
          paintEl(el, crayonOf(midi));
          if (lab) lab.textContent = crayonOf(midi).fr + octaveOf(midi);
        }
      } else {
        if (wasOn) {
          el.style.removeProperty("--vel");
          el.style.removeProperty("--pop");
          if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
        }
        if (harm && !wasHarm) paintEl(el, crayonOf(midi));
      }
    });

    chromaDb.fill(-120);
    for (let i = 0; i < nKeys; i++) {
      const pc = ((i + MIDI_LO) % 12 + 12) % 12;
      if (smooth[i] > chromaDb[pc]) chromaDb[pc] = smooth[i];
    }
    for (let b = 0; b < chromaBars.length; b++) {
      const bar = chromaBars[b];
      const name = bar.dataset.pc;
      const v = chromaDb[bar.dataset.i | 0];
      const on = v >= gate && !!litPc[name];
      bar.classList.toggle("on", on);
      const pct = Math.max(0, Math.min(100, (v - absGate) * 1.8));
      const frac = on ? Math.max(0.28, pct / 100) : Math.max(0, pct * 0.0025);
      const fill = bar.firstElementChild;
      const tr = "scaleY(" + frac.toFixed(3) + ")";
      if (fill.style.transform !== tr) fill.style.transform = tr;
    }

    const chipKey = lit.map(function (c) { return c.midi; }).sort(function (a, b) { return a - b; }).join(",");
    if (chipKey !== lastChipKey) {
      lastChipKey = chipKey;
      $chips.innerHTML = "";
      if (lit.length) {
        lit.slice().sort(function (a, b) { return a.midi - b.midi; }).forEach(function (c) {
          const info = crayonOf(c.midi);
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.dataset.pc = pcOf(c.midi);
          paintEl(chip, info);
          chip.textContent = info.fr + octaveOf(c.midi);
          $chips.appendChild(chip);
        });
      }
      $chips.appendChild($hzLive);
    }
    if (lit.length) {
      $hzLive.textContent = String(Math.round(lit[0].freq));
    } else if ($hzLive.textContent) {
      $hzLive.textContent = "";
    }

    paintClock(dt);

    if (loopWantsFrames()) {
      raf = requestAnimationFrame(loop);
    } else {
      loopOn = false;
      window.__CRAYON_LOOP_ON = false;
    }
  }

  paintScore();

  buildLegend();
  buildKeyboard();
  initKeyboard();
  buildTracks();
  applyTheme(preferredTheme());
  setCaptureKind(canShareTabAudio() ? "phones" : "mic");
  probeFm();
  syncTuneUi();
  requestAnimationFrame(function () {
    layoutBlackKeys();
    drawWave(true);
    const wrap = $board.parentElement;
    if (wrap && wrap.scrollWidth > wrap.clientWidth) {
      const whites = $board.querySelectorAll(".white");
      const mid = Array.prototype.find.call(whites, function (el) {
        return Number(el.dataset.midi) === 60;
      });
      if (mid) {
        wrap.scrollLeft = Math.max(0, mid.offsetLeft - wrap.clientWidth / 2 + mid.offsetWidth / 2);
      }
    }
  });
})();
  </script>
</body>
</html>
