<!DOCTYPE html>
<html lang="fr" class="stealth">
<head>
  <meta charset="utf-8">
  <style>html,body{background:#121214;color-scheme:dark}</style>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Piano-crayon">
  <title>Piano-crayon</title>
  <style>
    :root, html.stealth {
      --bg: #121214;
      --ink: #9a9aa2;
      --muted: #6e6e76;
      --paper: #18181c;
      --paper-ink: #9a9aa2;
      --hairline: #333338;
      --hairline-strong: #3a3a42;
      --key-white: #2a2a2e;
      --key-white-edge: #333338;
      --key-black: #1a1a1c;
      --key-black-edge: #161618;
      --live: rgb(111, 153, 72);
      --stop: rgb(153, 72, 73);
      --replay: rgb(72, 72, 153);
      --replay-on: rgb(72, 126, 153);
      --tap: color-mix(in srgb, #9a9aa2 18%, transparent);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dt: 150ms;
      --glow: 36%;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      overscroll-behavior: none;
    }
    html { -webkit-text-size-adjust: 100%; background: #121214; color-scheme: dark; }
    html.studio { background: #efe8dc; color-scheme: light; }
    body {
      font-family: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif;
      font-optical-sizing: auto;
      background: var(--bg);
      color: var(--ink);
      padding:
        max(14px, var(--safe-t))
        max(16px, var(--safe-r))
        max(24px, var(--safe-b))
        max(16px, var(--safe-l));
    }
    h1 {
      margin: 0 0 2px;
      font-size: clamp(1.12rem, 2.2vw, 1.48rem);
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      margin-bottom: 10px;
    }
    button, input, select {
      font: inherit;
      font-size: 1rem;
    }
    #btn, #replay {
      width: 56px;
      height: 56px;
      min-width: 56px;
      min-height: 56px;
      padding: 0;
      border: 1px solid var(--hairline-strong);
      border-radius: 50%;
      cursor: pointer;
      color: var(--ink);
      background: #1c1c20;
      display: grid;
      place-items: center;
      place-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: var(--tap);
      transition: background-color var(--dt) var(--ease), border-color var(--dt) var(--ease);
    }
    /* Idle listen = green ring; .live = stop (red square). */
    #btn { border-color: color-mix(in srgb, var(--live) 55%, var(--hairline)); }
    #btn .icon {
      width: 16px;
      height: 16px;
      border: 2px solid var(--live);
      border-radius: 50%;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--live) 28%, transparent);
    }
    #btn.live {
      background: color-mix(in srgb, var(--stop) 22%, #1c1c20);
      border-color: var(--stop);
      animation: live-ring 1.7s ease-in-out infinite;
    }
    #btn.live .icon {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 2px;
      background: #e8e8ee;
      box-shadow: none;
    }
    @keyframes live-ring {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--stop) 0%, transparent); }
      50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--stop) 22%, transparent); }
    }
    #btn:focus-visible, #replay:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    #replay { border-color: color-mix(in srgb, var(--replay) 55%, var(--hairline)); }
    #replay .icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 7px 0 7px 12px;
      border-color: transparent transparent transparent var(--ink);
      margin-left: 2px;
    }
    #replay.playing {
      background: color-mix(in srgb, var(--replay-on) 22%, #1c1c20);
      border-color: var(--replay-on);
    }
    #replay.playing .icon,
    #replay.loading .icon {
      width: 14px;
      height: 14px;
      margin: 0;
      border: 0;
      border-radius: 2px;
      background: var(--ink);
    }
    #replay.loading { opacity: 0.7; }
    .scrub {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 12px;
      align-items: end;
      margin: 0 0 10px;
    }
    .arrange {
      min-width: 0;
      outline: none;
      touch-action: none;
    }
    .arrange-ruler {
      height: 18px;
      position: relative;
      color: var(--muted);
      font-size: 0.62rem;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .arrange-ruler span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
    }
    .arrange-ruler span:first-child { transform: none; }
    .arrange-row {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      min-height: 64px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      overflow: hidden;
      background: #16161a;
    }
    .arrange-head {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 8px 8px 8px 10px;
      background: #141418;
      border-right: 1px solid var(--hairline);
    }
    .arrange-swatch {
      width: 28px;
      height: 8px;
      border-radius: 1px;
      background: var(--replay);
    }
    .arrange-lane {
      position: relative;
      min-height: 64px;
      cursor: ew-resize;
      touch-action: none;
      contain: layout style;
    }
    .arrange-lane canvas {
      display: block;
      width: 100%;
      height: 64px;
      pointer-events: none;
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      margin-left: -1px;
      background: #e8e8ee;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }
    .playhead::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 7px solid #e8e8ee;
    }
    .scrub .clock {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-weight: 650;
      color: var(--ink);
      font-size: 0.82rem;
      min-width: 4.8rem;
      padding-bottom: 6px;
    }
    .tracks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: stretch;
      margin: 0 0 8px;
    }
    .track-btn {
      font-size: 0.88rem;
      font-weight: 650;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      cursor: pointer;
      min-height: 44px;
      line-height: 1.15;
      text-align: center;
      color: var(--ink);
      background: color-mix(in srgb, var(--crayon) 14%, var(--bg));
      opacity: 0.55;
      touch-action: manipulation;
      -webkit-tap-highlight-color: var(--tap);
    }
    .track-btn[aria-pressed="true"] {
      opacity: 1;
      background: var(--crayon);
      color: var(--lab, var(--ink));
      border-color: var(--crayon);
      box-shadow: 0 0 10px color-mix(in srgb, var(--crayon) var(--glow), transparent);
      outline: none;
    }
    .track-btn:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    .tracks:empty { display: none; }
    .tune-line {
      font-weight: 650;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      color: #7a8a94;
      margin: 0 0 8px;
    }
    .tune-line .muted { color: var(--muted); font-weight: 600; }
    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 650;
      color: var(--muted);
      user-select: none;
      min-height: 44px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .toggle .knob {
      width: 36px;
      height: 20px;
      border-radius: 10px;
      background: #1c1c20;
      border: 1px solid var(--hairline-strong);
      position: relative;
      flex-shrink: 0;
    }
    .toggle .knob::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform var(--dt) var(--ease), background-color var(--dt) var(--ease);
    }
    .toggle input:checked + .knob {
      border-color: color-mix(in srgb, var(--replay-on) 50%, var(--hairline));
      background: color-mix(in srgb, var(--replay-on) 22%, #1c1c20);
    }
    .toggle input:checked + .knob::after {
      transform: translateX(16px);
      background: var(--replay-on);
    }
    .toggle input:focus-visible + .knob {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    .chroma {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2px;
      height: 56px;
      margin: 8px 0 8px;
      padding: 4px;
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 4px;
    }
    .chroma .bar {
      position: relative;
      background: color-mix(in srgb, var(--ink) 6%, var(--paper));
      border-radius: 2px 2px 1px 1px;
      overflow: hidden;
      border: 1px solid var(--hairline);
    }
    .chroma .fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 100%;
      transform: scaleY(0);
      transform-origin: 50% 100%;
      background: var(--crayon);
      transition: transform var(--dt) var(--ease);
    }
    .chroma .bar.on .fill {
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .chroma .lab {
      position: absolute;
      left: 0; right: 0; bottom: 3px;
      text-align: center;
      font-size: 0.58rem;
      font-weight: 650;
      color: var(--ink);
      z-index: 1;
      pointer-events: none;
      opacity: 0.72;
    }
    .chroma .bar.on .lab { opacity: 1; color: var(--lab, var(--ink)); }
    .chips {
      min-height: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 4px;
      font-weight: 650;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      border: 1px solid color-mix(in srgb, var(--ink) 16%, var(--crayon));
      background: var(--crayon);
      color: var(--lab, var(--ink));
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .hz-live {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .board-well {
      background: #18181c;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 8px 8px 10px;
      box-shadow: none;
    }
    .board-wrap {
      position: relative;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      padding-bottom: 2px;
    }
    #board {
      position: relative;
      height: clamp(168px, 28vw, 236px);
      min-width: 640px;
      width: 100%;
      user-select: none;
      touch-action: pan-x;
    }
    .key {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition:
        background-color var(--dt) var(--ease),
        box-shadow var(--dt) var(--ease);
    }
    .white {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--key-white);
      border: 1px solid var(--key-white-edge);
      border-radius: 0 0 5px 5px;
      z-index: 1;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        inset 0 -8px 12px rgba(0, 0, 0, 0.28);
    }
    .white .name {
      position: absolute;
      bottom: 8px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 650;
      color: var(--muted);
      opacity: 0.7;
      pointer-events: none;
    }
    .black {
      position: absolute;
      top: 0;
      height: 62%;
      background: var(--key-black);
      border: 1px solid var(--key-black-edge);
      border-radius: 0 0 3px 3px;
      z-index: 3;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        inset 0 -8px 10px rgba(0, 0, 0, 0.28);
    }
    .black .name {
      position: absolute;
      bottom: 6px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.52rem;
      font-weight: 650;
      color: var(--muted);
      opacity: 0.55;
      pointer-events: none;
    }
    .key.on {
      background: var(--crayon) !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        0 0 14px color-mix(in srgb, var(--crayon) var(--glow), transparent);
      z-index: 4;
    }
    .key.on .name { color: var(--ink); opacity: 0.92; }
    .key.harm:not(.on) {
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--crayon) 40%, transparent);
    }
    .white.harm:not(.on) {
      background: color-mix(in srgb, var(--crayon) 11%, var(--key-white));
    }
    .black.harm:not(.on) {
      background: color-mix(in srgb, var(--crayon) 18%, var(--key-black));
    }
    .key.study {
      outline: 1px solid var(--ink);
      outline-offset: -2px;
    }
    .legend {
      margin-top: 14px;
      background: transparent;
      color: var(--paper-ink);
      border-radius: 0;
      padding: 8px 0 0;
      border: none;
    }
    .legend h2 {
      margin: 0 0 8px;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pencils {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
    }
    .pencil {
      border-radius: 3px;
      padding: 6px 3px 5px;
      text-align: center;
      background: var(--crayon);
      color: var(--lab, var(--ink));
      border: 1px solid color-mix(in srgb, var(--ink) 16%, var(--crayon));
      min-height: 52px;
    }
    .pencil .fr { font-weight: 650; font-size: 0.88rem; }
    details.adv {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    details.adv summary {
      cursor: pointer;
      color: var(--ink);
      min-height: 44px;
      display: flex;
      align-items: center;
      touch-action: manipulation;
    }
    details.adv select {
      margin-top: 8px;
      max-width: 100%;
      min-height: 44px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--hairline-strong);
      background: var(--paper);
      color: var(--ink);
      font-size: 1rem;
    }
    .err {
      color: #8a4a4c;
      font-weight: 650;
      margin: 8px 0;
    }
    @supports (background: color-mix(in srgb, red 50%, white)) {
      .key.on {
        background: color-mix(in srgb, var(--crayon) calc(100% - var(--pop, 0%)), #ffffff) !important;
      }
    }
    @supports (color: color(display-p3 1 0 0)) {
      .key.on {
        background: var(--crayon-p3, var(--crayon)) !important;
      }
      .chroma .fill,
      .pencil,
      .chip,
      .track-btn[aria-pressed="true"] {
        background: var(--crayon-p3, var(--crayon));
      }
      @supports (background: color-mix(in srgb, red 50%, white)) {
        .key.on {
          background: color-mix(in srgb, var(--crayon-p3, var(--crayon)) calc(100% - var(--pop, 0%)), #ffffff) !important;
        }
      }
    }
    @media (max-width: 900px) {
      .pencils { grid-template-columns: repeat(6, 1fr); }
      .chroma { height: 72px; }
    }
    @media (min-width: 768px) {
      #board { height: 220px; }
    }
    @media (min-width: 1024px) {
      #board { height: 240px; min-width: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chroma .fill,
      .key,
      #btn,
      #replay { transition: none; }
      #btn.live { animation: none; }
      .playhead { will-change: auto; }
      .key.on { box-shadow: inset 0 0 0 1px var(--hairline-strong); }
    }
    @media (prefers-reduced-transparency: reduce) {
      .key.on,
      .chip,
      .track-btn[aria-pressed="true"],
      .chroma .bar.on .fill { box-shadow: none; }
    }
    @media (prefers-contrast: more) {
      html.stealth {
        --ink: #a8a8b0;
        --hairline: #3e3e46;
        --hairline-strong: #4a4a54;
        --muted: #7a7a82;
        --glow: 40%;
      }
      html.studio {
        --ink: #1c1916;
        --hairline: #8a8276;
        --hairline-strong: #5c564c;
        --muted: #4a453e;
      }
      .key.on { box-shadow: inset 0 0 0 1px var(--ink); }
    }
    html.studio {
      --bg: #efe8dc;
      --ink: #3a342e;
      --muted: #6e675e;
      --paper: #f7f1e8;
      --paper-ink: #3a342e;
      --hairline: #d4cdc2;
      --hairline-strong: #b7aea0;
      --key-white: #f4efe6;
      --key-white-edge: #cfc6b8;
      --key-black: #3f3a34;
      --key-black-edge: #2c2824;
      --tap: color-mix(in srgb, var(--ink) 14%, transparent);
      --glow: 32%;
      --live: rgb(121, 176, 69);
      --stop: rgb(196, 59, 61);
      --replay: rgb(69, 69, 186);
      --replay-on: rgb(76, 151, 189);
    }
    html.studio .arrange-row {
      background: color-mix(in srgb, var(--ink) 6%, var(--paper));
    }
    html.studio .arrange-head { background: color-mix(in srgb, var(--ink) 8%, var(--paper)); }
    html.studio .playhead { background: var(--ink); }
    html.studio .playhead::before {
      background: transparent;
      border-top-color: var(--ink);
    }
    html.studio #replay {
      color: var(--ink);
      background: var(--replay);
    }
    html.studio #replay .icon {
      border-color: transparent transparent transparent #f7f1e8;
    }
    html.studio #replay.playing .icon,
    html.studio #replay.loading .icon { background: #f7f1e8; }
    /* Idle start action is green; while listening the button is the stop control (red). */
    html.studio #btn {
      background: var(--live);
      color: var(--ink);
      border-color: var(--hairline-strong);
    }
    html.studio #btn .icon {
      border-color: var(--ink);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--ink) 18%, transparent);
    }
    html.studio #btn.live {
      background: var(--stop);
      color: #f7f1e8;
      border-color: var(--hairline-strong);
    }
    html.studio #btn.live .icon { background: #f7f1e8; }
    html.studio #replay { background: var(--replay); border-color: var(--hairline-strong); }
    html.studio #replay.playing {
      background: var(--replay-on);
      color: var(--ink);
      border-color: var(--hairline-strong);
    }
    html.studio .toggle .knob {
      background: var(--paper);
      border-color: var(--hairline-strong);
    }
    html.studio .track-btn {
      color: var(--lab, var(--ink));
      background: var(--crayon, var(--paper));
      border-color: var(--hairline-strong);
      opacity: 0.42;
    }
    html.studio .track-btn[aria-pressed="true"] {
      opacity: 1;
      box-shadow: 0 0 10px color-mix(in srgb, var(--crayon) var(--glow), transparent);
      outline: 1px solid var(--ink);
      outline-offset: 1px;
    }
    html.studio .tune-line { color: rgb(76, 151, 189); }
    html.studio .chroma .bar.on .lab { color: var(--lab); }
    html.studio .chip {
      background: var(--crayon);
      color: var(--lab);
      border-color: var(--hairline-strong);
      box-shadow: 0 0 6px color-mix(in srgb, var(--crayon) 20%, transparent);
    }
    html.studio .board-well {
      background: color-mix(in srgb, var(--ink) 5%, var(--paper));

  <script>
(function () {
  "use strict";

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  /* Canonical crayon RGB = macOS Crayons.clr picker (full sat on keys + legend).
     Pressed keys / chips / chroma / pencils use rgb (and matching display-p3).
     Do  Maraschino  251,2,7
     Do♯ Cayenne     198,64,42   (enamel; picker 128,0,2)
     Ré  Tangerine   253,128,8
     Ré♯ Lemon       255,255,10
     Mi  Lime        128,255,8
     Fa  Spring      33,255,6
     Fa♯ Fern        52,168,88   (enamel; picker 64,128,2)
     Sol Spindrift   102,255,204
     Sol♯ Sky        102,204,255
     La  Blueberry   0,0,255
     La♯ Grape       128,0,255
     Si  Magenta     251,2,255 */
  const CRAYONS = {
    C:  { fr: "Do",  pencil: "Maraschino", rgb: [251, 2, 7],     p3: [0.903, 0.198, 0.145], hz: 261.63 },
    "C#": { fr: "Do♯", pencil: "Cayenne",     rgb: [198, 64, 42],   p3: [0.720, 0.270, 0.175], hz: 277.18 },
    D:  { fr: "Ré",  pencil: "Tangerine",  rgb: [253, 128, 8],   p3: [0.929, 0.528, 0.205], hz: 293.66 },
    "D#": { fr: "Ré♯", pencil: "Lemon",       rgb: [255, 255, 10],  p3: [1.000, 1.000, 0.336], hz: 311.13 },
    E:  { fr: "Mi",  pencil: "Lime",       rgb: [128, 255, 8],   p3: [0.630, 0.988, 0.310], hz: 329.63 },
    F:  { fr: "Fa",  pencil: "Spring",     rgb: [33, 255, 6],    p3: [0.473, 0.985, 0.302], hz: 349.23 },
    "F#": { fr: "Fa♯", pencil: "Fern",        rgb: [52, 168, 88],   p3: [0.265, 0.640, 0.355], hz: 369.99 },
    G:  { fr: "Sol", pencil: "Spindrift",  rgb: [102, 255, 204], p3: [0.572, 0.987, 0.812], hz: 392.00 },
    "G#": { fr: "Sol♯", pencil: "Sky",        rgb: [102, 204, 255], p3: [0.503, 0.791, 0.981], hz: 415.30 },
    A:  { fr: "La",  pencil: "Blueberry",  rgb: [0, 0, 255],     p3: [0.000, 0.000, 0.959], hz: 440.00 },
    "A#": { fr: "La♯", pencil: "Grape",       rgb: [128, 0, 255],   p3: [0.458, 0.080, 0.961], hz: 466.16 },
    B:  { fr: "Si",  pencil: "Magenta",    rgb: [251, 2, 255],   p3: [0.903, 0.198, 0.967], hz: 493.88 }
  };
  const MIDI_LO = 36; // C2
  const MIDI_HI = 96; // C7
  const A4_REF = 440;
  const A4_MIN = 427; // ≈ −50 cents; beyond that, nearest-note votes wrap a semitone
  const A4_MAX = 453; // ≈ +50 cents
  const TUNE_LO_HZ = 80;
  const TUNE_HI_HZ = 1400;
  const TUNE_WINDOW_S = 2.2;
  const BLACK = { 1: true, 3: true, 6: true, 8: true, 10: true };

  const SAMPLE_URL = "samples/final_song.wav";
  const MIXED_LO_HZ = 60;
  const MIXED_HI_HZ = 2500;
  // Approximate musician stems by frequency band (no true stems).
  // Guitar A = lower-mid; Guitar B = upper guitar so A/B are not identical.
  const MUSICIANS = [
    { id: "bass", fr: "Contrebasse", en: "Bass", lo: 40, hi: 180, rgb: [198, 64, 42], p3: [0.720, 0.270, 0.175] },
    { id: "cello", fr: "Violoncelle", en: "Cello", lo: 130, hi: 400, rgb: [253, 128, 8], p3: [0.929, 0.528, 0.205] },
    { id: "guitarA", fr: "Guitare A", en: "Guitar A", lo: 200, hi: 520, rgb: [33, 255, 6], p3: [0.473, 0.985, 0.302] },
    { id: "guitarB", fr: "Guitare B", en: "Guitar B", lo: 480, hi: 900, rgb: [102, 204, 255], p3: [0.503, 0.791, 0.981] },
    { id: "nylon", fr: "Nylon / aigu", en: "Nylon / high", lo: 600, hi: 2500, rgb: [128, 0, 255], p3: [0.458, 0.080, 0.961] }
  ];

  const $btn = document.getElementById("btn");
  const $replay = document.getElementById("replay");
  const $chords = document.getElementById("chords");
  const $unmute = document.getElementById("unmute");
  const $arrange = document.getElementById("arrange");
  const $arrangeLane = document.getElementById("arrangeLane");
  const $wave = document.getElementById("wave");
  const $playhead = document.getElementById("playhead");
  const $ruler = document.getElementById("ruler");
  const $clock = document.getElementById("clock");
  const $err = document.getElementById("err");
  const $chroma = document.getElementById("chroma");
  const $chips = document.getElementById("chips");
  const $hzLive = document.getElementById("hzLive");
  const $board = document.getElementById("board");
  const $pencils = document.getElementById("pencils");
  const $micAlt = document.getElementById("micAlt");
  const $tracks = document.getElementById("tracks");
  const $autotune = document.getElementById("autotune");
  const $tuneLine = document.getElementById("tuneLine");
  const $stealth = document.getElementById("stealth");
  const heardTracks = new Set();
  const hearHits = {};
  const selectedTracks = new Set();
  let followHeard = true;
  let wavePeaks = null;
  let waveBuf = null;
  let waveCssW = 0;
  let waveDrawnKey = "";
  let playheadShown = 0;
  let lastRestartMs = 0;
  let lastClockText = "";
  let lastAriaSec = -1;
  let loopOn = false;
  let chromaBars = [];
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const keys = new Map();
  let audioCtx = null;
  let analyser = null;
  let sourceNode = null;
  let spec = null;
  let stream = null;
  let mode = "idle";
  let raf = 0;
  let micOverrideId = null;
  let deviceChangeBound = false;
  let deviceChangeTimer = 0;
  let reopenBusy = false;
  let actionId = 0;
  let replayLoading = false;
  let sampleBuffer = null;
  let sampleLoad = null;
  let bufferSource = null;
  let sampleGain = null;
  let sampleDuration = 0;
  let sampleOffset = 0;
  let sampleStartCtxTime = 0;
  let scrubbing = false;
  const nKeys = MIDI_HI - MIDI_LO + 1;
  const smooth = new Float32Array(nKeys);
  const score = new Float32Array(nKeys);
  const scoreHz = new Float32Array(nKeys);
  const chromaDb = new Float32Array(12);
  smooth.fill(-120);
  let aEst = A4_REF;
  let tuneReady = false;
  const centsWindow = [];

  function rgbCss(rgb) { return "rgb(" + rgb[0] + ", " + rgb[1] + ", " + rgb[2] + ")"; }
  function p3Css(p3) { return "color(display-p3 " + p3[0] + " " + p3[1] + " " + p3[2] + ")"; }
  function luminance(rgb) {
    return (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  }
  function labColor(rgb) {
    return luminance(rgb) < 0.48 ? "#f4efe6" : "#3a342e";
  }
  function paintSrc(src) {
    if (Array.isArray(src)) return { rgb: src, display: src };
    return src;
  }
  function paintEl(el, src) {
    const c = paintSrc(src);
    const rgb = c.rgb;
    const p3 = c.p3;
    el.style.setProperty("--crayon", rgbCss(rgb));
    if (p3) el.style.setProperty("--crayon-p3", p3Css(p3));
    else el.style.removeProperty("--crayon-p3");
    el.style.setProperty("--lab", labColor(rgb));
  }
  function applyScene(stealth) {
    document.documentElement.classList.toggle("stealth", stealth);
    document.documentElement.classList.toggle("studio", !stealth);
    document.documentElement.style.colorScheme = stealth ? "dark" : "light";
    document.documentElement.style.background = stealth ? "#121214" : "#efe8dc";
    const theme = document.querySelector('meta[name="theme-color"]');
    if (theme) theme.setAttribute("content", stealth ? "#121214" : "#efe8dc");
    const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (bar) bar.setAttribute("content", stealth ? "black" : "default");
    NOTE_NAMES.forEach(function (name) {
      const c = CRAYONS[name];
      document.querySelectorAll('[data-pc="' + name + '"]').forEach(function (el) {
        paintEl(el, c);
      });
    });
    MUSICIANS.forEach(function (t) {
      const btn = document.getElementById("track-" + t.id);
      if (btn) paintEl(btn, t);
    });
    keys.forEach(function (el, midi) {
      if (el.classList.contains("on") || el.classList.contains("harm")) {
        paintEl(el, crayonOf(midi));
      }
    });
    document.querySelectorAll(".chip").forEach(function (el) {
      const pc = el.dataset.pc;
      if (pc && CRAYONS[pc]) paintEl(el, CRAYONS[pc]);
    });
    if (typeof drawWave === "function") drawWave(true);
  }
  function concertA() { return $autotune.checked ? aEst : A4_REF; }
  function midiToHzRef(m, a) { return a * Math.pow(2, (m - 69) / 12); }
  function hzToMidiRef(f, a) { return 69 + 12 * Math.log2(f / a); }
  function midiToHz(m) { return midiToHzRef(m, concertA()); }
  function hzToMidi(f) { return hzToMidiRef(f, concertA()); }
  function pcOf(midi) { return NOTE_NAMES[((midi % 12) + 12) % 12]; }
  function octaveOf(midi) { return Math.floor(midi / 12) - 1; }
  function crayonOf(midi) { return CRAYONS[pcOf(midi)]; }

  function isTous() {
    return followHeard || heardTracks.size === 0;
  }

  function activeMusicians() {
    if (isTous()) {
      return MUSICIANS.filter(function (t) { return heardTracks.has(t.id); });
    }
    return MUSICIANS.filter(function (t) { return selectedTracks.has(t.id); });
  }

  function syncTrackUi() {
    const heard = MUSICIANS.filter(function (t) { return heardTracks.has(t.id); });
    const ids = heard.map(function (t) { return t.id; }).join(",");
    if ($tracks.dataset.heard !== ids) {
      $tracks.dataset.heard = ids;
      $tracks.innerHTML = "";
      heard.forEach(function (t) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.id = "track-" + t.id;
        btn.className = "track-btn";
        btn.title = t.fr;
        paintEl(btn, t);
        btn.textContent = t.fr;
        btn.addEventListener("click", function () { onMusicianClick(t.id); });
        $tracks.appendChild(btn);
      });
    }
    const solo = !followHeard && selectedTracks.size === 1;
    heard.forEach(function (t) {
      const btn = document.getElementById("track-" + t.id);
      if (btn) {
        btn.setAttribute("aria-pressed", solo && selectedTracks.has(t.id) ? "true" : String(!solo));
      }
    });
  }

  function selectAllTracks() {
    followHeard = true;
    selectedTracks.clear();
    heardTracks.forEach(function (id) { selectedTracks.add(id); });
    syncTrackUi();
    resetSmooth();
  }

  function onMusicianClick(id) {
    if (!followHeard && selectedTracks.size === 1 && selectedTracks.has(id)) {
      selectAllTracks();
      return;
    }
    followHeard = false;
    selectedTracks.clear();
    selectedTracks.add(id);
    syncTrackUi();
    resetSmooth();
  }

  function resetHeard() {
    heardTracks.clear();
    Object.keys(hearHits).forEach(function (k) { delete hearHits[k]; });
    selectedTracks.clear();
    followHeard = true;
    syncTrackUi();
  }

  function detectHeard(specArr, binHz) {
    const floor = bandNoiseFloor(specArr, 2, Math.min(specArr.length - 2, Math.ceil(MIXED_HI_HZ / binHz)));
    let changed = false;
    MUSICIANS.forEach(function (t) {
      const i0 = Math.max(2, Math.floor(t.lo / binHz));
      const i1 = Math.min(specArr.length - 2, Math.ceil(t.hi / binHz));
      let peak = -120;
      for (let i = i0; i <= i1; i++) {
        if (specArr[i] > peak) peak = specArr[i];
      }
      const hot = peak > floor + 12 && peak > -70;
      hearHits[t.id] = Math.max(0, (hearHits[t.id] || 0) + (hot ? 1 : -2));
      if (hearHits[t.id] >= 10 && !heardTracks.has(t.id)) {
        heardTracks.add(t.id);
        if (followHeard) selectedTracks.add(t.id);
        changed = true;
      }
    });
    if (changed) syncTrackUi();
  }

  function freqInActiveBands(freq) {
    const bands = activeMusicians();
    if (!bands.length) return freq >= MIXED_LO_HZ && freq <= MIXED_HI_HZ;
    return bands.some(function (t) {
      return freq >= t.lo && freq <= t.hi;
    });
  }

  function midiFromHz(freq, fold) {
    let m = hzToMidi(freq);
    if (!isFinite(m)) return -1;
    if (fold) {
      while (m < MIDI_LO) m += 12;
      while (m > MIDI_HI) m -= 12;
    }
    return Math.round(m);
  }

  function medianNums(arr) {
    if (!arr.length) return 0;
    const s = arr.slice().sort(function (a, b) { return a - b; });
    const n = s.length;
    const mid = Math.floor(n / 2);
    return n % 2 ? s[mid] : 0.5 * (s[mid - 1] + s[mid]);
  }

  function bandNoiseFloor(specArr, i0, i1) {
    const step = Math.max(1, Math.floor((i1 - i0) / 72));
    const samples = [];
    for (let i = i0; i <= i1; i += step) samples.push(specArr[i]);
    if (!samples.length) return -90;
    samples.sort(function (a, b) { return a - b; });
    return samples[Math.floor(samples.length * 0.5)];
  }

  function scanTunePeaks(specArr, binHz) {
    const i0 = Math.max(2, Math.floor(TUNE_LO_HZ / binHz));
    const i1 = Math.min(specArr.length - 2, Math.ceil(TUNE_HI_HZ / binHz));
    const floor = bandNoiseFloor(specArr, i0, i1);
    const minDb = Math.max(-72, floor + 8);
    const peaks = [];
    for (let i = i0; i <= i1; i++) {
      const db = specArr[i];
      if (db < minDb) continue;
      if (db > specArr[i - 1] && db >= specArr[i + 1] && db > specArr[i - 2] && db >= specArr[i + 2]) {
        const denom = specArr[i - 1] - 2 * specArr[i] + specArr[i + 1];
        const delta = denom ? 0.5 * (specArr[i - 1] - specArr[i + 1]) / denom : 0;
        const freq = (i + delta) * binHz;
        if (freq >= TUNE_LO_HZ && freq <= TUNE_HI_HZ) peaks.push({ freq: freq, db: db });
      }
    }
    peaks.sort(function (a, b) { return b.db - a.db; });
    return peaks.slice(0, 16);
  }

  function groupHarmonics(peaks) {
    const byFreq = peaks.slice().sort(function (a, b) { return a.freq - b.freq; });
    const funds = [];
    byFreq.forEach(function (p) {
      let harmonic = false;
      for (let k = 0; k < funds.length; k++) {
        const f0 = funds[k].freq;
        const n = Math.round(p.freq / f0);
        if (n < 2 || n > 8) continue;
        const cents = 1200 * Math.log2(p.freq / (n * f0));
        if (Math.abs(cents) < 35) {
          harmonic = true;
          break;
        }
      }
      if (!harmonic) funds.push(p);
    });
    return funds;
  }

  function syncTuneUi() {
    const cents = 1200 * Math.log2(aEst / A4_REF);
    if (!$autotune.checked) {
      $tuneLine.textContent = "440";
      return;
    }
    if (mode === "idle") {
      $tuneLine.textContent = "440";
      return;
    }
    if (!tuneReady) {
      $tuneLine.textContent = "440";
      return;
    }
    $tuneLine.textContent = String(Math.round(aEst));
  }

  function resetTune() {
    aEst = A4_REF;
    tuneReady = false;
    centsWindow.length = 0;
    syncTuneUi();
  }

  function updateConcertPitch(specArr, binHz) {
    const peaks = scanTunePeaks(specArr, binHz);
    const funds = groupHarmonics(peaks);
    const votes = [];
    funds.forEach(function (p) {
      const midi = Math.round(hzToMidiRef(p.freq, A4_REF));
      const expected = midiToHzRef(midi, A4_REF);
      if (expected <= 0) return;
      const cents = 1200 * Math.log2(p.freq / expected);
      // Nearest 440-Hz MIDI note only unambiguously measures ±50 cents.
      // Wider ranges wrap (e.g. +60 → −40) and pull A the wrong way.
      if (!isFinite(cents) || Math.abs(cents) >= 50) return;
      votes.push(cents);
    });
    if (votes.length >= 1 && audioCtx) {
      const now = audioCtx.currentTime;
      centsWindow.push({ t: now, cents: medianNums(votes) });
      const cut = now - TUNE_WINDOW_S;
      while (centsWindow.length && centsWindow[0].t < cut) centsWindow.shift();
    }
    if (centsWindow.length >= 8) {
      const med = medianNums(centsWindow.map(function (v) { return v.cents; }));
      const clamped = Math.max(-50, Math.min(50, med));
      const target = A4_REF * Math.pow(2, clamped / 1200);
      const alpha = centsWindow.length >= 24 ? 0.12 : 0.05;
      aEst = aEst + alpha * (target - aEst);
      aEst = Math.max(A4_MIN, Math.min(A4_MAX, aEst));
      tuneReady = true;
    }
    syncTuneUi();
  }

  function buildTracks() {
    syncTrackUi();
  }

  function buildLegend() {
    NOTE_NAMES.forEach(function (name) {
      const c = CRAYONS[name];
      const el = document.createElement("div");
      el.className = "pencil";
      el.dataset.pc = name;
      el.dataset.rgb = c.rgb.join(",");
      el.title = c.fr + " · " + c.pencil;
      paintEl(el, c);
      el.innerHTML = '<div class="fr">' + c.fr + "</div>";
      $pencils.appendChild(el);

      const bar = document.createElement("div");
      bar.className = "bar";
      bar.dataset.pc = name;
      paintEl(bar, c);
      bar.innerHTML = '<div class="fill"></div><div class="lab">' + c.fr + "</div>";
      $chroma.appendChild(bar);
    });
    chromaBars = Array.prototype.slice.call($chroma.children);
  }

  function buildKeyboard() {
    let whiteCount = 0;
    for (let m = MIDI_LO; m <= MIDI_HI; m++) {
      if (!BLACK[m % 12]) whiteCount++;
    }
    let wi = 0;
    for (let m = MIDI_LO; m <= MIDI_HI; m++) {
      const pc = m % 12;
      const info = crayonOf(m);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "key " + (BLACK[pc] ? "black" : "white");
      el.dataset.midi = String(m);
      el.setAttribute("aria-label", info.fr + octaveOf(m) + " / " + pcOf(m) + octaveOf(m));
      const lab = document.createElement("span");
      lab.className = "name";
      if (BLACK[pc]) {
        lab.textContent = "♯";
        el.dataset.after = String(wi - 1);
      } else {
        lab.textContent = pc === 0 ? info.fr + octaveOf(m) : info.fr;
        el.dataset.whiteIndex = String(wi);
        wi += 1;
      }
      el.appendChild(lab);
      el.dataset.idleName = lab.textContent;
      el.addEventListener("click", function () { previewKey(m); });
      $board.appendChild(el);
      keys.set(m, el);
    }
    layoutBlackKeys();
  }

  function layoutBlackKeys() {
    const whites = $board.querySelectorAll(".white");
    if (!whites.length) return;
    const totalWhite = whites.length;
    whites.forEach(function (el, i) {
      el.style.left = (i * 100 / totalWhite) + "%";
      el.style.width = (100 / totalWhite) + "%";
    });
    const boardW = $board.getBoundingClientRect().width;
    if (!boardW) return;
    const w = boardW / totalWhite;
    const blackW = w * 0.62;
    $board.querySelectorAll(".black").forEach(function (el) {
      const after = Number(el.dataset.after);
      if (after < 0 || after >= totalWhite) return;
      const left = (after + 1) * w - blackW / 2;
      el.style.left = left + "px";
      el.style.width = blackW + "px";
    });
  }

  let studyMidi = null;
  function previewKey(midi) {
    if (studyMidi !== null && keys.get(studyMidi)) {
      keys.get(studyMidi).classList.remove("study");
    }
    studyMidi = midi;
    const el = keys.get(midi);
    const c = crayonOf(midi);
    el.classList.add("study", "on");
    paintEl(el, c);
    const nameEl = el.querySelector(".name");
    if (nameEl) nameEl.textContent = c.fr + octaveOf(midi);
    $hzLive.textContent = String(Math.round(midiToHz(midi)));
    setTimeout(function () {
      if (mode === "idle") {
        el.classList.remove("on");
        const lab = el.querySelector(".name");
        if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
      }
    }, 700);
  }

  function showErr(msg) {
    $err.hidden = !msg;
    $err.textContent = msg || "";
  }

  function stripDefaultPrefix(label) {
    return String(label || "")
      .replace(/^(Default|Par défaut|Défaut)\s*[-–:]\s*/i, "")
      .trim();
  }

  async function listInputs() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(function (d) { return d.kind === "audioinput"; });
  }

  function pickOsDefault(inputs) {
    return inputs.find(function (d) { return d.deviceId === "default"; })
      || inputs.find(function (d) { return /default|par défaut|défaut/i.test(d.label); })
      || null;
  }

  function fillMicList(inputs) {
    const keep = micOverrideId || "os";
    $micAlt.innerHTML = "";
    const osOpt = document.createElement("option");
    osOpt.value = "os";
    const def = pickOsDefault(inputs);
    osOpt.textContent = def && def.label
      ? "OS — " + stripDefaultPrefix(def.label)
      : "OS";
    $micAlt.appendChild(osOpt);
    inputs.forEach(function (d) {
      if (d.deviceId === "default") return;
      const opt = document.createElement("option");
      opt.value = d.deviceId;
      opt.textContent = d.label || d.deviceId.slice(0, 8);
      $micAlt.appendChild(opt);
    });
    $micAlt.value = keep === "os" || !keep ? "os" : keep;
    if ($micAlt.value !== keep && keep !== "os") $micAlt.value = "os";
  }

  async function updateMicStatus() {
    const inputs = await listInputs();
    fillMicList(inputs);
  }

  const AUDIO_EXTRAS = {
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false
  };

  async function requestMicStream() {
    if (micOverrideId) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: Object.assign({}, AUDIO_EXTRAS, { deviceId: { exact: micOverrideId } })
        });
      } catch (_) {
        micOverrideId = null;
        $micAlt.value = "os";
      }
    }
    try {
      return await navigator.mediaDevices.getUserMedia({ audio: AUDIO_EXTRAS });
    } catch (_) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: Object.assign({}, AUDIO_EXTRAS, { deviceId: { ideal: "default" } })
        });
      } catch (__) {
        return await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    }
  }

  function stopTracks() {
    if (sourceNode) {
      try { sourceNode.disconnect(); } catch (_) {}
      sourceNode = null;
    }
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
  }

  function ensureAnalyser() {
    if (!audioCtx || audioCtx.state === "closed") {
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    if (!analyser) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 16384;
      analyser.smoothingTimeConstant = 0.78;
      analyser.minDecibels = -95;
      analyser.maxDecibels = -18;
      spec = new Float32Array(analyser.frequencyBinCount);
    }
    if (!sampleGain) {
      sampleGain = audioCtx.createGain();
      sampleGain.gain.value = $unmute.checked ? 0.28 : 0;
      sampleGain.connect(audioCtx.destination);
    }
  }

  function setSampleGain(on) {
    if (!sampleGain || !audioCtx) return;
    const dest = on ? 0.28 : 0;
    const g = sampleGain.gain;
    const now = audioCtx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(dest, now + 0.018);
  }

  function resetSmooth() {
    smooth.fill(-120);
  }

  function fmtTime(s) {
    const t = Math.max(0, s || 0);
    const m = Math.floor(t / 60);
    const sec = Math.floor(t - m * 60);
    return m + ":" + String(sec).padStart(2, "0");
  }

  function targetRatio() {
    const dur = sampleDuration || 0;
    const t = scrubbing ? sampleOffset : sampleNow();
    return dur > 0 ? Math.max(0, Math.min(1, t / dur)) : 0;
  }

  function paintPlayhead(snap) {
    const target = targetRatio();
    if (snap || scrubbing || reduceMotion) playheadShown = target;
    else {
      playheadShown += (target - playheadShown) * 0.32;
      if (Math.abs(target - playheadShown) < 0.0005) playheadShown = target;
    }
    $playhead.style.transform = "translate3d(" + (playheadShown * (waveCssW || 1)) + "px,0,0)";
  }

  function restartBuffer(force) {
    if (mode !== "replay" || !sampleBuffer) return;
    const now = performance.now();
    if (!force && now - lastRestartMs < 72) return;
    lastRestartMs = now;
    startBufferAt(sampleOffset);
  }

  function seekFromClientX(clientX, restart) {
    const rect = $arrangeLane.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
    const dur = sampleDuration || 0;
    sampleOffset = dur * x;
    updateScrubUi(true);
    if (restart === "now") restartBuffer(true);
    else if (restart === "drag") restartBuffer(false);
  }

  function drawRuler() {
    const dur = sampleDuration || 0;
    $ruler.innerHTML = "";
    if (dur <= 0) return;
    const step = dur > 60 ? 15 : 10;
    for (let s = 0; s <= dur + 0.01; s += step) {
      const el = document.createElement("span");
      el.textContent = fmtTime(s);
      el.style.left = (100 * s / dur) + "%";
      $ruler.appendChild(el);
    }
  }

  function drawWave(force) {
    const canvas = $wave;
    const lane = $arrangeLane;
    const cssW = Math.max(1, Math.floor(lane.clientWidth || 320));
    const cssH = 64;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const stealth = document.documentElement.classList.contains("stealth");
    const key = cssW + "x" + cssH + "x" + dpr + (stealth ? "s" : "l") + ":" + (wavePeaks ? wavePeaks.length : 0);
    waveCssW = cssW;
    if (!force && key === waveDrawnKey) {
      paintPlayhead(true);
      return;
    }
    waveDrawnKey = key;
    const pxW = Math.round(cssW * dpr);
    const pxH = Math.round(cssH * dpr);
    if (canvas.width !== pxW) canvas.width = pxW;
    if (canvas.height !== pxH) canvas.height = pxH;
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = stealth ? "#16161a" : "#ebe4d8";
    ctx.fillRect(0, 0, cssW, cssH);
    ctx.fillStyle = stealth ? "rgba(255,255,255,0.04)" : "rgba(40,32,24,0.06)";
    ctx.fillRect(0, cssH / 2 - 0.5, cssW, 1);
    if (wavePeaks && wavePeaks.length) {
      const mid = cssH / 2;
      const amp = cssH * 0.42;
      const replay = getComputedStyle(document.documentElement).getPropertyValue("--replay").trim() || "rgb(72, 72, 153)";
      ctx.fillStyle = replay;
      for (let x = 0; x < cssW; x++) {
        const i = Math.min(wavePeaks.length - 1, Math.floor(x / cssW * wavePeaks.length));
        const h = Math.max(1, wavePeaks[i] * amp);
        ctx.fillRect(x, mid - h, 1, h * 2);
      }
    }
    paintPlayhead(true);
  }

  function wavPeaks(buf, bins) {
    const v = new DataView(buf);
    if (v.byteLength < 44) return null;
    let o = 12;
    let dataOff = 44;
    let dataLen = v.byteLength - 44;
    let rate = 48000;
    while (o + 8 <= v.byteLength) {
      const id = String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
      const sz = v.getUint32(o + 4, true);
      if (id === "fmt ") rate = v.getUint32(o + 12, true) || rate;
      if (id === "data") {
        dataOff = o + 8;
        dataLen = sz;
        break;
      }
      o += 8 + sz + (sz % 2);
    }
    const samples = Math.floor(dataLen / 2);
    if (samples < 8) return null;
    if (!sampleDuration) sampleDuration = samples / rate;
    const peaks = new Float32Array(bins);
    const step = samples / bins;
    for (let i = 0; i < bins; i++) {
      const a = dataOff + Math.floor(i * step) * 2;
      const b = dataOff + Math.floor((i + 1) * step) * 2;
      let m = 0;
      for (let p = a; p < b; p += 2) {
        if (p + 1 >= dataOff + dataLen) break;
        const s = Math.abs(v.getInt16(p, true)) / 32768;
        if (s > m) m = s;
      }
      peaks[i] = m;
    }
    return peaks;
  }

  function updateScrubUi(snap) {
    paintPlayhead(!!snap);
    const t = scrubbing ? sampleOffset : sampleNow();
    const dur = sampleDuration || 0;
    const text = fmtTime(t);
    if (text !== lastClockText) {
      lastClockText = text;
      $clock.textContent = text;
    }
    const sec = Math.round(t);
    if (snap || sec !== lastAriaSec) {
      lastAriaSec = sec;
      $arrange.setAttribute("aria-valuemax", String(Math.round(dur)));
      $arrange.setAttribute("aria-valuenow", String(sec));
      $arrange.setAttribute("aria-valuetext", text);
    }
  }

  function stopLoop() {
    loopOn = false;
    if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
  }

  function startLoop() {
    if (loopOn) return;
    loopOn = true;
    raf = requestAnimationFrame(loop);
  }

  function sampleNow() {
    if (mode !== "replay" || !bufferSource || !audioCtx) return sampleOffset;
    return Math.min(sampleDuration, sampleOffset + (audioCtx.currentTime - sampleStartCtxTime));
  }

  function stopBufferSource() {
    if (!bufferSource) return;
    try { bufferSource.onended = null; } catch (_) {}
    try { bufferSource.stop(); } catch (_) {}
    try { bufferSource.disconnect(); } catch (_) {}
    bufferSource = null;
  }

  function beginAction() {
    actionId += 1;
    return actionId;
  }

  function stopLateStream(late) {
    if (!late) return;
    late.getTracks().forEach(function (t) { t.stop(); });
  }

  function haltLive() {
    mode = "idle";
    stopLoop();
    stopTracks();
    $btn.classList.remove("live");
    $btn.setAttribute("aria-label", "Écouter");
    resetHeard();
    clearLights();
    resetTune();
  }

  function haltReplay(keepScrub) {
    replayLoading = false;
    if (mode === "replay") {
      sampleOffset = keepScrub ? sampleNow() : 0;
    }
    stopBufferSource();
    if (mode === "replay") mode = "idle";
    stopLoop();
    $replay.classList.remove("playing", "loading");
    $replay.setAttribute("aria-label", "Rejouer");
    if (mode === "idle") {
      resetHeard();
      clearLights();
      resetTune();
      if (!keepScrub) {
        sampleOffset = 0;
      }
      updateScrubUi(true);
    }
  }

  async function acquireStream() {
    const id = actionId;
    while (reopenBusy) {
      await new Promise(function (resolve) { setTimeout(resolve, 30); });
      if (id !== actionId || mode !== "live") return;
    }
    reopenBusy = true;
    try {
      stopTracks();
      const next = await requestMicStream();
      if (id !== actionId || mode !== "live") {
        stopLateStream(next);
        return;
      }
      stream = next;
      ensureAnalyser();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if (id !== actionId || mode !== "live") {
        stopTracks();
        return;
      }
      sourceNode = audioCtx.createMediaStreamSource(stream);
      sourceNode.connect(analyser);
      await updateMicStatus();
      if (id !== actionId || mode !== "live") {
        stopTracks();
        return;
      }
      showErr("");
    } finally {
      reopenBusy = false;
    }
  }

  function onDeviceChange() {
    if (mode !== "live") return;
    clearTimeout(deviceChangeTimer);
    deviceChangeTimer = setTimeout(function () {
      acquireStream().then(function () {
        if (mode !== "live") return;
      }).catch(function (e) {
        showErr("Micro: " + (e && e.message ? e.message : String(e)));
      });
    }, 280);
  }

  function bindDeviceChange() {
    if (deviceChangeBound || !navigator.mediaDevices) return;
    navigator.mediaDevices.addEventListener("devicechange", onDeviceChange);
    deviceChangeBound = true;
  }

  async function start() {
    showErr("");
    ensureAnalyser();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showErr("Pas de micro navigateur / No mic API. Ouvre Chrome ou Safari.");
      return;
    }
    const id = beginAction();
    try {
      if (mode === "replay" || replayLoading) haltReplay(true);
      mode = "live";
      resetSmooth();
      resetTune();
      await acquireStream();
      if (id !== actionId || mode !== "live" || !stream) return;
      bindDeviceChange();
      $btn.classList.add("live");
      $btn.setAttribute("aria-label", "Stop");
      startLoop();
    } catch (e) {
      if (id !== actionId) return;
      haltLive();
      var msg = (e && e.name === "NotAllowedError")
        ? "Autorise le micro / Allow the mic."
        : (e && e.message ? e.message : String(e));
      if (location.protocol === "file:") {
        msg += " Chrome bloque souvent file:// — ouvre via: python3 -m http.server 4173 --directory web";
      }
      showErr(msg);
    }
  }

  function stopLive() {
    beginAction();
    haltLive();
  }

  function stopReplay(keepScrub) {
    beginAction();
    haltReplay(keepScrub);
  }

  async function loadSample() {
    if (sampleBuffer) return sampleBuffer;
    if (sampleLoad) return sampleLoad;
    sampleLoad = (async function () {
      let arr = waveBuf;
      if (!arr) {
        const res = await fetch(SAMPLE_URL);
        if (!res.ok) {
          throw new Error(
            "WAV introuvable / Sample missing (" + res.status + "): " + SAMPLE_URL +
            " — from repo root: cp captures/final_song.wav web/samples/final_song.wav"
          );
        }
        arr = await res.arrayBuffer();
        waveBuf = arr;
      }
      if (!wavePeaks) {
        wavePeaks = wavPeaks(arr, 900);
        drawRuler();
        drawWave();
      }
      ensureAnalyser();
      sampleBuffer = await audioCtx.decodeAudioData(arr.slice(0));
      sampleDuration = sampleBuffer.duration;
      updateScrubUi();
      return sampleBuffer;
    })();
    try {
      return await sampleLoad;
    } catch (e) {
      sampleLoad = null;
      throw e;
    }
  }

  function startBufferAt(offset) {
    stopBufferSource();
    ensureAnalyser();
    bufferSource = audioCtx.createBufferSource();
    bufferSource.buffer = sampleBuffer;
    bufferSource.connect(analyser);
    bufferSource.connect(sampleGain);
    const off = Math.max(0, Math.min(offset, Math.max(0, sampleDuration - 0.02)));
    sampleOffset = off;
    sampleStartCtxTime = audioCtx.currentTime;
    bufferSource.onended = function () {
      if (mode !== "replay") return;
      sampleOffset = sampleDuration;
      updateScrubUi(true);
      stopReplay(true);
    };
    bufferSource.start(0, off);
  }

  async function startReplay() {
    showErr("");
    ensureAnalyser();
    const id = beginAction();
    replayLoading = true;
    try {
      $replay.classList.add("loading");
      $replay.setAttribute("aria-label", "…");
      if (mode === "live") haltLive();
      await loadSample();
      if (id !== actionId) return;
      ensureAnalyser();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if (id !== actionId) return;
      setSampleGain($unmute.checked);
      resetSmooth();
      resetTune();
      mode = "replay";
      replayLoading = false;
      if (sampleOffset >= sampleDuration - 0.05) sampleOffset = 0;
      startBufferAt(sampleOffset);
      $replay.classList.remove("loading");
      $replay.classList.add("playing");
      $replay.setAttribute("aria-label", "Stop");
      startLoop();
    } catch (e) {
      if (id !== actionId) return;
      replayLoading = false;
      mode = "idle";
      $replay.classList.remove("playing", "loading");
      $replay.setAttribute("aria-label", "Rejouer");
      var msg = e && e.message ? e.message : String(e);
      if (location.protocol === "file:") {
        msg += " — sers web/ : python3 -m http.server 4173 --directory web";
      }
      showErr(msg);
    }
  }

  $btn.addEventListener("click", function () {
    ensureAnalyser();
    if (mode === "live") stopLive();
    else start();
  });

  $replay.addEventListener("click", function () {
    ensureAnalyser();
    if (mode === "replay" || replayLoading) stopReplay(true);
    else startReplay();
  });

  $unmute.addEventListener("change", function () {
    setSampleGain($unmute.checked);
  });

  $autotune.addEventListener("change", function () {
    resetSmooth();
    syncTuneUi();
  });

  $stealth.addEventListener("change", function () {
    applyScene($stealth.checked);
  });

  function onArrangePointer(ev, restart) {
    if (ev.pointerType === "mouse" && ev.buttons !== 1 && ev.type !== "pointerdown") return;
    seekFromClientX(ev.clientX, restart);
  }
  $arrangeLane.addEventListener("pointerdown", function (ev) {
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    scrubbing = true;
    $arrangeLane.setPointerCapture(ev.pointerId);
    onArrangePointer(ev, false);
  });
  $arrangeLane.addEventListener("pointermove", function (ev) {
    if (!scrubbing) return;
    onArrangePointer(ev, "drag");
  });
  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    restartBuffer(true);
  }
  $arrangeLane.addEventListener("pointerup", endScrub);
  $arrangeLane.addEventListener("pointercancel", endScrub);
  $arrange.addEventListener("keydown", function (ev) {
    const dur = sampleDuration || 0;
    if (!dur) return;
    const step = ev.shiftKey ? 5 : 1;
    if (ev.key === "ArrowLeft") {
      sampleOffset = Math.max(0, sampleNow() - step);
    } else if (ev.key === "ArrowRight") {
      sampleOffset = Math.min(dur, sampleNow() + step);
    } else if (ev.key === "Home") {
      sampleOffset = 0;
    } else if (ev.key === "End") {
      sampleOffset = dur;
    } else {
      return;
    }
    ev.preventDefault();
    updateScrubUi(true);
    restartBuffer(true);
  });

  $micAlt.addEventListener("change", function () {
    micOverrideId = $micAlt.value === "os" ? null : $micAlt.value;
    if (mode === "live") {
      acquireStream().catch(function (e) {
        showErr("Micro: " + (e && e.message ? e.message : String(e)));
      });
    }
  });

  function onResize() {
    layoutBlackKeys();
    drawWave();
  }
  if (typeof ResizeObserver === "function") {
    const ro = new ResizeObserver(onResize);
    ro.observe($arrangeLane);
    ro.observe($board);
  }
  window.addEventListener("resize", onResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onResize);
  }

  let lastChipKey = "";

  function restoreIdleLabel(el) {
    const lab = el.querySelector(".name");
    if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
  }

  function clearLights() {
    keys.forEach(function (el) {
      el.classList.remove("on", "harm");
      el.style.removeProperty("--vel");
      el.style.removeProperty("--pop");
      restoreIdleLabel(el);
    });
    $chroma.querySelectorAll(".bar").forEach(function (bar) {
      bar.classList.remove("on");
      bar.firstElementChild.style.transform = "scaleY(0)";
    });
    $chips.innerHTML = "";
    $chips.appendChild($hzLive);
    $hzLive.textContent = "";
    lastChipKey = "";
  }

  function loop() {
    if (mode === "idle" || !analyser) return;
    // Shared FFT peak-picker for live mic AND yesterday's sample replay.
    analyser.getFloatFrequencyData(spec);
    const binHz = audioCtx.sampleRate / analyser.fftSize;
    updateConcertPitch(spec, binHz);
    detectHeard(spec, binHz);
    const mixed = isTous();
    const heardBands = activeMusicians();
    const bands = heardBands.length
      ? heardBands
      : [{ lo: MIXED_LO_HZ, hi: MIXED_HI_HZ }];
    let scanLo = MIXED_HI_HZ;
    let scanHi = MIXED_LO_HZ;
    bands.forEach(function (t) {
      if (t.lo < scanLo) scanLo = t.lo;
      if (t.hi > scanHi) scanHi = t.hi;
    });
    const i0 = Math.max(2, Math.floor(scanLo / binHz));
    const i1 = Math.min(spec.length - 2, Math.ceil(scanHi / binHz));
    const nKeys = MIDI_HI - MIDI_LO + 1;
    const score = new Float32Array(nKeys);
    const scoreHz = new Float32Array(nKeys);
    score.fill(-120);
    const fold = !mixed;

    const peaks = [];
    for (let i = i0; i <= i1; i++) {
      const freq = i * binHz;
      if (!freqInActiveBands(freq)) continue;
      const db = spec[i];
      if (db > spec[i - 1] && db >= spec[i + 1] && db > spec[i - 2] && db >= spec[i + 2]) {
        const denom = spec[i - 1] - 2 * spec[i] + spec[i + 1];
        const delta = denom ? 0.5 * (spec[i - 1] - spec[i + 1]) / denom : 0;
        const pf = (i + delta) * binHz;
        if (freqInActiveBands(pf)) peaks.push({ freq: pf, db: db });
      }
      const midi = midiFromHz(freq, fold);
      if (midi >= MIDI_LO && midi <= MIDI_HI) {
        const idx = midi - MIDI_LO;
        if (db > score[idx]) {
          score[idx] = db;
          scoreHz[idx] = freq;
        }
      }
    }
    peaks.sort(function (a, b) { return b.db - a.db; });
    for (let p = 0; p < peaks.length; p++) {
      const midi = midiFromHz(peaks[p].freq, fold);
      if (midi < MIDI_LO || midi > MIDI_HI) continue;
      const idx = midi - MIDI_LO;
      if (peaks[p].db + 2 > score[idx]) {
        score[idx] = peaks[p].db + 2;
        scoreHz[idx] = peaks[p].freq;
      }
    }

    let loudest = -120;
    for (let i = 0; i < nKeys; i++) {
      smooth[i] = 0.62 * smooth[i] + 0.38 * score[i];
      if (smooth[i] > loudest) loudest = smooth[i];
    }

    const noise = bandNoiseFloor(spec, i0, i1);
    const absGate = Math.max(-78, noise + 12);
    const relDb = 16;
    const gate = Math.max(absGate, loudest - relDb);
    const maxN = $chords.checked ? 8 : 1;

    const candidates = [];
    for (let i = 0; i < nKeys; i++) {
      const s = smooth[i];
      if (s < gate) continue;
      const left = i > 0 ? smooth[i - 1] : -999;
      const right = i < nKeys - 1 ? smooth[i + 1] : -999;
      if (s >= left && s >= right) {
        candidates.push({
          midi: i + MIDI_LO,
          s: s,
          freq: scoreHz[i] || midiToHz(i + MIDI_LO)
        });
      }
    }
    candidates.sort(function (a, b) { return b.s - a.s; });
    const lit = candidates.slice(0, maxN);
    const litSet = {};
    lit.forEach(function (c) { litSet[c.midi] = c; });

    const ghostSet = {};
    lit.forEach(function (c) {
      [c.midi + 12, c.midi - 12, c.midi + 7, c.midi - 7].forEach(function (g) {
        if (g >= MIDI_LO && g <= MIDI_HI && !litSet[g]) ghostSet[g] = true;
      });
    });

    keys.forEach(function (el, midi) {
      const hit = litSet[midi];
      const on = !!hit;
      const harm = !on && !!ghostSet[midi];
      const wasOn = el.classList.contains("on");
      const wasHarm = el.classList.contains("harm");
      el.classList.toggle("on", on);
      el.classList.toggle("harm", harm);
      const lab = el.querySelector(".name");
      if (on) {
        const span = Math.max(6, loudest - gate);
        const vel = Math.max(0.22, Math.min(1, (hit.s - gate) / span));
        el.style.setProperty("--vel", String(vel));
        el.style.setProperty("--pop", Math.round(10 * vel) + "%");
        if (!wasOn) {
          paintEl(el, crayonOf(midi));
          if (lab) lab.textContent = crayonOf(midi).fr + octaveOf(midi);
        }
      } else {
        if (wasOn) {
          el.style.removeProperty("--vel");
          el.style.removeProperty("--pop");
          if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
        }
        if (harm && !wasHarm) paintEl(el, crayonOf(midi));
      }
    });

    const chroma = {};
    NOTE_NAMES.forEach(function (n) { chroma[n] = -120; });
    for (let i = 0; i < nKeys; i++) {
      const name = pcOf(i + MIDI_LO);
      if (smooth[i] > chroma[name]) chroma[name] = smooth[i];
    }
    $chroma.querySelectorAll(".bar").forEach(function (bar) {
      const name = bar.dataset.pc;
      const v = chroma[name];
      const on = v >= gate && lit.some(function (c) { return pcOf(c.midi) === name; });
      bar.classList.toggle("on", on);
      const pct = Math.max(0, Math.min(100, (v - absGate) * 1.8));
      bar.querySelector(".fill").style.height = (on ? Math.max(28, pct) : Math.max(0, pct * 0.25)) + "%";
    });

    const chipKey = lit.map(function (c) { return c.midi; }).sort(function (a, b) { return a - b; }).join(",");
    if (chipKey !== lastChipKey) {
      lastChipKey = chipKey;
      $chips.innerHTML = "";
      if (lit.length) {
        lit.slice().sort(function (a, b) { return a.midi - b.midi; }).forEach(function (c) {
          const info = crayonOf(c.midi);
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.dataset.pc = pcOf(c.midi);
          paintEl(chip, info);
          chip.textContent = info.fr + octaveOf(c.midi);
          $chips.appendChild(chip);
        });
      }
      $chips.appendChild($hzLive);
    }
    if (lit.length) {
      const top = lit[0];
      const info = crayonOf(top.midi);
      const hz = top.freq;
      $hzLive.textContent = String(Math.round(hz));
    } else {
      $hzLive.textContent = "";
    }

    if (mode === "replay") updateScrubUi();

    raf = requestAnimationFrame(loop);
  }

  buildLegend();
  buildKeyboard();
  buildTracks();
  syncTuneUi();
  requestAnimationFrame(function () {
    layoutBlackKeys();
    drawWave();
  });
  fetch(SAMPLE_URL).then(function (res) {
    if (!res.ok) return null;
    return res.arrayBuffer();
  }).then(function (arr) {
    if (!arr) return;
    waveBuf = arr;
    if (!wavePeaks) {
      wavePeaks = wavPeaks(arr, 900);
      drawRuler();
      drawWave();
      updateScrubUi();
    }
  }).catch(function () {});
})();
  </script>
</body>
</html>
