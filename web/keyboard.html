        liveTracks.push(t);
        used.add(t.id);
        born = true;
      }
    });
    liveTracks.forEach(function (t) {
      if (!used.has(t.id)) t.energy *= 0.72;
    });
    liveTracks = liveTracks.filter(function (t) {
      return now - t.lastSeen < CLUSTER_DROP_MS && t.energy >= 0.04;
    });
    selectedTrackIds.forEach(function (id) {
      if (!liveTracks.some(function (t) { return t.id === id; })) selectedTrackIds.delete(id);
    });
    if (born) requestLabels(true);
  }

  function abortAfter(ms) {
    const c = new AbortController();
    setTimeout(function () { try { c.abort(); } catch (_) {} }, ms);
    return c.signal;
  }

  async function probeFm() {
    try {
      const r = await fetch("http://127.0.0.1:4174/health", { signal: abortAfter(400) });
      if (!r.ok) {
        fmAvailable = false;
        return;
      }
      const j = await r.json();
      fmAvailable = Boolean(j && j.fm);
    } catch (_) {
      fmAvailable = false;
    }
  }

  async function requestLabels(force) {
    const now = performance.now();
    if (!force && now - lastLabelAt < LABEL_EVERY_MS) return;
    if (labelBusy || !liveTracks.length) return;
    lastLabelAt = now;
    function applyHeuristic() {
      liveTracks.forEach(function (t) {
        if (!t.label) {
          const h = heuristicName(t);
          if (h) {
            t.label = h;
            t.labelSource = "heuristic";
          }
        }
      });
      syncTrackUi();
    }
    if (fmAvailable === false) {
      applyHeuristic();
      return;
    }
    labelBusy = true;
    const payload = liveTracks.map(function (t) {
      return {
        id: t.id,
        f0: Math.round(t.f0 * 10) / 10,
        bandwidth: 0,
        harmonicity: Math.round(t.harm * 100) / 100,
        duration: (now - t.born) / 1000,
        mag: t.db
      };
    });
    try {
      const r = await fetch(LABEL_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tracks: payload }),
        signal: abortAfter(2500)
      });
      if (!r.ok) throw new Error("label http");
      const j = await r.json();
      fmAvailable = Boolean(j.fm);
      (j.labels || []).forEach(function (row) {
        const t = liveTracks.find(function (x) { return x.id === row.id; });
        if (!t || !row.name) return;
        if (row.source === "fm") {
          t.label = String(row.name).slice(0, 16);
          t.labelSource = "fm";
        } else if (!t.label) {
          t.label = String(row.name).slice(0, 16);
          t.labelSource = "heuristic";
        }
      });
      if (!fmAvailable) applyHeuristic();
      else syncTrackUi();
    } catch (_) {
      fmAvailable = false;
      applyHeuristic();
    } finally {
      labelBusy = false;
    }
  }

  function scanTunePeaks(specArr, binHz) {
    const i0 = Math.max(2, Math.floor(TUNE_LO_HZ / binHz));
    const i1 = Math.min(specArr.length - 2, Math.ceil(TUNE_HI_HZ / binHz));
    const floor = bandNoiseFloor(specArr, i0, i1);
    const minDb = Math.max(-72, floor + 8);
    const peaks = [];
    for (let i = i0; i <= i1; i++) {
      const db = specArr[i];
      if (db < minDb) continue;
      if (db > specArr[i - 1] && db >= specArr[i + 1] && db > specArr[i - 2] && db >= specArr[i + 2]) {
        const denom = specArr[i - 1] - 2 * specArr[i] + specArr[i + 1];
        const delta = denom ? 0.5 * (specArr[i - 1] - specArr[i + 1]) / denom : 0;
        const freq = (i + delta) * binHz;
        if (freq >= TUNE_LO_HZ && freq <= TUNE_HI_HZ) peaks.push({ freq: freq, db: db });
      }
    }
    peaks.sort(function (a, b) { return b.db - a.db; });
    return peaks.slice(0, 16);
  }

  function groupHarmonics(peaks) {
    const byFreq = peaks.slice().sort(function (a, b) { return a.freq - b.freq; });
    const funds = [];
    byFreq.forEach(function (p) {
      let harmonic = false;
      for (let k = 0; k < funds.length; k++) {
        const f0 = funds[k].freq;
        const n = Math.round(p.freq / f0);
        if (n < 2 || n > 8) continue;
        const cents = 1200 * Math.log2(p.freq / (n * f0));
        if (Math.abs(cents) < 35) {
          harmonic = true;
          break;
        }
      }
      if (!harmonic) funds.push(p);
    });
    return funds;
  }

  function syncTuneUi() {
    const cents = 1200 * Math.log2(aEst / A4_REF);
    if (!$autotune.checked) {
      $tuneLine.textContent = "440";
      return;
    }
    if (mode === "idle") {
      $tuneLine.textContent = "440";
      return;
    }
    if (!tuneReady) {
      $tuneLine.textContent = "440";
      return;
    }
    $tuneLine.textContent = String(Math.round(aEst));
  }

  function resetTune() {
    aEst = A4_REF;
    tuneReady = false;
    centsWindow.length = 0;
    syncTuneUi();
  }

  function updateConcertPitch(specArr, binHz) {
    const peaks = scanTunePeaks(specArr, binHz);
    const funds = groupHarmonics(peaks);
    const votes = [];
    funds.forEach(function (p) {
      const midi = Math.round(hzToMidiRef(p.freq, A4_REF));
      const expected = midiToHzRef(midi, A4_REF);
      if (expected <= 0) return;
      const cents = 1200 * Math.log2(p.freq / expected);
      // Nearest 440-Hz MIDI note only unambiguously measures ±50 cents.
      // Wider ranges wrap (e.g. +60 → −40) and pull A the wrong way.
      if (!isFinite(cents) || Math.abs(cents) >= 50) return;
      votes.push(cents);
    });
    if (votes.length >= 1 && audioCtx) {
      const now = audioCtx.currentTime;
      centsWindow.push({ t: now, cents: medianNums(votes) });
      const cut = now - TUNE_WINDOW_S;
      while (centsWindow.length && centsWindow[0].t < cut) centsWindow.shift();
    }
    if (centsWindow.length >= 8) {
      const med = medianNums(centsWindow.map(function (v) { return v.cents; }));
      const clamped = Math.max(-50, Math.min(50, med));
      const target = A4_REF * Math.pow(2, clamped / 1200);
      const alpha = centsWindow.length >= 24 ? 0.12 : 0.05;
      aEst = aEst + alpha * (target - aEst);
      aEst = Math.max(A4_MIN, Math.min(A4_MAX, aEst));
      tuneReady = true;
    }
    syncTuneUi();
  }

  function buildTracks() {
    syncTrackUi();
  }

  function displayTracks() {
    return liveTracks;
  }

  function laneHeight() {
    const n = Math.max(1, displayTracks().length);
    return Math.max(28, Math.min(48, Math.floor(220 / n)));
  }

  function pushTrackHist() {
    const cols = Math.max(64, waveCssW || 320);
    liveTracks.forEach(function (t) {
      if (!t.hist || t.hist.length !== cols) {
        const next = new Float32Array(cols);
        if (t.hist && t.hist.length) {
          const n = Math.min(t.hist.length, cols);
          next.set(t.hist.subarray(t.hist.length - n), cols - n);
        }
        t.hist = next;
      }
      t.hist.copyWithin(0, 1);
      t.hist[t.hist.length - 1] = t.energy;
    });
  }

  function syncArrangeHeads() {
    if (!$arrangeHeads) return;
    const rows = displayTracks();
    const ids = rows.map(function (t) { return String(t.id); }).join(",");
    if ($arrangeHeads.dataset.ids !== ids) {
      $arrangeHeads.dataset.ids = ids;
      $arrangeHeads.innerHTML = "";
      if (!rows.length) {
        const head = document.createElement("div");
        head.className = "arrange-head";
        head.innerHTML = '<span class="arrange-swatch"></span>';
        $arrangeHeads.appendChild(head);
      } else {
        rows.forEach(function (t) {
          const head = document.createElement("button");
          head.type = "button";
          head.className = "arrange-head";
          head.dataset.track = String(t.id);
          const sw = document.createElement("span");
          sw.className = "arrange-swatch";
          head.appendChild(sw);
          const nm = document.createElement("span");
          nm.className = "nm";
          head.appendChild(nm);
          head.addEventListener("click", function () { onTrackClick(t.id); });
          $arrangeHeads.appendChild(head);
        });
      }
    }
    const h = laneHeight();
    const n = Math.max(1, rows.length);
    if ($arrangeLane) $arrangeLane.style.height = (n * h) + "px";
    rows.forEach(function (t) {
      const head = $arrangeHeads.querySelector('[data-track="' + t.id + '"]');
      if (!head) return;
      paintEl(head, CRAYONS[t.pc] || CRAYONS.A);
      head.setAttribute("aria-pressed", String(trackIsOn(t.id)));
      head.classList.toggle("dim", !trackIsOn(t.id));
      const nm = head.querySelector(".nm");
      if (nm) nm.textContent = trackCaption(t);
    });
  }

  function keyLabel(key) {
    if (key.kind === "space") return "";
    if (key.kind !== "char") return key.base;
    return key.base;
  }

  function buildOneBoard(layout) {
    const wrap = document.createElement("div");
    wrap.className = "kb-wrap";
    const title = document.createElement("div");
    title.className = "kb-title";
    title.textContent = layout.id === "us" ? "US" : "Canadien français · CSA";
    wrap.appendChild(title);
    const board = document.createElement("div");
    board.className = "kb-board";
    board.dataset.board = layout.id;
    board.setAttribute("role", "group");
    board.setAttribute("aria-label", layout.nameFr || layout.name);
    layout.keys.forEach(function (key) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = "kb-key" + (key.kind !== "char" && key.kind !== "space" ? " mod" : "");
      el.dataset.board = layout.id;
      el.dataset.kid = key.kid;
      el.style.left = (key.col / 15 * 100) + "%";
      el.style.width = (key.w / 15 * 100) + "%";
      el.style.top = (key.row / 5 * 100) + "%";
      el.style.height = (key.h / 5 * 100) + "%";
      el.style.zIndex = key.h > 1 ? "0" : "1";
      const main = document.createElement("span");
      main.textContent = keyLabel(key) || (key.kind === "space" ? "" : key.base);
      el.appendChild(main);
      if (key.kind === "char" && key.shift && key.shift !== key.base.toUpperCase()) {
        const sub = document.createElement("span");
        sub.className = "sub";
        sub.textContent = key.shift;
        el.appendChild(sub);
      }
      el.setAttribute("aria-label", (key.base || key.kind) + " " + layout.id);
      el.addEventListener("pointerdown", onKbPointerDown);
      board.appendChild(el);
      keyEls.set(layout.id + ":" + key.kid, el);
    });
    wrap.appendChild(board);
    return wrap;
  }

  function buildDualBoards() {
    if (!$dualBoards) return;
    $dualBoards.innerHTML = "";
    keyEls.clear();
    $dualBoards.appendChild(buildOneBoard(DUAL.US));
    $dualBoards.appendChild(buildOneBoard(DUAL.CSA));
    window.addEventListener("pointerup", onKbPointerUp);
    window.addEventListener("pointercancel", onKbPointerUp);
    window.addEventListener("keydown", onHwKeyDown);
    window.addEventListener("keyup", onHwKeyUp);
    if ($typeClear) {
      $typeClear.addEventListener("click", function () {
        typeState.text = "";
        typeState.dead = "";
        renderTypeOut();
      });
    }
  }

  function renderTypeOut() {
    if ($typeOut) $typeOut.textContent = typeState.text;
  }

  function crayonForCluster(index) {
    return CRAYONS[NOTE_NAMES[((index % 12) + 12) % 12]];
  }

  function syncSpatialTracks() {
    const groups = fingerGate.clusters();
    const now = performance.now();
    const next = [];
    groups.forEach(function (members, i) {
      const pts = members.map(function (h) {
        return DUAL.center(DUAL.LAYOUTS[h.board], DUAL.keyById(DUAL.LAYOUTS[h.board], h.kid));
      });
      const cx = pts.reduce(function (s, p) { return s + p[0]; }, 0) / pts.length;
      const glyphs = members.map(function (h) {
        const key = DUAL.keyById(DUAL.LAYOUTS[h.board], h.kid);
        return key ? (key.base || key.kind) : "";
      }).join("");
      let found = liveTracks.find(function (t) {
        return t.spatial && Math.abs(t.cx - cx) < 1.4;
      });
      if (!found) {
        found = {
          id: nextTrackId++,
          f0: 110 * Math.pow(2, (cx % 12) / 12),
          db: -12,
          harm: 0.4,
          energy: 1,
          lastSeen: now,
          born: now,
          pc: NOTE_NAMES[i % 12],
          label: glyphs,
          labelSource: "keys",
          hist: null,
          spatial: true,
          cx: cx
        };
      } else {
        found.cx = found.cx * 0.5 + cx * 0.5;
        found.energy = 1;
        found.lastSeen = now;
        found.label = glyphs;
        found.pc = NOTE_NAMES[i % 12];
      }
      next.push(found);
    });
    if (mode === "idle") {
      liveTracks = next;
      selectedTrackIds.forEach(function (id) {
        if (!liveTracks.some(function (t) { return t.id === id; })) selectedTrackIds.delete(id);
      });
      syncTrackUi();
      pushTrackHist();
      drawWave(true);
    }
    paintDualKeys();
  }

  function paintDualKeys() {
    const groups = fingerGate.clusters();
    const heldAt = new Map();
    groups.forEach(function (members, i) {
      members.forEach(function (h) {
        heldAt.set(h.board + ":" + h.kid, i);
      });
    });
    keyEls.forEach(function (el, id) {
      const idx = heldAt.get(id);
      const on = idx != null;
      el.classList.toggle("on", on);
      if (on) {
        const crayon = crayonForCluster(idx);
        paintEl(el, crayon);
        const track = liveTracks[idx];
        el.classList.toggle("off", track ? !trackIsOn(track.id) : false);
      } else {
        el.style.removeProperty("--crayon");
      }
    });
  }

  function renderKbMeta() {
    if (!$kbMeta) return;
    const n = fingerGate.held().length;
    const g = fingerGate.clusters().length;
    const nt = n <= 1 ? n + " touche" : n + " touches";
    const ng = g <= 1 ? g + " groupe" : g + " groupes";
    $kbMeta.textContent = nt + " · " + ng;
  }

  function applyTyped(board, kid) {
    const layout = DUAL.LAYOUTS[board];
    const key = DUAL.keyById(layout, kid);
    if (!key) return;
    typeState.apply(key);
    renderTypeOut();
  }

  function releaseTyped(board, kid) {
    const layout = DUAL.LAYOUTS[board];
    const key = DUAL.keyById(layout, kid);
    if (!key) return;
    typeState.release(key);
  }

  function onKbPointerDown(ev) {
    ev.preventDefault();
    const el = ev.currentTarget;
    el.setPointerCapture(ev.pointerId);
    activeBoard = el.dataset.board;
    const key = { board: el.dataset.board, kid: el.dataset.kid };
    const already = fingerGate.held().some(function (h) { return DUAL.sameHeld(h, key); });
    const ok = fingerGate.down(ev.pointerId, key);
    el.classList.toggle("blocked", !ok);
    if (!ok) return;
    if (!already) applyTyped(key.board, key.kid);
    syncSpatialTracks();
    renderKbMeta();
  }

  function onKbPointerUp(ev) {
    const prev = fingerGate.pointers.get(ev.pointerId);
    if (prev) releaseTyped(prev.board, prev.kid);
    fingerGate.up(ev.pointerId);
    syncSpatialTracks();
    renderKbMeta();
  }

  function onHwKeyDown(ev) {
    if (ev.repeat) return;
    if (ev.metaKey || ev.ctrlKey) return;
    const layout = DUAL.LAYOUTS[activeBoard] || DUAL.US;
    const key = DUAL.keyByCode(layout, ev.code);
    if (!key) return;
    ev.preventDefault();
    const held = { board: layout.id, kid: key.kid };
    const already = fingerGate.held().some(function (h) { return DUAL.sameHeld(h, held); });
    if (!fingerGate.down("hw-" + ev.code, held)) return;
    if (!already) applyTyped(layout.id, key.kid);
    syncSpatialTracks();
    renderKbMeta();
  }

  function onHwKeyUp(ev) {
    const layout = DUAL.LAYOUTS[activeBoard] || DUAL.US;
    const key = DUAL.keyByCode(layout, ev.code);
    if (key) releaseTyped(layout.id, key.kid);
    fingerGate.up("hw-" + ev.code);
    syncSpatialTracks();
    renderKbMeta();
  }

  function buildLegend() {
    NOTE_NAMES.forEach(function (name) {
      const c = CRAYONS[name];
      const el = document.createElement("div");
      el.className = "pencil";
      el.dataset.pc = name;
      el.dataset.rgb = c.rgb.join(",");
      el.title = c.fr + " · " + c.pencil;
      paintEl(el, c);
      el.innerHTML = '<div class="fr">' + c.fr + "</div>";
      $pencils.appendChild(el);

      const bar = document.createElement("div");
      bar.className = "bar";
      bar.dataset.pc = name;
      bar.dataset.i = String(NOTE_NAMES.indexOf(name));
      paintEl(bar, c);
      bar.innerHTML = '<div class="fill"></div><div class="lab">' + c.fr + "</div>";
      $chroma.appendChild(bar);
    });
    chromaBars = Array.prototype.slice.call($chroma.children);
  }

  function buildKeyboard() {
    let whiteCount = 0;
    for (let m = MIDI_LO; m <= MIDI_HI; m++) {
      if (!BLACK[m % 12]) whiteCount++;
    }
    let wi = 0;
    for (let m = MIDI_LO; m <= MIDI_HI; m++) {
      const pc = m % 12;
      const info = crayonOf(m);
      const el = document.createElement("button");
      el.type = "button";
      el.className = "key " + (BLACK[pc] ? "black" : "white");
      el.dataset.midi = String(m);
      el.setAttribute("aria-label", info.fr + octaveOf(m) + " / " + pcOf(m) + octaveOf(m));
      const lab = document.createElement("span");
      lab.className = "name";
      if (BLACK[pc]) {
        lab.textContent = "♯";
        el.dataset.after = String(wi - 1);
      } else {
        lab.textContent = pc === 0 ? info.fr + octaveOf(m) : info.fr;
        el.dataset.whiteIndex = String(wi);
        wi += 1;
      }
      el.appendChild(lab);
      el.dataset.idleName = lab.textContent;
      el.addEventListener("pointerdown", function (ev) {
        ev.preventDefault();
        el.setPointerCapture(ev.pointerId);
        startHeldKey(m);
        el.classList.add("on");
        paintEl(el, crayonOf(m));
      });
      el.addEventListener("pointerup", function () { stopHeldKey(m); });
      el.addEventListener("pointercancel", function () { stopHeldKey(m); });
      $board.appendChild(el);
      keys.set(m, el);
    }
    layoutBlackKeys();
  }

  function layoutBlackKeys() {
    const whites = $board.querySelectorAll(".white");
    if (!whites.length) return;
    const totalWhite = whites.length;
    whites.forEach(function (el, i) {
      el.style.left = (i * 100 / totalWhite) + "%";
      el.style.width = (100 / totalWhite) + "%";
    });
    const boardW = $board.getBoundingClientRect().width;
    if (!boardW) return;
    const w = boardW / totalWhite;
    const blackW = w * 0.62;
    $board.querySelectorAll(".black").forEach(function (el) {
      const after = Number(el.dataset.after);
      if (after < 0 || after >= totalWhite) return;
      const left = (after + 1) * w - blackW / 2;
      el.style.left = left + "px";
      el.style.width = blackW + "px";
    });
  }

  let studyMidi = null;
  function previewKey(midi) {
    if (studyMidi !== null && keys.get(studyMidi)) {
      keys.get(studyMidi).classList.remove("study");
    }
    studyMidi = midi;
    const el = keys.get(midi);
    const c = crayonOf(midi);
    el.classList.add("study", "on");
    paintEl(el, c);
    const nameEl = el.querySelector(".name");
    if (nameEl) nameEl.textContent = c.fr + octaveOf(midi);
    $hzLive.textContent = String(Math.round(midiToHz(midi)));
    setTimeout(function () {
      if (mode === "idle") {
        el.classList.remove("on");
        const lab = el.querySelector(".name");
        if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
      }
    }, 700);
  }

  function showErr(msg) {
    $err.hidden = !msg;
    $err.textContent = msg || "";
  }

  function stripDefaultPrefix(label) {
    return String(label || "")
      .replace(/^(Default|Par défaut|Défaut)\s*[-–:]\s*/i, "")
      .trim();
  }

  async function listInputs() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    return devices.filter(function (d) { return d.kind === "audioinput"; });
  }

  function pickOsDefault(inputs) {
    return inputs.find(function (d) { return d.deviceId === "default"; })
      || inputs.find(function (d) { return /default|par défaut|défaut/i.test(d.label); })
      || null;
  }

  function fillMicList(inputs) {
    const keep = micOverrideId || "os";
    $micAlt.innerHTML = "";
    const osOpt = document.createElement("option");
    osOpt.value = "os";
    const def = pickOsDefault(inputs);
    osOpt.textContent = def && def.label
      ? "OS — " + stripDefaultPrefix(def.label)
      : "OS";
    $micAlt.appendChild(osOpt);
    inputs.forEach(function (d) {
      if (d.deviceId === "default") return;
      const opt = document.createElement("option");
      opt.value = d.deviceId;
      opt.textContent = d.label || d.deviceId.slice(0, 8);
      $micAlt.appendChild(opt);
    });
    $micAlt.value = keep === "os" || !keep ? "os" : keep;
    if ($micAlt.value !== keep && keep !== "os") $micAlt.value = "os";
  }

  async function updateMicStatus() {
    const inputs = await listInputs();
    fillMicList(inputs);
  }

  const AUDIO_EXTRAS = {
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false
  };

  async function requestMicStream() {
    if (micOverrideId) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: Object.assign({}, AUDIO_EXTRAS, { deviceId: { exact: micOverrideId } })
        });
      } catch (_) {
        micOverrideId = null;
        $micAlt.value = "os";
      }
    }
    try {
      return await navigator.mediaDevices.getUserMedia({ audio: AUDIO_EXTRAS });
    } catch (_) {
      try {
        return await navigator.mediaDevices.getUserMedia({
          audio: Object.assign({}, AUDIO_EXTRAS, { deviceId: { ideal: "default" } })
        });
      } catch (__) {
        return await navigator.mediaDevices.getUserMedia({ audio: true });
      }
    }
  }

  function stopTracks() {
    if (sourceNode) {
      try { sourceNode.disconnect(); } catch (_) {}
      sourceNode = null;
    }
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
  }

  function ensureAnalyser() {
    if (!audioCtx || audioCtx.state === "closed") {
      audioCtx = new AudioContext();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
    if (!analyser) {
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 16384;
      analyser.smoothingTimeConstant = 0.78;
      analyser.minDecibels = -95;
      analyser.maxDecibels = -18;
      spec = new Float32Array(analyser.frequencyBinCount);
    }
    if (!sampleGain) {
      sampleGain = audioCtx.createGain();
      sampleGain.gain.value = $unmute.checked ? 0.28 : 0;
      sampleGain.connect(audioCtx.destination);
    }
  }

  function setSampleGain(on) {
    if (!sampleGain || !audioCtx) return;
    const dest = on ? 0.28 : 0;
    const g = sampleGain.gain;
    const now = audioCtx.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(dest, now + 0.018);
  }

  function resetSmooth() {
    smooth.fill(-120);
  }

  function fmtTime(s) {
    const t = Math.max(0, s || 0);
    const m = Math.floor(t / 60);
    const sec = Math.floor(t - m * 60);
    return m + ":" + String(sec).padStart(2, "0");
  }

  function targetRatio() {
    if (mode === "live" || (mode === "idle" && liveTracks.some(function (t) { return t.spatial; }))) {
      return 0.92;
    }
    const dur = sampleDuration || 0;
    const t = scrubbing ? sampleOffset : sampleNow();
    return dur > 0 ? Math.max(0, Math.min(1, t / dur)) : 0;
  }

  function paintPlayhead(snap) {
    const target = targetRatio();
    if (snap || scrubbing || reduceMotion) playheadShown = target;
    else {
      playheadShown += (target - playheadShown) * 0.32;
      if (Math.abs(target - playheadShown) < 0.0005) playheadShown = target;
    }
    $playhead.style.transform = "translate3d(" + (playheadShown * (waveCssW || 1)) + "px,0,0)";
  }

  function restartBuffer(force) {
    if (mode !== "replay" || !sampleBuffer) return;
    const now = performance.now();
    if (!force && now - lastRestartMs < 72) return;
    lastRestartMs = now;
    startBufferAt(sampleOffset);
  }

  function seekFromClientX(clientX, restart) {
    const rect = $arrangeLane.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
    const dur = sampleDuration || 0;
    sampleOffset = dur * x;
    updateScrubUi(true);
    if (restart === "now") restartBuffer(true);
    else if (restart === "drag") restartBuffer(false);
  }

  function drawRuler() {
    const dur = sampleDuration || 0;
    $ruler.innerHTML = "";
    if (dur <= 0) return;
    const step = dur > 60 ? 15 : 10;
    for (let s = 0; s <= dur + 0.01; s += step) {
      const el = document.createElement("span");
      el.textContent = fmtTime(s);
      el.style.left = (100 * s / dur) + "%";
      $ruler.appendChild(el);
    }
  }

  function drawWave(force) {
    const canvas = $wave;
    const lane = $arrangeLane;
    const rows = displayTracks();
    const n = Math.max(1, rows.length);
    const cssW = Math.max(1, Math.floor(lane.clientWidth || 320));
    const laneH = laneHeight();
    const cssH = n * laneH;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const scheme = document.documentElement.getAttribute("data-scheme") || "dark";
    const themeName = document.documentElement.getAttribute("data-theme") || "stealth";
    const ids = rows.map(function (t) { return t.id; }).join(",");
    const key = cssW + "x" + cssH + "x" + dpr + themeName + ":" + ids + ":" + (wavePeaks ? wavePeaks.length : 0);
    waveCssW = cssW;
    if (!force && key === waveDrawnKey) {
      paintPlayhead(true);
      return;
    }
    waveDrawnKey = key;
    const pxW = Math.round(cssW * dpr);
    const pxH = Math.round(cssH * dpr);
    if (canvas.width !== pxW) canvas.width = pxW;
    if (canvas.height !== pxH) canvas.height = pxH;
    canvas.style.height = cssH + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bed = getComputedStyle(document.documentElement).getPropertyValue("--wave-bed").trim() || (scheme === "dark" ? "#16161a" : "#ebe4d8");
    ctx.fillStyle = bed;
    ctx.fillRect(0, 0, cssW, cssH);
    if (!rows.length) {
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--wave-grid").trim() || "rgba(255,255,255,0.04)";
      ctx.fillRect(0, cssH / 2 - 0.5, cssW, 1);
      if (wavePeaks && wavePeaks.length) {
        const mid = cssH / 2;
        const amp = cssH * 0.42;
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--replay").trim() || "rgb(72, 72, 153)";
        for (let x = 0; x < cssW; x++) {
          const i = Math.min(wavePeaks.length - 1, Math.floor(x / cssW * wavePeaks.length));
          const h = Math.max(1, wavePeaks[i] * amp);
          ctx.fillRect(x, mid - h, 1, h * 2);
        }
      }
      paintPlayhead(true);
      return;
    }
    rows.forEach(function (t, i) {
      const y0 = i * laneH;
      const mid = y0 + laneH / 2;
      const amp = laneH * 0.42;
      const crayon = CRAYONS[t.pc] || CRAYONS.A;
      const dim = !trackIsOn(t.id);
      ctx.fillStyle = dim ? "rgba(128,128,128,0.12)" : "rgba(255,255,255,0.03)";
      ctx.fillRect(0, y0, cssW, laneH);
      ctx.fillStyle = "rgba(128,128,128,0.2)";
      ctx.fillRect(0, mid, cssW, 1);
      const hist = t.hist;
      ctx.fillStyle = "rgba(" + crayon.rgb[0] + "," + crayon.rgb[1] + "," + crayon.rgb[2] + "," + (dim ? "0.28" : "0.9") + ")";
      if (hist && hist.length) {
        for (let x = 0; x < cssW; x++) {
          const hi = Math.min(hist.length - 1, Math.floor(x / cssW * hist.length));
          const h = Math.max(1, hist[hi] * amp);
          ctx.fillRect(x, mid - h, 1, h * 2);
        }
      }
    });
    paintPlayhead(true);
  }

  function wavPeaks(buf, bins) {
    const v = new DataView(buf);
    if (v.byteLength < 44) return null;
    let o = 12;
    let dataOff = 44;
    let dataLen = v.byteLength - 44;
    let rate = 48000;
    while (o + 8 <= v.byteLength) {
      const id = String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
      const sz = v.getUint32(o + 4, true);
      if (id === "fmt ") rate = v.getUint32(o + 12, true) || rate;
      if (id === "data") {
        dataOff = o + 8;
        dataLen = sz;
        break;
      }
      o += 8 + sz + (sz % 2);
    }
    const samples = Math.floor(dataLen / 2);
    if (samples < 8) return null;
    if (!sampleDuration) sampleDuration = samples / rate;
    const peaks = new Float32Array(bins);
    const step = samples / bins;
    for (let i = 0; i < bins; i++) {
      const a = dataOff + Math.floor(i * step) * 2;
      const b = dataOff + Math.floor((i + 1) * step) * 2;
      let m = 0;
      for (let p = a; p < b; p += 2) {
        if (p + 1 >= dataOff + dataLen) break;
        const s = Math.abs(v.getInt16(p, true)) / 32768;
        if (s > m) m = s;
      }
      peaks[i] = m;
    }
    return peaks;
  }

  function updateScrubUi(snap) {
    paintPlayhead(!!snap);
    const t = scrubbing ? sampleOffset : sampleNow();
    const dur = sampleDuration || 0;
    const text = fmtTime(t);
    if (text !== lastClockText) {
      lastClockText = text;
      $clock.textContent = text;
    }
    const sec = Math.round(t);
    if (snap || sec !== lastAriaSec) {
      lastAriaSec = sec;
      $arrange.setAttribute("aria-valuemax", String(Math.round(dur)));
      $arrange.setAttribute("aria-valuenow", String(sec));
      $arrange.setAttribute("aria-valuetext", text);
    }
  }

  function sizeSpecCanvas() {
    if (!$spec) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = $spec.getBoundingClientRect();
    const w = Math.max(240, Math.floor(rect.width * dpr));
    const h = Math.max(160, Math.floor(rect.height * dpr));
    const key = w + "x" + h;
    if (specSizeKey === key) return;
    specSizeKey = key;
    $spec.width = w;
    $spec.height = h;
  }

  function specXOf(f, padL, plotW) {
    const t = (Math.log2(Math.max(f, SPEC_F_LO)) - Math.log2(SPEC_F_LO)) / (Math.log2(SPEC_F_HI) - Math.log2(SPEC_F_LO));
    return padL + Math.max(0, Math.min(1, t)) * plotW;
  }

  function specYOfDb(db, padT, plotH) {
    const t = (db - SPEC_DB_LO) / (SPEC_DB_HI - SPEC_DB_LO);
    return padT + plotH - Math.max(0, Math.min(1, t)) * plotH;
  }

  function drawSpecPlot(clusters) {
    if (!$spec) return;
    sizeSpecCanvas();
    const ctx = $spec.getContext("2d");
    const width = $spec.width;
    const height = $spec.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--wave-bed").trim() || "#16161a";
    ctx.fillRect(0, 0, width, height);
    const padL = 36 * dpr;
    const padR = 10 * dpr;
    const padT = 20 * dpr;
    const padB = 26 * dpr;
    const plotW = Math.max(8, width - padL - padR);
    const plotH = Math.max(8, height - padT - padB);
    ctx.strokeStyle = "rgba(148,163,184,0.16)";
    ctx.lineWidth = Math.max(1, dpr * 0.5);
    ctx.font = 9 * dpr + "px ui-monospace, Menlo, monospace";
    ctx.fillStyle = "#94a3b8";
    ctx.textBaseline = "middle";
    [-90, -60, -30, 0].forEach(function (db) {
      const y = specYOfDb(db, padT, plotH);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
      ctx.textAlign = "right";
      ctx.fillText(String(db), padL - 4 * dpr, y);
    });
    ctx.textAlign = "center";
    ctx.fillText("dBFS", 16 * dpr, padT - 8 * dpr);
    [
      [27.5, "27.5"], [55, "55"], [110, "110"], [220, "220"],
      [440, "440"], [880, "880"], [1760, "1.76k"], [3520, "3.5k"]
    ].forEach(function (row) {
      const x = specXOf(row[0], padL, plotW);
      const mark = row[0] === 440;
      ctx.beginPath();
      ctx.strokeStyle = mark ? "rgba(248,250,252,0.4)" : "rgba(148,163,184,0.12)";
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
      ctx.fillStyle = mark ? "#e2e8f0" : "#94a3b8";
      ctx.textBaseline = "top";
      ctx.fillText(row[1], x, padT + plotH + 4 * dpr);
    });
    ctx.fillStyle = "#94a3b8";
    ctx.textAlign = "right";
    ctx.fillText("Hz", width - 6 * dpr, padT + plotH + 4 * dpr);

    if (spec && analyser && audioCtx) {
      const binHz = audioCtx.sampleRate / analyser.fftSize;
      const i0 = Math.max(1, Math.floor(SPEC_F_LO / binHz));
      const i1 = Math.min(spec.length - 1, Math.ceil(SPEC_F_HI / binHz));
      if (i1 > i0) {
        ctx.beginPath();
        ctx.moveTo(specXOf(i0 * binHz, padL, plotW), padT + plotH);
        for (let i = i0; i <= i1; i++) {
          ctx.lineTo(specXOf(i * binHz, padL, plotW), specYOfDb(spec[i], padT, plotH));
        }
        ctx.lineTo(specXOf(i1 * binHz, padL, plotW), padT + plotH);
        ctx.closePath();
        ctx.fillStyle = "rgba(45, 212, 191, 0.28)";
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(specXOf(i0 * binHz, padL, plotW), specYOfDb(spec[i0], padT, plotH));
        for (let i = i0; i <= i1; i++) {
          ctx.lineTo(specXOf(i * binHz, padL, plotW), specYOfDb(spec[i], padT, plotH));
        }
        ctx.strokeStyle = "rgba(45, 212, 191, 0.85)";
        ctx.lineWidth = Math.max(1.1, dpr);
        ctx.stroke();
      }
    }

    const marks = clusters || [];
    marks.forEach(function (c) {
      const f = c.f0 || c.f || c.freq;
      if (!f) return;
      const db = typeof c.db === "number" ? c.db : -24;
      const x = specXOf(f, padL, plotW);
      const y = specYOfDb(db, padT, plotH);
      const info = crayonOf(Math.round(69 + 12 * Math.log2(f / 440)));
      ctx.fillStyle = rgbCss(info.rgb);
      ctx.beginPath();
      ctx.arc(x, y, 4.5 * dpr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(248,250,252,0.7)";
      ctx.lineWidth = Math.max(1, dpr * 0.6);
      ctx.stroke();
    });
    heldVoices.forEach(function (_v, midi) {
      const f = midiToHz(midi);
      const x = specXOf(f, padL, plotW);
      const y = specYOfDb(-18, padT, plotH);
      ctx.strokeStyle = rgbCss(crayonOf(midi).rgb);
      ctx.beginPath();
      ctx.moveTo(x, padT + plotH);
      ctx.lineTo(x, y);
      ctx.lineWidth = Math.max(1, dpr);
      ctx.stroke();
    });
    if (marks.length) {
      ctx.fillStyle = "#e2e8f0";
      ctx.font = "600 " + 11 * dpr + "px ui-sans-serif, system-ui, sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const f0 = marks[0].f0 || marks[0].f;
      ctx.fillText(Math.round(f0) + " Hz · " + marks.length, padL + 6 * dpr, 6 * dpr);
    }
  }

  function ensureKeyBus() {
    ensureAnalyser();
    if (!audioCtx) return null;
    if (!window._keyMix) {
      const mix = audioCtx.createGain();
      mix.gain.value = 0.2;
      mix.connect(analyser);
      const hear = audioCtx.createGain();
      hear.gain.value = $unmute.checked ? 0.18 : 0;
      mix.connect(hear);
      hear.connect(audioCtx.destination);
      window._keyMix = mix;
      window._keyHear = hear;
    }
    if (window._keyHear) window._keyHear.gain.value = $unmute.checked ? 0.18 : 0;
    return window._keyMix;
  }

  function startHeldKey(midi) {
    if (heldVoices.has(midi)) return;
    const mix = ensureKeyBus();
    if (!mix) return;
    if (heldVoices.size >= 96) {
      const oldest = heldVoices.keys().next().value;
      stopHeldKey(oldest);
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = midiToHz(midi);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.012);
    osc.connect(gain);
    gain.connect(mix);
    osc.start();
    heldVoices.set(midi, { osc: osc, gain: gain });
    startLoop();
  }

  function stopHeldKey(midi) {
    const v = heldVoices.get(midi);
    if (!v) return;
    heldVoices.delete(midi);
    const now = audioCtx ? audioCtx.currentTime : 0;
    try {
      v.gain.gain.cancelScheduledValues(now);
      v.gain.gain.setValueAtTime(v.gain.gain.value, now);
      v.gain.gain.linearRampToValueAtTime(0, now + 0.06);
      v.osc.stop(now + 0.07);
    } catch (e) { /* already stopped */ }
  }

  function stopLoop() {
    loopOn = false;
    if (raf) {
      cancelAnimationFrame(raf);
      raf = 0;
    }
  }

  function startLoop() {
    if (loopOn) return;
    loopOn = true;
    raf = requestAnimationFrame(loop);
  }

  function sampleNow() {
    if (mode !== "replay" || !bufferSource || !audioCtx) return sampleOffset;
    return Math.min(sampleDuration, sampleOffset + (audioCtx.currentTime - sampleStartCtxTime));
  }

  function stopBufferSource() {
    if (!bufferSource) return;
    try { bufferSource.onended = null; } catch (_) {}
    try { bufferSource.stop(); } catch (_) {}
    try { bufferSource.disconnect(); } catch (_) {}
    bufferSource = null;
  }

  function beginAction() {
    actionId += 1;
    return actionId;
  }

  function stopLateStream(late) {
    if (!late) return;
    late.getTracks().forEach(function (t) { t.stop(); });
  }

  function haltLive() {
    mode = "idle";
    stopLoop();
    stopTracks();
    $btn.classList.remove("live");
    $btn.setAttribute("aria-label", captureKind === "phones" ? "Écouter" : "Écouter");
    resetTracks();
    clearLights();
    resetTune();
  }

  function haltReplay(keepScrub) {
    replayLoading = false;
    if (mode === "replay") {
      sampleOffset = keepScrub ? sampleNow() : 0;
    }
    stopBufferSource();
    if (mode === "replay") mode = "idle";
    stopLoop();
    $replay.classList.remove("playing", "loading");
    $replay.setAttribute("aria-label", "Rejouer");
    if (mode === "idle") {
      resetTracks();
      clearLights();
      resetTune();
      if (!keepScrub) {
        sampleOffset = 0;
      }
      updateScrubUi(true);
    }
  }

  function looksLoopback(label) {
    return /blackhole|loopback|soundflower|vb-?audio|cable|stereo mix|stereo out|aggregate|multi-output|wave link|groundcontrol/i.test(label || "");
  }

  function canShareTabAudio() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return false;
    if (location.protocol === "file:") return false;
    const ua = navigator.userAgent || "";
    const isiOS = /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    return !isiOS;
  }

  function setCaptureKind(kind) {
    captureKind = kind;
    $btn.classList.toggle("phones", kind === "phones");
    $btn.classList.toggle("mic", kind === "mic");
    if (!$btn.classList.contains("live")) {
      $btn.setAttribute("aria-label", kind === "phones" ? "Écouter" : "Écouter");
    }
  }

  function audioOnlyStream(mediaStream) {
    const audioTracks = mediaStream.getAudioTracks();
    mediaStream.getVideoTracks().forEach(function (t) { t.stop(); });
    if (!audioTracks.length) {
      mediaStream.getTracks().forEach(function (t) { t.stop(); });
      throw new Error("Pas d'audio partagé");
    }
    return new MediaStream(audioTracks);
  }

  async function requestDisplayAudio() {
    let mediaStream = null;
    try {
      mediaStream = await navigator.mediaDevices.getDisplayMedia({
        audio: Object.assign({}, AUDIO_EXTRAS),
        video: false
      });
    } catch (firstErr) {
      try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({
          audio: true,
          video: true,
          preferCurrentTab: true
        });
      } catch (_) {
        throw firstErr;
      }
    }
    return audioOnlyStream(mediaStream);
  }

  async function osDefaultIsLoopback() {
    try {
      const inputs = await listInputs();
      if (micOverrideId) {
        const hit = inputs.find(function (d) { return d.deviceId === micOverrideId; });
        if (hit && looksLoopback(hit.label)) return true;
        return false;
      }
      const def = pickOsDefault(inputs);
      return Boolean(def && looksLoopback(def.label));
    } catch (_) {
      return false;
    }
  }

  async function acquireStream() {
    const id = actionId;
    while (reopenBusy) {
      await new Promise(function (resolve) { setTimeout(resolve, 30); });
      if (id !== actionId || mode !== "live") return;
    }
    reopenBusy = true;
    try {
      stopTracks();
      let next = null;
      let kind = "mic";
      const forceMic = Boolean(micOverrideId);
      if (!forceMic && await osDefaultIsLoopback()) {
        next = await requestMicStream();
        kind = "phones";
      } else if (!forceMic && canShareTabAudio()) {
        try {
          next = await requestDisplayAudio();
          kind = "phones";
        } catch (_) {
          next = await requestMicStream();
          kind = "mic";
        }
      } else {
        next = await requestMicStream();
        kind = "mic";
      }
      if (id !== actionId || mode !== "live") {
        stopLateStream(next);
        return;
      }
      stream = next;
      ensureAnalyser();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if (id !== actionId || mode !== "live") {
        stopTracks();
        return;
      }
      sourceNode = audioCtx.createMediaStreamSource(stream);
      sourceNode.connect(analyser);
      stream.getAudioTracks().forEach(function (t) {
        t.addEventListener("ended", function () {
          if (mode === "live") stopLive();
        });
      });
      setCaptureKind(kind);
      await updateMicStatus();
      if (id !== actionId || mode !== "live") {
        stopTracks();
        return;
      }
      showErr("");
    } finally {
      reopenBusy = false;
    }
  }

  function onDeviceChange() {
    if (mode !== "live") return;
    if (captureKind === "phones") return;
    clearTimeout(deviceChangeTimer);
    deviceChangeTimer = setTimeout(function () {
      acquireStream().then(function () {
        if (mode !== "live") return;
      }).catch(function (e) {
        showErr("Micro: " + (e && e.message ? e.message : String(e)));
      });
    }, 280);
  }

  function bindDeviceChange() {
    if (deviceChangeBound || !navigator.mediaDevices) return;
    navigator.mediaDevices.addEventListener("devicechange", onDeviceChange);
    deviceChangeBound = true;
  }

  async function start() {
    showErr("");
    ensureAnalyser();
    if (!navigator.mediaDevices || (!navigator.mediaDevices.getUserMedia && !navigator.mediaDevices.getDisplayMedia)) {
      showErr("Pas d'audio navigateur. Ouvre Chrome ou Safari.");
      return;
    }
    const id = beginAction();
    try {
      if (mode === "replay" || replayLoading) haltReplay(true);
      mode = "live";
      resetSmooth();
      resetTune();
      resetTracks();
      await acquireStream();
      if (id !== actionId || mode !== "live" || !stream) return;
      bindDeviceChange();
      $btn.classList.add("live");
      $btn.setAttribute("aria-label", "Stop");
      startLoop();
    } catch (e) {
      if (id !== actionId) return;
      haltLive();
      var denied = e && (e.name === "NotAllowedError" || e.name === "PermissionDeniedError");
      var msg = denied
        ? (canShareTabAudio() ? "Partage l'audio de l'onglet, ou autorise le micro." : "Autorise le micro.")
        : (e && e.message ? e.message : String(e));
      if (location.protocol === "file:") {
        msg += " Chrome bloque souvent file:// — ouvre via: python3 -m http.server 4173 --directory web";
      }
      showErr(msg);
    }
  }

  function stopLive() {
    beginAction();
    haltLive();
  }

  function stopReplay(keepScrub) {
    beginAction();
    haltReplay(keepScrub);
  }

  async function loadSample() {
    if (sampleBuffer) return sampleBuffer;
    if (sampleLoad) return sampleLoad;
    sampleLoad = (async function () {
      let arr = waveBuf;
      if (!arr) {
        const res = await fetch(SAMPLE_URL);
        if (!res.ok) {
          throw new Error(
            "WAV introuvable / Sample missing (" + res.status + "): " + SAMPLE_URL +
            " — from repo root: cp captures/final_song.wav web/samples/final_song.wav"
          );
        }
        arr = await res.arrayBuffer();
        waveBuf = arr;
      }
      if (!wavePeaks) {
        wavePeaks = wavPeaks(arr, 900);
        drawRuler();
        drawWave();
      }
      ensureAnalyser();
      sampleBuffer = await audioCtx.decodeAudioData(arr.slice(0));
      sampleDuration = sampleBuffer.duration;
      updateScrubUi(true);
      return sampleBuffer;
    })();
    try {
      return await sampleLoad;
    } catch (e) {
      sampleLoad = null;
      throw e;
    }
  }

  function startBufferAt(offset) {
    stopBufferSource();
    ensureAnalyser();
    bufferSource = audioCtx.createBufferSource();
    bufferSource.buffer = sampleBuffer;
    bufferSource.connect(analyser);
    bufferSource.connect(sampleGain);
    const off = Math.max(0, Math.min(offset, Math.max(0, sampleDuration - 0.02)));
    sampleOffset = off;
    sampleStartCtxTime = audioCtx.currentTime;
    bufferSource.onended = function () {
      if (mode !== "replay") return;
      sampleOffset = sampleDuration;
      updateScrubUi(true);
      stopReplay(true);
    };
    bufferSource.start(0, off);
  }

  async function startReplay() {
    showErr("");
    ensureAnalyser();
    const id = beginAction();
    replayLoading = true;
    try {
      $replay.classList.add("loading");
      $replay.setAttribute("aria-label", "…");
      if (mode === "live") haltLive();
      await loadSample();
      if (id !== actionId) return;
      ensureAnalyser();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if (id !== actionId) return;
      setSampleGain($unmute.checked);
      resetSmooth();
      resetTune();
      mode = "replay";
      replayLoading = false;
      if (sampleOffset >= sampleDuration - 0.05) sampleOffset = 0;
      startBufferAt(sampleOffset);
      $replay.classList.remove("loading");
      $replay.classList.add("playing");
      $replay.setAttribute("aria-label", "Stop");
      startLoop();
    } catch (e) {
      if (id !== actionId) return;
      replayLoading = false;
      mode = "idle";
      $replay.classList.remove("playing", "loading");
      $replay.setAttribute("aria-label", "Rejouer");
      var msg = e && e.message ? e.message : String(e);
      if (location.protocol === "file:") {
        msg += " — sers web/ : python3 -m http.server 4173 --directory web";
      }
      showErr(msg);
    }
  }

  $btn.addEventListener("click", function () {
    ensureAnalyser();
    if (mode === "live") stopLive();
    else start();
  });

  $replay.addEventListener("click", function () {
    ensureAnalyser();
    if (mode === "replay" || replayLoading) stopReplay(true);
    else startReplay();
  });

  $unmute.addEventListener("change", function () {
    setSampleGain($unmute.checked);
    if (window._keyHear && audioCtx) window._keyHear.gain.value = $unmute.checked ? 0.18 : 0;
  });

  $autotune.addEventListener("change", function () {
    resetSmooth();
    syncTuneUi();
  });

  try { themeMode = localStorage.getItem(THEME_MODE_KEY) || "auto"; } catch (e) { themeMode = "auto"; }
  document.querySelectorAll("[data-theme-set]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      themeMode = "manual";
      applyTheme(btn.getAttribute("data-theme-set"));
    });
  });
  document.querySelectorAll("[data-theme-auto]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      themeMode = "auto";
      lastAutoThemeAt = 0;
      applyTheme(autoThemeName());
    });
  });
  try {
    if (typeof AmbientLightSensor === "function") {
      const als = new AmbientLightSensor({ frequency: 0.4 });
      als.addEventListener("reading", function () {
        lastThemeLux = als.illuminance;
        if (themeMode !== "auto") return;
        const next = themeFromLux(lastThemeLux);
        const now = Date.now();
        if (next === lastAutoTheme && now - lastAutoThemeAt < 8000) return;
        if (lastAutoThemeAt && now - lastAutoThemeAt < 12000) return;
        lastAutoThemeAt = now;
        lastAutoTheme = next;
        applyTheme(next);
      });
      als.start();
    }
  } catch (e) { /* no ALS */ }
  setInterval(function () {
    if (themeMode !== "auto" || lastThemeLux != null) return;
    const next = themeFromHour();
    if (next === lastAutoTheme) return;
    lastAutoTheme = next;
    applyTheme(next);
  }, 60000);

  function onArrangePointer(ev, restart) {
    if (ev.pointerType === "mouse" && ev.buttons !== 1 && ev.type !== "pointerdown") return;
    seekFromClientX(ev.clientX, restart);
  }
  $arrangeLane.addEventListener("pointerdown", function (ev) {
    if (mode === "live") return;
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    scrubbing = true;
    $arrangeLane.setPointerCapture(ev.pointerId);
    onArrangePointer(ev, false);
  });
  $arrangeLane.addEventListener("pointermove", function (ev) {
    if (!scrubbing) return;
    onArrangePointer(ev, "drag");
  });
  function endScrub() {
    if (!scrubbing) return;
    scrubbing = false;
    restartBuffer(true);
  }
  $arrangeLane.addEventListener("pointerup", endScrub);
  $arrangeLane.addEventListener("pointercancel", endScrub);
  $arrange.addEventListener("keydown", function (ev) {
    const dur = sampleDuration || 0;
    if (!dur) return;
    const step = ev.shiftKey ? 5 : 1;
    if (ev.key === "ArrowLeft") {
      sampleOffset = Math.max(0, sampleNow() - step);
    } else if (ev.key === "ArrowRight") {
      sampleOffset = Math.min(dur, sampleNow() + step);
    } else if (ev.key === "Home") {
      sampleOffset = 0;
    } else if (ev.key === "End") {
      sampleOffset = dur;
    } else {
      return;
    }
    ev.preventDefault();
    updateScrubUi(true);
    restartBuffer(true);
  });

  $micAlt.addEventListener("change", function () {
    micOverrideId = $micAlt.value === "os" ? null : $micAlt.value;
    if (mode === "live") {
      acquireStream().catch(function (e) {
        showErr("Micro: " + (e && e.message ? e.message : String(e)));
      });
    }
  });

  function onResize() {
    layoutBlackKeys();
    drawWave();
    drawSpecPlot(lastSpecClusters);
  }
  if (typeof ResizeObserver === "function") {
    const ro = new ResizeObserver(onResize);
    ro.observe($arrangeLane);
    ro.observe($board);
  }
  window.addEventListener("resize", onResize);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", onResize);
  }

  let lastChipKey = "";

  function restoreIdleLabel(el) {
    const lab = el.querySelector(".name");
    if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
  }

  function clearLights() {
    keys.forEach(function (el) {
      el.classList.remove("on", "harm");
      el.style.removeProperty("--vel");
      el.style.removeProperty("--pop");
      restoreIdleLabel(el);
    });
    $chroma.querySelectorAll(".bar").forEach(function (bar) {
      bar.classList.remove("on");
      bar.firstElementChild.style.transform = "scaleY(0)";
    });
    $chips.innerHTML = "";
    $chips.appendChild($hzLive);
    $hzLive.textContent = "";
    lastChipKey = "";
  }

  function loop() {
    raf = 0;
    if (!analyser) {
      loopOn = false;
      return;
    }
    if (mode === "idle" && heldVoices.size === 0) {
      loopOn = false;
      drawSpecPlot(lastSpecClusters);
      return;
    }
    analyser.getFloatFrequencyData(spec);
    const binHz = audioCtx.sampleRate / analyser.fftSize;
    updateConcertPitch(spec, binHz);
    const clustered = densityClusterFunds(groupHarmonicFunds(extractClusterPeaks(spec, binHz)));
    lastSpecClusters = clustered;
    drawSpecPlot(clustered);
    matchLiveTracks(clustered, performance.now());
    syncTrackUi();
    pushTrackHist();
    drawWave(true);
    if (performance.now() - lastLabelAt > LABEL_EVERY_MS) requestLabels(false);
    const mixed = isTous();
    const useBands = !mixed;
    const i0 = Math.max(2, Math.floor(MIXED_LO_HZ / binHz));
    const i1 = Math.min(spec.length - 2, Math.ceil(MIXED_HI_HZ / binHz));
    score.fill(-120);
    scoreHz.fill(0);
    const fold = !mixed;

    const peaks = [];
    for (let i = i0; i <= i1; i++) {
      const freq = i * binHz;
      if (useBands && !freqInActiveBands(freq)) continue;
      const db = spec[i];
      if (db > spec[i - 1] && db >= spec[i + 1] && db > spec[i - 2] && db >= spec[i + 2]) {
        const denom = spec[i - 1] - 2 * spec[i] + spec[i + 1];
        const delta = denom ? 0.5 * (spec[i - 1] - spec[i + 1]) / denom : 0;
        const pf = (i + delta) * binHz;
        if (!useBands || freqInActiveBands(pf)) peaks.push({ freq: pf, db: db });
      }
      const midi = midiFromHz(freq, fold);
      if (midi >= MIDI_LO && midi <= MIDI_HI) {
        const idx = midi - MIDI_LO;
        if (db > score[idx]) {
          score[idx] = db;
          scoreHz[idx] = freq;
        }
      }
    }
    peaks.sort(function (a, b) { return b.db - a.db; });
    for (let p = 0; p < peaks.length; p++) {
      const midi = midiFromHz(peaks[p].freq, fold);
      if (midi < MIDI_LO || midi > MIDI_HI) continue;
      const idx = midi - MIDI_LO;
      if (peaks[p].db + 2 > score[idx]) {
        score[idx] = peaks[p].db + 2;
        scoreHz[idx] = peaks[p].freq;
      }
    }

    let loudest = -120;
    for (let i = 0; i < nKeys; i++) {
      smooth[i] = 0.62 * smooth[i] + 0.38 * score[i];
      if (smooth[i] > loudest) loudest = smooth[i];
    }

    const noise = bandNoiseFloor(spec, i0, i1);
    const absGate = Math.max(-78, noise + 12);
    const relDb = 16;
    const gate = Math.max(absGate, loudest - relDb);
    const maxN = $chords.checked ? 8 : 1;

    const candidates = [];
    for (let i = 0; i < nKeys; i++) {
      const s = smooth[i];
      if (s < gate) continue;
      const left = i > 0 ? smooth[i - 1] : -999;
      const right = i < nKeys - 1 ? smooth[i + 1] : -999;
      if (s >= left && s >= right) {
        candidates.push({
          midi: i + MIDI_LO,
          s: s,
          freq: scoreHz[i] || midiToHz(i + MIDI_LO)
        });
      }
    }
    candidates.sort(function (a, b) { return b.s - a.s; });
    const lit = candidates.slice(0, maxN);
    const litSet = {};
    const litPc = {};
    for (let k = 0; k < lit.length; k++) {
      litSet[lit[k].midi] = lit[k];
      litPc[pcOf(lit[k].midi)] = true;
    }

    const ghostSet = {};
    for (let k = 0; k < lit.length; k++) {
      const c = lit[k];
      const ghosts = [c.midi + 12, c.midi - 12, c.midi + 7, c.midi - 7];
      for (let g = 0; g < ghosts.length; g++) {
        const midi = ghosts[g];
        if (midi >= MIDI_LO && midi <= MIDI_HI && !litSet[midi]) ghostSet[midi] = true;
      }
    }

    keys.forEach(function (el, midi) {
      const hit = litSet[midi];
      const on = !!hit;
      const harm = !on && !!ghostSet[midi];
      const wasOn = el.classList.contains("on");
      const wasHarm = el.classList.contains("harm");
      el.classList.toggle("on", on);
      el.classList.toggle("harm", harm);
      const lab = el.firstElementChild;
      if (on) {
        const span = Math.max(6, loudest - gate);
        const vel = Math.max(0.22, Math.min(1, (hit.s - gate) / span));
        el.style.setProperty("--vel", String(vel));
        el.style.setProperty("--pop", Math.round(10 * vel) + "%");
        if (!wasOn) {
          paintEl(el, crayonOf(midi));
          if (lab) lab.textContent = crayonOf(midi).fr + octaveOf(midi);
        }
      } else {
        if (wasOn) {
          el.style.removeProperty("--vel");
          el.style.removeProperty("--pop");
          if (lab && el.dataset.idleName) lab.textContent = el.dataset.idleName;
        }
        if (harm && !wasHarm) paintEl(el, crayonOf(midi));
      }
    });

    chromaDb.fill(-120);
    for (let i = 0; i < nKeys; i++) {
      const pc = ((i + MIDI_LO) % 12 + 12) % 12;
      if (smooth[i] > chromaDb[pc]) chromaDb[pc] = smooth[i];
    }
    for (let b = 0; b < chromaBars.length; b++) {
      const bar = chromaBars[b];
      const name = bar.dataset.pc;
      const v = chromaDb[bar.dataset.i | 0];
      const on = v >= gate && !!litPc[name];
      bar.classList.toggle("on", on);
      const pct = Math.max(0, Math.min(100, (v - absGate) * 1.8));
      const frac = on ? Math.max(0.28, pct / 100) : Math.max(0, pct * 0.0025);
      const fill = bar.firstElementChild;
      const tr = "scaleY(" + frac.toFixed(3) + ")";
      if (fill.style.transform !== tr) fill.style.transform = tr;
    }

    const chipKey = lit.map(function (c) { return c.midi; }).sort(function (a, b) { return a - b; }).join(",");
    if (chipKey !== lastChipKey) {
      lastChipKey = chipKey;
      $chips.innerHTML = "";
      if (lit.length) {
        lit.slice().sort(function (a, b) { return a.midi - b.midi; }).forEach(function (c) {
          const info = crayonOf(c.midi);
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.dataset.pc = pcOf(c.midi);
          paintEl(chip, info);
          chip.textContent = info.fr + octaveOf(c.midi);
          $chips.appendChild(chip);
        });
      }
      $chips.appendChild($hzLive);
    }
    if (lit.length) {
      $hzLive.textContent = String(Math.round(lit[0].freq));
    } else if ($hzLive.textContent) {
      $hzLive.textContent = "";
    }

    if (mode === "replay") {
      paintPlayhead(false);
      const t = sampleNow();
      const text = fmtTime(t);
      if (text !== lastClockText) {
        lastClockText = text;
        $clock.textContent = text;
        $arrange.setAttribute("aria-valuenow", String(Math.round(t)));
        $arrange.setAttribute("aria-valuetext", text);
      }
    }

    if (mode === "idle") {
      loopOn = false;
      return;
    }
    raf = requestAnimationFrame(loop);
  }

  buildLegend();
  buildKeyboard();
  buildDualBoards();
  buildTracks();
  applyTheme(preferredTheme());
  setCaptureKind(canShareTabAudio() ? "phones" : "mic");
  probeFm();
  syncTuneUi();
  requestAnimationFrame(function () {
    layoutBlackKeys();
    drawWave(true);
    const wrap = $board.parentElement;
    if (wrap && wrap.scrollWidth > wrap.clientWidth) {
      const whites = $board.querySelectorAll(".white");
      const mid = Array.prototype.find.call(whites, function (el) {
        return Number(el.dataset.midi) === 60;
      });
      if (mid) {
        wrap.scrollLeft = Math.max(0, mid.offsetLeft - wrap.clientWidth / 2 + mid.offsetWidth / 2);
      }
    }
  });
})();
  </script>
</body>
</html>
