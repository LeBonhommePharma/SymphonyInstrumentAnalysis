<!DOCTYPE html>
<html lang="fr" data-theme="stealth" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <style>html,body{background:#121214;color-scheme:dark}</style>
  <script>
  (function () {
    try {
      var t = localStorage.getItem("crayon-theme");
      var mode = localStorage.getItem("crayon-theme-mode");
      var ok = { day: 1, light: 1, dark: 1, night: 1, stealth: 1 };
      if (mode !== "manual" || !t || !ok[t]) {
        var h = new Date().getHours();
        var light = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches;
        if (h >= 21 || h < 6) t = light ? "night" : "stealth";
        else if (h >= 17) t = light ? "light" : "night";
        else t = light ? "day" : "light";
      }
      var light = t === "day" || t === "light";
      var bg = { day: "#f6ead4", light: "#eef1f5", dark: "#1c1e24", night: "#0d1220", stealth: "#121214" }[t];
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("data-scheme", light ? "light" : "dark");
      document.documentElement.style.colorScheme = light ? "light" : "dark";
      document.documentElement.style.background = bg;
      document.documentElement.style.backgroundColor = bg;
    } catch (e) {}
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121214">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Piano-crayon">
  <title>Piano-crayon</title>
  <style>
    :root,
    html[data-theme="stealth"] {
      --bg: #121214;
      --ink: #9a9aa2;
      --muted: #6e6e76;
      --paper: #18181c;
      --paper-ink: #9a9aa2;
      --hairline: #333338;
      --hairline-strong: #3a3a42;
      --key-white: #2a2a2e;
      --key-white-edge: #333338;
      --key-black: #1a1a1c;
      --key-black-edge: #161618;
      --live: rgb(111, 153, 72);
      --stop: rgb(153, 72, 73);
      --replay: rgb(72, 72, 153);
      --replay-on: rgb(72, 126, 153);
      --tap: color-mix(in srgb, #9a9aa2 18%, transparent);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dt: 150ms;
      --glow: 8%;
      --wave-bed: #16161a;
      --wave-grid: rgba(255,255,255,0.03);
      --btn-face: #1c1c20;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
    }
    html[data-theme="day"] {
      --bg: #f6ead4;
      --ink: #2a2218;
      --muted: #6a5e50;
      --paper: #fff6e8;
      --paper-ink: #2a2218;
      --hairline: #e2d4bc;
      --hairline-strong: #c9b89a;
      --key-white: #fffaf0;
      --key-white-edge: #e2d4bc;
      --key-black: #3f3328;
      --key-black-edge: #2c241c;
      --live: rgb(121, 176, 69);
      --stop: rgb(196, 59, 61);
      --replay: rgb(69, 69, 186);
      --replay-on: rgb(76, 151, 189);
      --tap: color-mix(in srgb, var(--ink) 14%, transparent);
      --glow: 32%;
      --wave-bed: #ebe0cc;
      --wave-grid: rgba(40,32,24,0.08);
      --btn-face: #fff6e8;
    }
    html[data-theme="light"] {
      --bg: #eef1f5;
      --ink: #1a2028;
      --muted: #5c6672;
      --paper: #ffffff;
      --paper-ink: #1a2028;
      --hairline: #d5dbe3;
      --hairline-strong: #b7c0cc;
      --key-white: #f7f8fa;
      --key-white-edge: #d5dbe3;
      --key-black: #2c3340;
      --key-black-edge: #1c222c;
      --live: rgb(52, 168, 88);
      --stop: rgb(196, 59, 61);
      --replay: rgb(69, 69, 186);
      --replay-on: rgb(56, 140, 184);
      --tap: color-mix(in srgb, var(--ink) 12%, transparent);
      --glow: 28%;
      --wave-bed: #e4e9f0;
      --wave-grid: rgba(28,34,44,0.08);
      --btn-face: #ffffff;
    }
    html[data-theme="dark"] {
      --bg: #1c1e24;
      --ink: #d2d4dc;
      --muted: #8b8e98;
      --paper: #262830;
      --paper-ink: #d2d4dc;
      --hairline: #3a3c46;
      --hairline-strong: #4a4d58;
      --key-white: #343848;
      --key-white-edge: #3a3c46;
      --key-black: #161820;
      --key-black-edge: #101218;
      --live: rgb(121, 176, 69);
      --stop: rgb(196, 90, 92);
      --replay: rgb(110, 110, 196);
      --replay-on: rgb(86, 160, 196);
      --tap: color-mix(in srgb, #d2d4dc 16%, transparent);
      --glow: 34%;
      --wave-bed: #1a1c22;
      --wave-grid: rgba(255,255,255,0.05);
      --btn-face: #262830;
    }
    html[data-theme="night"] {
      --bg: #0d1220;
      --ink: #c8d0e4;
      --muted: #7a849c;
      --paper: #151b2c;
      --paper-ink: #c8d0e4;
      --hairline: #2a3348;
      --hairline-strong: #3a4660;
      --key-white: #243044;
      --key-white-edge: #2a3348;
      --key-black: #0e1422;
      --key-black-edge: #0a0e18;
      --live: rgb(121, 176, 69);
      --stop: rgb(196, 90, 92);
      --replay: rgb(120, 130, 210);
      --replay-on: rgb(90, 170, 210);
      --tap: color-mix(in srgb, #c8d0e4 16%, transparent);
      --glow: 38%;
      --wave-bed: #101628;
      --wave-grid: rgba(200,208,228,0.06);
      --btn-face: #151b2c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      overscroll-behavior: none;
    }
    html { -webkit-text-size-adjust: 100%; background: var(--bg); color-scheme: dark; }
    html[data-scheme="light"] { background: var(--bg); color-scheme: light; }
    body {
      font-family: "SF Pro Text", "SF Pro Display", system-ui, -apple-system, sans-serif;
      font-optical-sizing: auto;
      background: var(--bg);
      color: var(--ink);
      transition: background-color var(--dt) var(--ease), color var(--dt) var(--ease);
      padding:
        max(14px, var(--safe-t))
        max(16px, var(--safe-r))
        max(18px, var(--safe-b))
        max(16px, var(--safe-l));
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .scenes {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 999px;
      background: var(--paper);
      border: 1px solid var(--hairline);
    }
    .scene {
      width: 28px;
      height: 28px;
      min-width: 28px;
      min-height: 28px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.22);
      background: var(--swatch);
    }
    .scene[data-theme-set="day"] { --swatch: #f6ead4; box-shadow: inset 0 0 0 1px #b89f78; }
    .scene[data-theme-set="light"] { --swatch: #eef1f5; box-shadow: inset 0 0 0 1px #8a97a8; }
    .scene[data-theme-set="dark"] { --swatch: #1c1e24; box-shadow: inset 0 0 0 1px #6a6e7c; }
    .scene[data-theme-set="night"] { --swatch: #0d1220; box-shadow: inset 0 0 0 1px #5a6a90; }
    .scene[data-theme-set="stealth"] { --swatch: #121214; box-shadow: inset 0 0 0 1px #6e6e76; }
    .scene-auto {
      font: 700 0.68rem/1 "SF Pro Text", system-ui, sans-serif;
      color: var(--ink);
      background: var(--paper);
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 1px var(--hairline);
    }
    .scene-auto[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
    }
    .scene[aria-pressed="true"] {
      box-shadow: 0 0 0 2px var(--ink), inset 0 0 0 1px rgba(0,0,0,0.35);
    }
    .scene:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    h1 {
      margin: 0 0 2px;
      font-size: clamp(1.12rem, 2.2vw, 1.48rem);
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .work {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 38vw);
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }
    .spec-panel h3 {
      margin: 0 0 6px;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    #spec {
      width: 100%;
      height: 220px;
      display: block;
      border-radius: 10px;
      background: var(--wave-bed);
    }
    @media (max-width: 820px) {
      .work { grid-template-columns: 1fr; }
    }
    button, input, select {
      font: inherit;
      font-size: 1rem;
    }
    #btn, #replay {
      width: 56px;
      height: 56px;
      min-width: 56px;
      min-height: 56px;
      padding: 0;
      border: 1px solid var(--hairline-strong);
      border-radius: 50%;
      cursor: pointer;
      color: var(--ink);
      background: var(--btn-face);
      display: grid;
      place-items: center;
      place-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: var(--tap);
      transition: background-color var(--dt) var(--ease), border-color var(--dt) var(--ease);
    }
    /* Idle listen: green ring = mic, cups = headphone/system audio. Live = red stop. */
    #btn { border-color: color-mix(in srgb, var(--live) 55%, var(--hairline)); }
    #btn .icon {
      width: 16px;
      height: 16px;
      border: 2px solid var(--live);
      border-radius: 50%;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--live) 28%, transparent);
      position: relative;
    }
    #btn.phones:not(.live) .icon {
      width: 16px;
      height: 11px;
      border-radius: 9px 9px 0 0;
      border-bottom: 0;
      box-shadow: none;
      background: transparent;
    }
    #btn.phones:not(.live) .icon::before,
    #btn.phones:not(.live) .icon::after {
      content: "";
      position: absolute;
      bottom: -6px;
      width: 6px;
      height: 9px;
      border: 2px solid var(--live);
      background: color-mix(in srgb, var(--live) 32%, transparent);
      border-radius: 2px;
    }
    #btn.phones:not(.live) .icon::before { left: -6px; }
    #btn.phones:not(.live) .icon::after { right: -6px; }
    #btn.mic:not(.live) .icon {
      width: 8px;
      height: 14px;
      border-radius: 6px;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--live) 28%, transparent);
    }
    #btn.live {
      background: color-mix(in srgb, var(--stop) 22%, #1c1c20);
      border-color: var(--stop);
      animation: live-ring 1.7s ease-in-out infinite;
    }
    #btn.live .icon {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 2px;
      background: #e8e8ee;
      box-shadow: none;
    }
    #btn.live .icon::before,
    #btn.live .icon::after { content: none; }
    #btn.live.phones { box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 45%, transparent); }
    #btn.live.mic { box-shadow: 0 0 0 3px color-mix(in srgb, rgb(198, 64, 42) 40%, transparent); }
    @keyframes live-ring {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--stop) 0%, transparent); }
      50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--stop) 22%, transparent); }
    }
    #btn:focus-visible, #replay:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    #replay { border-color: color-mix(in srgb, var(--replay) 55%, var(--hairline)); }
    #replay .icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 7px 0 7px 12px;
      border-color: transparent transparent transparent var(--ink);
      margin-left: 2px;
    }
    #replay.playing {
      background: color-mix(in srgb, var(--replay-on) 22%, #1c1c20);
      border-color: var(--replay-on);
    }
    #replay.playing .icon,
    #replay.loading .icon {
      width: 14px;
      height: 14px;
      margin: 0;
      border: 0;
      border-radius: 2px;
      background: var(--ink);
    }
    #replay.loading { opacity: 0.7; }
    .scrub {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 12px;
      align-items: end;
      margin: 0 0 10px;
    }
    .arrange {
      min-width: 0;
      outline: none;
      touch-action: none;
    }
    .arrange-ruler {
      height: 18px;
      position: relative;
      color: var(--muted);
      font-size: 0.62rem;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .arrange-ruler span {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
    }
    .arrange-ruler span:first-child { transform: none; }
    .arrange-stack {
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      min-height: 64px;
      max-height: 280px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      overflow: hidden;
      background: var(--wave-bed);
    }
    .arrange-heads {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border-right: 1px solid var(--hairline);
      overflow: auto;
    }
    .arrange-head {
      flex: 1 1 0;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-bottom: 1px solid var(--hairline);
      cursor: pointer;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
    }
    .arrange-head:last-child { border-bottom: 0; }
    .arrange-head.dim { opacity: 0.38; }
    .arrange-head[aria-pressed="true"] {
      outline: 1px solid var(--ink);
      outline-offset: -2px;
    }
    .arrange-swatch {
      width: 28px;
      height: 8px;
      border-radius: 1px;
      background: var(--crayon, var(--replay));
      flex: 0 0 auto;
    }
    .arrange-head .nm {
      font-size: 0.62rem;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .arrange-lane {
      position: relative;
      min-height: 64px;
      cursor: ew-resize;
      touch-action: none;
      contain: layout style;
    }
    .arrange-lane canvas {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 2px;
      margin-left: -1px;
      background: #e8e8ee;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }
    .playhead::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 7px solid #e8e8ee;
    }
    .scrub .clock {
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-weight: 650;
      color: var(--ink);
      font-size: 0.82rem;
      min-width: 4.8rem;
      padding-bottom: 6px;
    }
    .tracks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: stretch;
      margin: 0 0 8px;
      min-height: 44px;
    }
    .track-count {
      width: 28px;
      min-width: 28px;
      height: 44px;
      display: grid;
      place-items: center;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      font-weight: 650;
      font-size: 0.82rem;
      color: var(--muted);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      background: color-mix(in srgb, var(--ink) 6%, var(--bg));
      cursor: pointer;
      padding: 0;
    }
    .track-count:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    .track-btn.off {
      opacity: 0.28;
    }
    .track-btn {
      position: relative;
      overflow: hidden;
      font-size: 0.68rem;
      font-weight: 650;
      padding: 0 8px;
      border: 1px solid var(--hairline);
      border-radius: 4px;
      cursor: pointer;
      min-width: 44px;
      min-height: 44px;
      line-height: 1.1;
      text-align: center;
      color: var(--lab, var(--ink));
      background: color-mix(in srgb, var(--crayon, var(--ink)) 12%, var(--bg));
      opacity: 0.38;
      touch-action: manipulation;
      -webkit-tap-highlight-color: var(--tap);
    }
    .track-btn .fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 100%;
      transform: scaleY(var(--e, 0));
      transform-origin: 50% 100%;
      background: var(--crayon);
      pointer-events: none;
    }
    .track-btn .hz {
      position: relative;
      z-index: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .track-btn.hot {
      opacity: 1;
      border-color: color-mix(in srgb, var(--crayon) 55%, var(--hairline));
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .track-btn.dim {
      opacity: 0.28;
      min-width: 44px;
      background: color-mix(in srgb, var(--ink) 8%, var(--bg));
      border-color: var(--hairline);
      cursor: default;
    }
    .track-btn[aria-pressed="true"] {
      outline: 1px solid var(--ink);
      outline-offset: 1px;
    }
    .track-btn:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 2px;
    }
    .tune-line {
      font-weight: 650;
      font-size: 0.88rem;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      color: #7a8a94;
      margin: 0 0 8px;
    }
    .tune-line .muted { color: var(--muted); font-weight: 600; }
    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .tog {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      display: grid;
      place-items: center;
      cursor: pointer;
      user-select: none;
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      background: var(--btn-face);
      touch-action: manipulation;
      -webkit-tap-highlight-color: var(--tap);
      position: relative;
    }
    .tog input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .tog .face {
      display: block;
      position: relative;
    }
    .tog input:focus-visible + .face {
      outline: 1px solid var(--replay-on);
      outline-offset: 3px;
    }
    /* Accords: 3-dot constellation vs one pitch. */
    .tog-chords .face {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
    }
    .tog-chords input:checked + .face {
      background: rgb(52, 168, 88);
      box-shadow: 7px 8px 0 rgb(52, 168, 88), -7px 8px 0 rgb(52, 168, 88);
    }
    /* Son: speaker cone, filled = hear replay. */
    .tog-son .face {
      width: 14px;
      height: 12px;
      background: transparent;
      border-radius: 1px;
    }
    .tog-son .face::before {
      content: "";
      position: absolute;
      left: 0;
      top: 3px;
      width: 5px;
      height: 6px;
      background: var(--muted);
      border-radius: 1px;
    }
    .tog-son .face::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 6px 0 6px 9px;
      border-color: transparent transparent transparent var(--muted);
    }
    .tog-son input:checked + .face::before { background: rgb(52, 168, 88); }
    .tog-son input:checked + .face::after {
      border-color: transparent transparent transparent rgb(52, 168, 88);
    }
    /* La: Blueberry disc = follow concert A; outline = lock 440. */
    .tog-la .face {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgb(0, 0, 255);
      background: transparent;
      box-shadow: inset 0 0 0 5px var(--paper);
    }
    .tog-la input:checked + .face {
      background: rgb(0, 0, 255);
      box-shadow: none;
    }
    /* Scène: filled dark square vs light outline. */
    .tog-scene .face {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      border: 2px solid #9a9aa2;
      background: #121214;
    }
    .tog-scene input:not(:checked) + .face {
      background: #efe8dc;
      border-color: #3a342e;
    }
    .chroma {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 2px;
      height: 56px;
      margin: 8px 0 8px;
      padding: 4px;
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 4px;
    }
    .chroma .bar {
      position: relative;
      background: color-mix(in srgb, var(--ink) 6%, var(--paper));
      border-radius: 2px 2px 1px 1px;
      overflow: hidden;
      border: 1px solid var(--hairline);
    }
    .chroma .fill {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 100%;
      transform: scaleY(0);
      transform-origin: 50% 100%;
      background: var(--crayon);
      transition: transform var(--dt) var(--ease);
    }
    .chroma .bar.on .fill {
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .chroma .lab {
      position: absolute;
      left: 0; right: 0; bottom: 3px;
      text-align: center;
      font-size: 0.58rem;
      font-weight: 650;
      color: var(--ink);
      z-index: 1;
      pointer-events: none;
      opacity: 0.72;
    }
    .chroma .bar.on .lab { opacity: 1; color: var(--lab, var(--ink)); }
    .chips {
      min-height: 36px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 8px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border-radius: 4px;
      font-weight: 650;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      border: 1px solid color-mix(in srgb, var(--ink) 16%, var(--crayon));
      background: var(--crayon);
      color: var(--lab, var(--ink));
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    .hz-live {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
    }
    .type-well {
      margin: 0 0 12px;
    }
    .type-head {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 8px;
      align-items: stretch;
      margin-bottom: 8px;
    }
    .type-clear {
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
    }
    .type-out {
      margin: 0;
      min-height: 44px;
      max-height: 88px;
      overflow: auto;
      padding: 8px 10px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
      font: 650 0.92rem/1.35 ui-monospace, Menlo, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .type-out:empty::before {
      content: "US + canadien français · 10 doigts, plus si bien groupés";
      color: var(--muted);
      font-weight: 600;
    }
    .dual-boards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 980px) {
      .dual-boards { grid-template-columns: 1fr; }
    }
    .kb-wrap {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 6px 6px 8px;
      min-width: 0;
    }
    .kb-title {
      font-size: 0.68rem;
      font-weight: 650;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 2px 6px 6px;
    }
    .kb-board {
      position: relative;
      --cols: 15;
      --rows: 5;
      --ku: clamp(22px, 3.05vw, 34px);
      height: calc(var(--rows) * var(--ku));
      user-select: none;
      touch-action: none;
    }
    .kb-meta {
      min-width: 7.5rem;
      margin: 0;
      padding: 8px 10px;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      font: 650 0.72rem/1.35 ui-sans-serif, system-ui, sans-serif;
      display: flex;
      align-items: center;
    }
    .kb-key {
      position: absolute;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border: 1px solid var(--key-white-edge);
      border-radius: 5px;
      background: var(--key-white);
      color: var(--ink);
      font-weight: 650;
      font-size: 0.7rem;
      line-height: 1;
      cursor: pointer;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .kb-key.mod {
      font-size: 0.56rem;
      color: var(--muted);
    }
    .kb-key .sub {
      font-size: 0.5rem;
      opacity: 0.62;
      font-weight: 600;
    }
    .kb-key.on {
      background: var(--crayon, var(--replay-on));
      color: var(--lab, #f4efe6);
      box-shadow: 0 0 8px color-mix(in srgb, var(--crayon, var(--replay-on)) var(--glow), transparent);
    }
    .kb-key.blocked {
      opacity: 0.32;
    }
    .kb-key:focus-visible {
      outline: 1px solid var(--replay-on);
      outline-offset: 1px;
    }
    .board-well {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 12px;
      padding: 10px 10px 12px;
      box-shadow: none;
      width: calc(100% + 0px);
    }
    .piano-strip #board {
      height: clamp(88px, 14vh, 140px);
    }
    .board-wrap {
      position: relative;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      padding-bottom: 2px;
    }
    #board {
      position: relative;
      height: clamp(240px, 32vh, 360px);
      min-width: max(100%, calc(52 * 28px));
      width: max(100%, calc(52 * 28px));
      user-select: none;
      touch-action: pan-x;
    }
    .key {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition:
        background-color var(--dt) var(--ease),
        box-shadow var(--dt) var(--ease);
    }
    .white {
      position: absolute;
      top: 0;
      height: 100%;
      background: var(--key-white);
      border: 1px solid var(--key-white-edge);
      border-radius: 0 0 5px 5px;
      z-index: 1;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        inset 0 -8px 12px rgba(0, 0, 0, 0.28);
    }
    .white .name {
      position: absolute;
      bottom: 8px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.62rem;
      font-weight: 650;
      color: var(--muted);
      opacity: 0.7;
      pointer-events: none;
    }
    .black {
      position: absolute;
      top: 0;
      height: 62%;
      background: var(--key-black);
      border: 1px solid var(--key-black-edge);
      border-radius: 0 0 3px 3px;
      z-index: 3;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.04),
        inset 0 -8px 10px rgba(0, 0, 0, 0.28);
    }
    .black .name {
      position: absolute;
      bottom: 6px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.52rem;
      font-weight: 650;
      color: var(--muted);
      opacity: 0.55;
      pointer-events: none;
    }
    .key.on {
      background: var(--crayon) !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        0 0 14px color-mix(in srgb, var(--crayon) var(--glow), transparent);
      z-index: 4;
    }
    .key.on .name { color: var(--ink); opacity: 0.92; }
    .key.harm:not(.on) {
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--crayon) 40%, transparent);
    }
    .white.harm:not(.on) {
      background: color-mix(in srgb, var(--crayon) 11%, var(--key-white));
    }
    .black.harm:not(.on) {
      background: color-mix(in srgb, var(--crayon) 18%, var(--key-black));
    }
    .key.study {
      outline: 1px solid var(--ink);
      outline-offset: -2px;
    }
    .legend {
      margin-top: 14px;
      background: transparent;
      color: var(--paper-ink);
      border-radius: 0;
      padding: 8px 0 0;
      border: none;
    }
    .legend h2 {
      margin: 0 0 8px;
      font-size: 0.72rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .pencils {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
    }
    .pencil {
      border-radius: 3px;
      padding: 6px 3px 5px;
      text-align: center;
      background: var(--crayon);
      color: var(--lab, var(--ink));
      border: 1px solid color-mix(in srgb, var(--ink) 16%, var(--crayon));
      min-height: 52px;
    }
    .pencil .fr { font-weight: 650; font-size: 0.88rem; }
    details.adv {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    details.adv summary {
      cursor: pointer;
      color: var(--ink);
      min-height: 44px;
      display: flex;
      align-items: center;
      touch-action: manipulation;
    }
    details.adv select {
      margin-top: 8px;
      max-width: 100%;
      min-height: 44px;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--hairline-strong);
      background: var(--paper);
      color: var(--ink);
      font-size: 1rem;
    }
    .err {
      color: #8a4a4c;
      font-weight: 650;
      margin: 8px 0;
    }
    @supports (background: color-mix(in srgb, red 50%, white)) {
      .key.on {
        background: color-mix(in srgb, var(--crayon) calc(100% - var(--pop, 0%)), #ffffff) !important;
      }
    }
    @supports (color: color(display-p3 1 0 0)) {
      .key.on {
        background: var(--crayon-p3, var(--crayon)) !important;
      }
      .chroma .fill,
      .pencil,
      .chip,
      .track-btn[aria-pressed="true"] {
        background: var(--crayon-p3, var(--crayon));
      }
      @supports (background: color-mix(in srgb, red 50%, white)) {
        .key.on {
          background: color-mix(in srgb, var(--crayon-p3, var(--crayon)) calc(100% - var(--pop, 0%)), #ffffff) !important;
        }
      }
    }
    @media (max-width: 900px) {
      .pencils { grid-template-columns: repeat(6, 1fr); }
      .chroma { height: 72px; }
    }
    @media (min-width: 768px) {
      #board { height: 280px; }
    }
    @media (min-width: 1180px) {
      #board { height: 320px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chroma .fill,
      .key,
      #btn,
      #replay { transition: none; }
      #btn.live { animation: none; }
      .playhead { will-change: auto; }
      .key.on { box-shadow: inset 0 0 0 1px var(--hairline-strong); }
    }
    @media (prefers-reduced-transparency: reduce) {
      .key.on,
      .chip,
      .track-btn[aria-pressed="true"],
      .chroma .bar.on .fill { box-shadow: none; }
    }
    @media (prefers-contrast: more) {
      html[data-scheme="dark"] {
        --ink: #a8a8b0;
        --hairline: #3e3e46;
        --hairline-strong: #4a4a54;
        --muted: #7a7a82;
        --glow: 40%;
      }
      html[data-scheme="light"] {
        --ink: #1c1916;
        --hairline: #8a8276;
        --hairline-strong: #5c564c;
        --muted: #4a453e;
      }
      .key.on { box-shadow: inset 0 0 0 1px var(--ink); }
    }
    html[data-scheme="light"] .arrange-stack {
      background: color-mix(in srgb, var(--ink) 6%, var(--paper));
    }
    html[data-scheme="light"] .arrange-heads,
    html[data-scheme="light"] .arrange-head { background: color-mix(in srgb, var(--ink) 8%, var(--paper)); }
    html[data-scheme="light"] .playhead { background: var(--ink); }
    html[data-scheme="light"] .playhead::before {
      background: transparent;
      border-top-color: var(--ink);
    }
    html[data-scheme="light"] #replay {
      color: var(--ink);
      background: var(--replay);
    }
    html[data-scheme="light"] #replay .icon {
      border-color: transparent transparent transparent #f7f1e8;
    }
    html[data-scheme="light"] #replay.playing .icon,
    html[data-scheme="light"] #replay.loading .icon { background: #f7f1e8; }
    /* Idle start action is green; while listening the button is the stop control (red). */
    html[data-scheme="light"] #btn {
      background: var(--live);
      color: var(--ink);
      border-color: var(--hairline-strong);
    }
    html[data-scheme="light"] #btn .icon {
      border-color: var(--ink);
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--ink) 18%, transparent);
    }
    html[data-scheme="light"] #btn.phones:not(.live) .icon::before,
    html[data-scheme="light"] #btn.phones:not(.live) .icon::after {
      border-color: var(--ink);
      background: color-mix(in srgb, var(--ink) 22%, transparent);
    }
    html[data-scheme="light"] #btn.mic:not(.live) .icon {
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--ink) 18%, transparent);
    }
    html[data-scheme="light"] #btn.live {
      background: var(--stop);
      color: #f7f1e8;
      border-color: var(--hairline-strong);
    }
    html[data-scheme="light"] #btn.live .icon { background: #f7f1e8; }
    html[data-scheme="light"] #replay { background: var(--replay); border-color: var(--hairline-strong); }
    html[data-scheme="light"] #replay.playing {
      background: var(--replay-on);
      color: var(--ink);
      border-color: var(--hairline-strong);
    }
    html[data-scheme="light"] .tog {
      background: var(--paper);
      border-color: var(--hairline-strong);
    }
    html[data-scheme="light"] .tog-la .face { box-shadow: inset 0 0 0 5px var(--paper); }
    html[data-scheme="light"] .tog-la input:checked + .face { box-shadow: none; }
    html[data-scheme="light"] .track-btn {
      color: var(--lab, var(--ink));
      background: color-mix(in srgb, var(--crayon, var(--paper)) 22%, var(--paper));
      border-color: var(--hairline-strong);
      opacity: 0.4;
    }
    html[data-scheme="light"] .track-btn.hot {
      opacity: 1;
      box-shadow: 0 0 10px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    html[data-scheme="light"] .track-btn[aria-pressed="true"] {
      outline: 1px solid var(--ink);
      outline-offset: 1px;
    }
    html[data-scheme="light"] .tune-line { color: rgb(76, 151, 189); }
    html[data-scheme="light"] .chroma .bar.on .lab { color: var(--lab); }
    html[data-scheme="light"] .chip {
      background: var(--crayon);
      color: var(--lab);
      border-color: var(--hairline-strong);
      box-shadow: 0 0 6px color-mix(in srgb, var(--crayon) 20%, transparent);
    }
    html[data-scheme="light"] .board-well {
      background: color-mix(in srgb, var(--ink) 5%, var(--paper));
      box-shadow: inset 0 1px 2px rgba(40, 32, 24, 0.07);
    }
    html[data-scheme="light"] .white {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.7),
        inset 0 -10px 14px rgba(40, 32, 24, 0.06);
    }
    html[data-scheme="light"] .white .name { color: var(--ink); opacity: 0.42; }
    html[data-scheme="light"] .key.on .name { color: var(--lab); opacity: 1; }
    html[data-scheme="light"] .black .name { color: #efe8dc; opacity: 0.4; }
    html[data-scheme="light"] .key.on {
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        0 0 14px color-mix(in srgb, var(--crayon) var(--glow), transparent);
    }
    html[data-scheme="light"] .legend {
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 12px 12px 10px;
    }
    html[data-scheme="light"] .pencil {
      min-height: 88px;
      padding: 8px 4px 6px;
      background: var(--crayon);
      color: var(--lab);
      border: 1px solid color-mix(in srgb, var(--ink) 16%, var(--crayon));
    }
    html[data-scheme="light"] .err { color: rgb(159, 56, 57); }
    html[data-scheme="light"] details.adv select {
      background: var(--paper);
      color: var(--ink);
    }
    @supports (color: color(display-p3 1 0 0)) {
      html[data-scheme="light"] .pencil,
      html[data-scheme="light"] .chip,
      html[data-scheme="light"] .track-btn {
        background: var(--crayon-p3, var(--crayon));
      }
    }
  </style>
</head>
<body>
  <div class="top">
    <h1>Piano-crayon</h1>
    <div class="scenes" role="radiogroup" aria-label="Ambiance">
      <button type="button" class="scene scene-auto" data-theme-auto aria-label="Auto" title="Auto">A</button>
      <button type="button" class="scene" data-theme-set="day" aria-label="Jour" title="Jour"></button>
      <button type="button" class="scene" data-theme-set="light" aria-label="Clair" title="Clair"></button>
      <button type="button" class="scene" data-theme-set="dark" aria-label="Sombre" title="Sombre"></button>
      <button type="button" class="scene" data-theme-set="night" aria-label="Soir" title="Soir"></button>
      <button type="button" class="scene" data-theme-set="stealth" aria-label="Scène" title="Scène"></button>
    </div>
  </div>

  <div class="work">
  <div class="work-main">
  <div class="row">
    <button id="replay" type="button" aria-label="Rejouer">
      <span class="icon" aria-hidden="true"></span>
    </button>
    <button id="btn" type="button" aria-label="Écouter">
      <span class="icon" aria-hidden="true"></span>
    </button>
    <div class="toggles">
      <label class="tog tog-chords" title="Accords" aria-label="Accords">
        <input id="chords" type="checkbox" checked>
        <span class="face" aria-hidden="true"></span>
      </label>
      <label class="tog tog-son" title="Son" aria-label="Son">
        <input id="unmute" type="checkbox">
        <span class="face" aria-hidden="true"></span>
      </label>
      <label class="tog tog-la" title="La" aria-label="La">
        <input id="autotune" type="checkbox" checked>
        <span class="face" aria-hidden="true"></span>
      </label>
    </div>
  </div>
  <div class="tracks" id="tracks" role="group" aria-label="Pistes"></div>
  <div id="tuneLine" class="tune-line">440</div>
  <div class="scrub">
    <div
      id="arrange"
      class="arrange"
      role="slider"
      tabindex="0"
      aria-label="Temps"
      aria-valuemin="0"
      aria-valuemax="0"
      aria-valuenow="0"
      aria-valuetext="0:00"
    >
      <div class="arrange-ruler" id="ruler" aria-hidden="true"></div>
      <div class="arrange-stack" id="arrangeStack">
        <div class="arrange-heads" id="arrangeHeads"></div>
        <div class="arrange-lane" id="arrangeLane">
          <canvas id="wave" aria-hidden="true"></canvas>
          <div class="playhead" id="playhead"></div>
        </div>
      </div>
    </div>
    <div id="clock" class="clock">0:00</div>
  </div>
  <div id="err" class="err" hidden></div>

  <div id="chroma" class="chroma" aria-label="Crayons allumés"></div>
  <div class="chips" id="chips">
    <span class="hz-live" id="hzLive"></span>
  </div>
  </div>
  <aside class="spec-panel">
    <h3>Spectre · sources regroupées</h3>
    <canvas id="spec" width="640" height="320" aria-label="Spectre log-hertz, sources regroupées"></canvas>
  </aside>
  </div>

  <div class="type-well">
    <div class="type-head">
      <button type="button" id="typeClear" class="type-clear" aria-label="Effacer">⌫</button>
      <pre id="typeOut" class="type-out" aria-live="polite"></pre>
      <p id="kbMeta" class="kb-meta">0 touche · 0 groupe</p>
    </div>
    <div class="dual-boards" id="dualBoards"></div>
  </div>
  <div class="board-well piano-strip">
    <div class="board-wrap">
      <div id="board" role="group" aria-label="Piano entier, La0 à Do8"></div>
    </div>
  </div>

  <section class="legend">
    <h2>Crayons</h2>
    <div id="pencils" class="pencils"></div>
  </section>

  <details class="adv">
    <summary>Micro</summary>
    <label>
      Micro
      <select id="micAlt">
        <option value="os">OS</option>
      </select>
    </label>
  </details>

  <script src="dual_keyboard.js"></script>
  <script>
(function () {
  "use strict";

  const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  /* Canonical crayon RGB = macOS Crayons.clr picker (full sat on keys + legend).
     Pressed keys / chips / chroma / pencils use rgb (and matching display-p3).
     Do  Maraschino  251,2,7
     Do♯ Cayenne     198,64,42   (enamel; picker 128,0,2)
     Ré  Tangerine   253,128,8
     Ré♯ Lemon       255,255,10
     Mi  Lime        128,255,8
     Fa  Spring      33,255,6
     Fa♯ Fern        52,168,88   (enamel; picker 64,128,2)
     Sol Spindrift   102,255,204
     Sol♯ Sky        102,204,255
     La  Blueberry   0,0,255
     La♯ Grape       128,0,255
     Si  Magenta     251,2,255 */
  const CRAYONS = {
